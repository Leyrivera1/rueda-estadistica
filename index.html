, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .27; k = 3: .29; k = 4: .22; k = 5: .19). Sizes: “normal operation” 36%; “overload” 41%; “abnormal vibration” 23%.","Three profiles were found (normal operation, overload, abnormal vibration); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]},"der":{"es":["Identificar tipologías de conflictos según las características de la demanda.","400 demandas, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,27; k = 3: 0,30; k = 4: 0,24; k = 5: 0,23). Tamaños: «laborales de bajo monto» 43 %; «de familia» 31 %; «contractuales complejos» 26 %.","Se encontraron tres perfiles (laborales de bajo monto, de familia, contractuales complejos); cada uno se describe por sus promedios en las variables. La silueta respalda la elección de tres grupos. Los perfiles describen cómo se agrupan las unidades; no explican por qué pertenecen a cada grupo.","Si la silueta hubiera sido baja con cualquier número de grupos, no habría una estructura de grupos clara en los datos."],"en":["Identify conflict types by lawsuit characteristics.","400 lawsuits, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .27; k = 3: .30; k = 4: .24; k = 5: .23). Sizes: “low-value labor” 43%; “family” 31%; “complex contractual” 26%.","Three profiles were found (low-value labor, family, complex contractual); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]}},"corresp":{"sal":{"es":["Describir la relación entre el nivel educativo y el motivo de consulta.","Tabla 3 × 3 con 600 casos: χ²(4) = 156,5; p < 0,001. La dimensión 1 explica el 72,0 % de la inercia y la dimensión 2, el 28,0 %.","En el mapa, «primaria» queda cerca de «enfermedad infecciosa» y «universitaria» cerca de «chequeo preventivo»: esas categorías tienden a presentarse juntas. La primera dimensión, que separa esos dos extremos, resume el 72 % de la asociación de la tabla. El mapa describe asociaciones; la prueba χ² confirma que la asociación es significativa.","Si el χ² no hubiera sido significativo, las cercanías del mapa podrían deberse al azar."],"en":["Describe the relationship between education level and reason for visit.","3 × 3 table with 600 cases: χ²(4) = 156.5, p < .001. Dimension 1 explains 72.0% of the inertia and dimension 2 28.0%.","On the map, “primary” lies near “infectious disease” and “university” near “preventive check-up”: these categories tend to occur together. The first dimension, which separates those two extremes, captures 72% of the table's association. The map describes associations; the χ² test confirms the association is significant.","If χ² had not been significant, the closeness on the map could be due to chance."]},"edu":{"es":["Describir la relación entre el tipo de colegio de origen y el área de la carrera elegida.","Tabla 3 × 3 con 600 casos: χ²(4) = 214,6; p < 0,001. La dimensión 1 explica el 84,7 % de la inercia y la dimensión 2, el 15,3 %.","En el mapa, «público rural» queda cerca de «licenciaturas» y «privado urbano» cerca de «ingenierías»: esas categorías tienden a presentarse juntas. La primera dimensión, que separa esos dos extremos, resume el 85 % de la asociación de la tabla. El mapa describe asociaciones; la prueba χ² confirma que la asociación es significativa.","Si el χ² no hubiera sido significativo, las cercanías del mapa podrían deberse al azar."],"en":["Describe the relationship between type of high school and chosen field of study.","3 × 3 table with 600 cases: χ²(4) = 214.6, p < .001. Dimension 1 explains 84.7% of the inertia and dimension 2 15.3%.","On the map, “rural public” lies near “teacher education” and “urban private” near “engineering”: these categories tend to occur together. The first dimension, which separates those two extremes, captures 85% of the table's association. The map describes associations; the χ² test confirms the association is significant.","If χ² had not been significant, the closeness on the map could be due to chance."]},"soc":{"es":["Describir la relación entre el grupo de edad y la red social preferida.","Tabla 3 × 3 con 600 casos: χ²(4) = 191,8; p < 0,001. La dimensión 1 explica el 75,4 % de la inercia y la dimensión 2, el 24,6 %.","En el mapa, «18–29 años» queda cerca de «video corto» y «50 años o más» cerca de «mensajería»: esas categorías tienden a presentarse juntas. La primera dimensión, que separa esos dos extremos, resume el 75 % de la asociación de la tabla. El mapa describe asociaciones; la prueba χ² confirma que la asociación es significativa.","Si el χ² no hubiera sido significativo, las cercanías del mapa podrían deberse al azar."],"en":["Describe the relationship between age group and preferred social network.","3 × 3 table with 600 cases: χ²(4) = 191.8, p < .001. Dimension 1 explains 75.4% of the inertia and dimension 2 24.6%.","On the map, “18–29” lies near “short video” and “50+” near “messaging”: these categories tend to occur together. The first dimension, which separates those two extremes, captures 75% of the table's association. The map describes associations; the χ² test confirms the association is significant.","If χ² had not been significant, the closeness on the map could be due to chance."]},"adm":{"es":["Describir la relación entre el segmento de cliente y el canal de compra.","Tabla 3 × 3 con 600 casos: χ²(4) = 177,2; p < 0,001. La dimensión 1 explica el 74,0 % de la inercia y la d ies tend to occur together. The first dimension, which separates those two extremes, captures 83% of the table's association. The map describes associations; the χ² test confirms the association is significant.","If χ² had not been significant, the closeness on the map could be due to chance."]},"ing":{"es":["Describir la relación entre el tipo de falla y el componente afectado.","Tabla 3 × 3 con 600 casos: χ²(4) = 194,5; p < 0,001. La dimensión 1 explica el 74,1 % de la inercia y la dimensión 2, el 25,9 %.","En el mapa, «sobrecalentamiento» queda cerca de «motor» y «fuga» cerca de «sellos»: esas categorías tienden a presentarse juntas. La primera dimensión, que separa esos dos extremos, resume el 74 % de la asociación de la tabla. El mapa describe asociaciones; la prueba χ² confirma que la asociación es significativa.","Si el χ² no hubiera sido significativo, las cercanías del mapa podrían deberse al azar."],"en":["Describe the relationship between failure type and affected component.","3 × 3 table with 600 cases: χ²(4) = 194.5, p < .001. Dimension 1 explains 74.1% of the inertia and dimension 2 25.9%.","On the map, “overheating” lies near “motor” and “leak” near “seals”: these categories tend to occur together. The first dimension, which separates those two extremes, captures 74% of the table's association. The map describes associations; the χ² test confirms the association is significant.","If χ² had not been significant, the closeness on the map could be due to chance."]},"der":{"es":["Describir la relación entre el tipo de delito y la franja horaria.","Tabla 3 × 3 con 600 casos: χ²(4) = 159,7; p < 0,001. La dimensión 1 explica el 77,4 % de la inercia y la dimensión 2, el 22,6 %.","En el mapa, «hurto a personas» queda cerca de «noche» y «estafa» cerca de «mañana»: esas categorías tienden a presentarse juntas. La primera dimensión, que separa esos dos extremos, resume el 77 % de la asociación de la tabla. El mapa describe asociaciones; la prueba χ² confirma que me students in the first and last term.","180 students classified twice. In the first term: low 30.6%; basic 47.2%; high 22.2%. In the last term: low 22.8%; basic 50.0%; high 27.2%. Stuart-Maxwell test: χ²(2) = 12.34, p = .002.","Because p < .05, the distribution of categories is not the same in the first term and in the last term: the largest increase is in “high” (from 22.2% to 27.2%) and the largest decrease in “low” (from 30.6% to 22.8%). The test compares the totals of the two classifications of the same units.","If p had been ≥ .05, there would be no evidence that the two classifications distribute the units differently."]},"soc":{"es":["Comparar la clasificación de la gravedad de la ansiedad hecha por dos psicólogos en los mismos pacientes.","160 pacientes clasificados dos veces. Según el psicólogo A: leve 36,9 %; moderada 41,9 %; grave 21,2 %. Según el psicólogo B: leve 30,6 %; moderada 41,2 %; grave 28,1 %. Prueba de Stuart-Maxwell: χ²(2) = 12,17; p = 0,002.","Como p < 0,05, la distribución de las categorías no es la misma según el psicólogo A y según el psicólogo B: el mayor aumento está en «grave» (de 21,2 % a 28,1 %) y la mayor disminución en «leve» (de 36,9 % a 30,6 %). La prueba compara los totales de las dos clasificaciones de las mismas unidades.","Si p hubiera sido ≥ 0,05, no habría evidencia de que las dos clasificaciones repartan a las unidades de forma distinta."],"en":["Compare anxiety severity classifications made by two psychologists for the same patients.","160 patients classified twice. According to psychologist A: mild 36.9%; moderate 41.9%; severe 21.2%. According to psychologist B: mild 30.6%; moderate 41.2%; severe 28.1%. Stuart-Maxwell test: χ²(2) = 12.17, p = .002.","Because p < .05, the distribution of categories is not the same according to psychologist A and according to psychologist B: the largest increase is in “severe” (from 21.2% to 28.1%) and the largest decrease in “mild” (from 36.9% to 30.6%). The test compares the totals of    <div class="acoh"><div class="lbl">${u("a_coh")}</div><p>${u("c_scope")} <b>${esc(a.n.toLowerCase())}</b>. ${u("a_verbs")}: ${a.verbs.slice(0,5).map(esc).join(", ")}.</p><p><i>${u("a_ex")} (${esc(areaById[area].n)}): ${esc(ex(first.id)[0])}</i></p></div>
   <p class="hint">${narrow()?u("a_hint1"):u("a_hint2")}</p>`}
 else{const n=DT()[aNode];body=`<div><div class="lbl">${u("a_step")} ${aTrail.length+1}</div><p class="aq">${esc(n.q)}</p>${n.h?`<p class="ah">${esc(n.h)}</p>`:""}</div><div class="aopts">${n.o.map((o,i)=>`<button class="aopt" data-i="${i}"><b>${esc(o.t)}</b>${o.d?`<span>${esc(o.d)}</span>`:""}</button>`).join("")}</div>`}
 box.innerHTML=trail+body+tools;
 box.querySelectorAll(".aopt").forEach(b=>b.onclick=()=>aAnswer(+b.dataset.i));
 box.querySelectorAll(".rbtn").forEach(b=>b.onclick=()=>{box.querySelectorAll(".rbtn").forEach(x=>x.classList.toggle("on",x===b));select(b.dataset.id,false);if(narrow())document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"})});
 const bb=document.getElementById("aback");if(bb)bb.onclick=aBack;const br=document.getElementById("areset");if(br)br.onclick=aReset}

// ---------- practice mode ----------
const quiz={qs:null,i:0,score:0,ans:[]};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const CAUSAL=new Set(["did","iv","propensity","doe","ancova","factorial","panel"]);
function related(a,b){return a.f===b.f||a.alt.some(x=>x.id===b.id)||b.alt.some(x=>x.id===a.id)}
const GENERIC=new Set(["cont","aleat","simet","ind","normal"]);
const FAMS={normal:"norm",normgr:"norm",normres:"norm",normdif:"norm",normmult:"norm",homovar:"var",homoc:"var",homocov:"var",pareado:"pair",emparej:"pair",agrup:"pair",censura:"cens",propriesg:"cens",refstd:"ref",prev:"ref"};
const famOf=t=>FAMS[t]||t;
const NODIST=new Set(["pois","mix","panel","clus","sem","afc","logm"]);
function makeQs(){
 const ids=shuf(T.map(t=>t.id)),out=[];const types=shuf([1,1,2,2,2,3,3,4,4,4]);
 const tested=T.filter(t=>EX[t.id][area].es[3]&&/p\s?[=<]/.test(EX[t.id][area].es[1])).map(t=>t.id);
 const pool3=shuf(tested);const pool4=shuf(T.filter(t=>SUP[t.id].t.length&&SUP[t.id].k!==undefined&&!GENERIC.has(SUP[t.id].t[SUP[t.id].k])).map(t=>t.id));let k=0,k3=0,k4=0;
 for(const ty of types){
  if(ty===3){const id=pool3[k3++];out.push({ty,id,mis:shuf(MIS.es.map((m,i)=>i).filter(i=>!(CAUSAL.has(id)&&MIS.es[i].c))).slice(0,3)});continue}
  if(ty===4){let id;do{id=pool4[k4++]}while(out.some(o=>o.id===id));const S=SUP[id],fams=new Set(S.t.map(famOf));
   const ds=shuf(pool4.filter(x=>x!==id&&!related(byId[id],byId[x])&&!NODIST.has(x)&&!GENERIC.has(SUP[x].t[SUP[x].k])&&!fams.has(famOf(SUP[x].t[SUP[x].k]))));const pick=[];
   for(const x of ds){if(pick.length===3)break;if(!pick.some(p=>famOf(SUP[p].t[SUP[p].k])===famOf(SUP[x].t[SUP[x].k])))pick.push(x)}
   out.push({ty,id,ds:pick});continue}
  let id;do{id=ids[k++]}while(out.some(o=>o.id===id));
  if(ty===1)out.push({ty,id});
  else{const t=byId[id];const ds=shuf(T.filter(x=>x.id!==id&&!related(t,x)&&x.lv===t.lv)).slice(0,3).map(x=>x.id);out.push({ty,id,ds})}}
 out.forEach(o=>{o.order=shuf(o.ty===1?["des","rel","exp","pre"]:o.ty===2||o.ty===4?[o.id,...o.ds]:[-1,...o.mis])});
 return out}
function qStart(){quiz.qs=makeQs();quiz.i=0;quiz.score=0;quiz.ans=[];qRender()}
function qOptLabel(o,v){if(o.ty===1)return AL[v].n;if(o.ty===2)return byId[v].n;if(o.ty===4){const S=SUP[v];return S[lang].s[S.k].replace(/ \([A-ZÁÉÍÓÚ][^()]*\d{4}\)/g,"")}return v===-1?ex(o.id)[2]:MIS[lang][v].t}
function qRender(){const box=document.getElementById("quiz");
 if(!quiz.qs){box.innerHTML=`<p>${esc(u("q_intro"))}</p><div class="qbtns"><button class="qbtn" id="qgo">${u("q_start")}</button></div>`;document.getElementById("qgo").onclick=qStart;return}
 const prog=`<div class="qprog" aria-hidden="true">${quiz.qs.map((_,i)=>`<i class="${i<quiz.ans.length?(quiz.ans[i]?"ok":"no"):i===quiz.i?"cur":""}"></i>`).join("")}</div>`;
 if(quiz.i>=quiz.qs.length){box.innerHTML=`<div class="qhead">${prog}<span class="qscore">${u("q_score")}: ${quiz.score}/${quiz.qs.length}</span></div><div class="qend"><div class="lbl">${u("q_end")}</div><div class="big">${quiz.score} ${u("q_of")} ${quiz.qs.length}</div><p>${esc(u("q_endp"))}</p></div><div class="qbtns"><button class="qbtn" id="qgo">${u("q_again")}</button></div>`;document.getElementById("qgo").onclick=qStart;return}
 const o=quiz.qs[quiz.i],t=byId[o.id],e=ex(o.id),done=quiz.ans.length>quiz.i;
 let stem;
 if(o.ty===1)stem=`<p class="qq">${u("q_s1")}</p><div class="qctx"><span><b>${u("q_obj")}:</b> ${esc(e[0])}</span></div>`;
 else if(o.ty===2)stem=`<p class="qq">${u("q_s2")}</p><div class="qctx"><span><b>${u("q_obj")}:</b> ${esc(e[0])}</span><span><b>${u("q_vars")}:</b> ${esc(t.vars)}</span><span><b>${u("q_data")}:</b> ${esc(t.dist)}</span></div>`;
 else if(o.ty===4)stem=`<p class="qq">${u("q_s4").replace("{t}",esc(t.n))}</p>`;
 else stem=`<p class="qq">${u("q_s3")}</p><div class="qctx"><span><b>${u("q_obj")}:</b> ${esc(e[0])}</span></div><p class="qres">${esc(e[1])}</p>`;
 const right=o.ty===1?t.al:o.ty===2||o.ty===4?o.id:-1;
 const opts=o.order.map((v,i)=>{let cls="";if(done){if(v===right)cls="right";else if(v===quiz.pick)cls="wrong"}return`<button class="qopt ${cls}" data-i="${i}" ${done?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(qOptLabel(o,v))}</span></button>`}).join("");
 let fb="";
 if(done){const ok=quiz.ans[quiz.i];let why;
  if(o.ty===1){const a=AL[t.al];why=u("q_why1").replace("{al}",esc(a.n.toLowerCase())).replace("{q}",esc(a.q)).replace("{t}",esc(t.n))}
  else if(o.ty===2){why=u("q_why2").replace("{t}",esc(t.n)).replace("{para}",esc(t.para));if(!ok){const c=byId[quiz.pick];why+="<br>"+u("q_why2b").replace("{c}",esc(c.n)).replace("{para}",esc(c.para))}}
  else if(o.ty===4){const S=SUP[o.id][lang];why=u("q_why4").replace("{t}",esc(t.n))+"<ul>"+S.s.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";if(!ok){const c=byId[quiz.pick];why+=u("q_why4b").replace("{c}",esc(c.n))}}
  else{why=ok?esc(t.n)+".":esc(MIS[lang][quiz.pick].w)+"<br>"+u("q_why3")+" <i>"+esc(e[2])+"</i>"}
  fb=`<div class="qfb"><span class="v ${ok?"ok":"no"}">${ok?u("q_ok"):u("q_no")}</span><p>${why}</p></div><div class="qbtns"><button class="qbtn" id="qnext">${u("q_next")}</button><button class="qbtn alt" id="qcard">${u("q_card")} ${esc(short(t))}</button></div>`}
 box.innerHTML=`<div class="qhead">${prog}<span class="qscore">${quiz.i+1} ${u("q_of")} ${quiz.qs.length} · ${u("q_score")}: ${quiz.score}</span></div><div><span class="qtype">${u("q_t"+o.ty)}</span></div><div class="qstem">${stem}</div><div class="qopts">${opts}</div>${fb}`;
 box.querySelectorAll(".qopt:not([disabled])").forEach(b=>b.onclick=()=>{const v=o.order[+b.dataset.i];quiz.pick=v;const ok=v===right;quiz.ans.push(ok);if(ok)quiz.score++;qRender();const n=document.getElementById("qnext");if(n)n.focus({preventScroll:true})});
 const n=document.getElementById("qnext");if(n)n.onclick=()=>{quiz.i++;quiz.pick=null;qRender();const f=box.querySelector(".qopt");if(f)f.focus({preventScroll:true})};
 const c=document.getElementById("qcard");if(c)c.onclick=()=>goTo(o.id,"card")}

// ---------- sections ----------
function drawStairs(){
 document.getElementById("stairs").innerHTML=Object.entries(AL).map(([k,a])=>{const tests=ORDER.filter(t=>t.al===k);
  return `<div class="step"><div class="top" style="background:${alColor(k)}"><span class="n">${u("st_lv")} ${a.k}</span><h3>${esc(a.n)}</h3></div><div class="bd">
   <p class="q">${esc(a.q)}</p><p class="reach">${esc(a.reach)}</p>
   <div><div class="lbl">${u("st_verbs")}</div><div class="tags">${a.verbs.map(v=>`<span class="tag verb" style="background:${alTint(k)}">${esc(v)}</span>`).join("")}</div></div>
   <div><div class="lbl">${u("st_words")}</div><div class="tags">${a.words.map(v=>`<span class="tag">${esc(v)}</span>`).join("")}</div></div>
   <div><div class="lbl">${u("st_ex")} (${esc(areaById[area].n)})</div><p class="exo">${esc(a.ex[area])}</p></div>
   <div><div class="lbl">${u("st_tests")} (${tests.length})</div><div class="tags">${tests.slice(0,10).map(t=>`<button class="tbtn" data-go="${t.id}">${esc(short(t))}</button>`).join("")}${tests.length>10?`<span class="tag">+${tests.length-10} ${u("st_more")}</span>`:""}</div></div>
   <button class="see" data-al="${k}">${u("st_see")}</button></div></div>`}).join("");
 document.querySelectorAll("#stairs [data-go]").forEach(b=>b.onclick=()=>goTo(b.dataset.go,true));
 document.querySelectorAll("#stairs [data-al]").forEach(b=>b.onclick=()=>{zoomTo({k:"root"});setFilter(b.dataset.al);document.getElementById("wheelbox").scrollIntoView({behavior:"smooth",block:"start"})})}
function drawSections(){
 document.getElementById("swap").innerHTML=AVOID.map(([a,b])=>`<li><span class="strike">${esc(a)}</span><span class="arr" aria-hidden="true">→</span><span>${esc(b)}</span></li>`).join("");
 let h=`<thead><tr><th>${u("map_sc")}</th>${LV.map(l=>`<th>${esc(l.n)}</th>`).join("")}</tr></thead><tbody>`;
 Object.entries(AL).forEach(([k,a])=>{h+=`<tr><td class="rowh" style="white-space:nowrap"><span class="dot" style="background:${alColor(k)};margin-right:8px"></span>${esc(a.n)}</td>`;
  LV.forEach(l=>{const all=ORDER.filter(t=>t.lv===l.id),m=all.filter(t=>t.al===k);if(!m.length){h+=`<td class="none">—</td>`;return}
   const fams=[...new Set(m.map(t=>famById[t.f].n))],pct=Math.round(m.length/all.length*100);
   h+=`<td><div class="cov"><div class="bar" aria-hidden="true"><i style="width:${pct}%;background:${alColor(k)}"></i></div><small>${m.length} ${u("map_of")} ${all.length} ${u("map_tests")}</small><span>${esc(fams.join("; "))}</span></div></td>`});h+=`</tr>`});
 document.getElementById("map").innerHTML=h+"</tbody>";
 const b=ids=>ids.map(id=>`<button class="tbtn" data-go="${id}">${esc(short(byId[id]))}</button>`).join(" ");
 document.getElementById("param").innerHTML=`<thead><tr><th>${u("nor_c1")}</th><th>${u("nor_c2")}</th><th>${u("nor_c3")}</th></tr></thead><tbody>${PROWS[lang].map((r,i)=>`<tr><td class="rowh">${esc(r)}</td><td>${b(PROWS_IDS[i][0])}</td><td>${b(PROWS_IDS[i][1])}</td></tr>`).join("")}</tbody>`;
 document.querySelectorAll("#param [data-go]").forEach(x=>x.onclick=()=>goTo(x.dataset.go,true));
 document.getElementById("flags").innerHTML=FLAGS[lang].map(([a,b])=>`<div class="flag"><p class="bad">${a}</p><p class="fix">${b}</p></div>`).join("");
 document.getElementById("notinc").innerHTML=NOTINC[lang].map(([a,b])=>`<li><b>${esc(a)}</b>${b?esc(b):""}</li>`).join("");
 document.getElementById("gloss").innerHTML=GLOSS[lang].map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("");
 const keys=new Set(T.flatMap(t=>t.src));["altman1995","wasserstein2016","shmueli2010"].forEach(k=>keys.add(k));
 const list=[...keys].map(k=>refTxt(R[k])).sort((a,b)=>a.replace(/<[^>]+>/g,"").localeCompare(b.replace(/<[^>]+>/g,""),lang));
 document.getElementById("biblio").innerHTML=list.map(r=>`<li>${linkify(r)}</li>`).join("");
 document.getElementById("apa").innerHTML=u("apaHTML")+(DOI?linkify("https://doi.org/"+DOI):u("doiPh"))}
document.getElementById("copyapa").onclick=()=>{const m=document.getElementById("copymsg");const txt=u("apaTXT")+(DOI?"https://doi.org/"+DOI:u("doiPh"));
 const done=()=>{m.textContent=u("ci_ok")};const fail=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("apa"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent=u("ci_fail")};
 try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}};

// ---------- static text and language switch ----------
function applyStatic(){
 document.documentElement.lang=lang;document.title=u("title");
 document.querySelectorAll("[data-i]").forEach(n=>{n.innerHTML=u(n.dataset.i)});
 q.placeholder=u("qph");q.setAttribute("aria-label",u("qaria"));
 document.getElementById("crumbs").setAttribute("aria-label",u("crumbsAria"));legend.setAttribute("aria-label",u("legendAria"));
 areasEl.setAttribute("aria-label",u("areasAria"));document.getElementById("modes").setAttribute("aria-label",u("modesAria"));
 document.getElementById("l-es").setAttribute("aria-pressed",String(lang==="es"));document.getElementById("l-en").setAttribute("aria-pressed",String(lang==="en"));
 document.querySelector('meta[name="description"]')?.setAttribute("content",lang==="en"?"Statistics Wheel: an interactive guide to univariate, bivariate and multivariate statistical tests, with research scopes, hypotheses, interpretation examples by field and APA 7 references.":"Rueda Estadística: guía interactiva de pruebas estadísticas univariadas, bivariadas y multivariadas, con alcances, hipótesis, ejemplos de interpretación por área y referencias en APA 7.")}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("rueda-lang",l)}catch(e){}
 loadLang();applyStatic();buildWheel();render();paint();crumbs();drawAreas();drawLegend();drawStairs();drawSections();aRender();select(sel,false);if(sugg&&!sugg.hidden)showSugg();qRender()}
document.getElementById("l-es").onclick=()=>setLang("es");document.getElementById("l-en").onclick=()=>setLang("en");

// ---------- init ----------
applyStatic();buildWheel();drawAreas();drawLegend();crumbs();render();drawStairs();drawSections();aRender();qRender();
function fromHash(){let h=decodeURIComponent(location.hash.slice(1));
 const m=h.match(/^(en|es)(?:\/(.*))?$/);if(m){setLang(m[1]);h=m[2]||""}
 if(h==="asistente"){setMode("dec");document.getElementById("pane-dec").scrollIntoView({block:"start"});return true}
 if(h==="practica"){document.getElementById("practica").scrollIntoView({block:"start"});return true}
 if(byId[h]){goTo(h);return true}return false}
if(!fromHash()||!document.getElementById("card").innerHTML)select(sel,false);
booted=true;
addEventListener("hashchange",fromHash);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(render,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
</script>
