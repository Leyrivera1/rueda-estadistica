iable."]}},"roc":{"sal":{"es":["Evaluar la capacidad del índice X para predecir preeclampsia.","Índice X en 300 gestantes (60 con el evento): AUC = 0,84 (IC 95 %: 0,77–0,90, método de Hanley y McNeil). Punto de corte de Youden ≥ 56: sensibilidad 78 %, especificidad 71 %.","Si se toma al azar una gestante que desarrolló preeclampsia y otra que no, en el 84 % de los casos el índice es más alto en la que la desarrolló: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate the ability of index X to predict preeclampsia.","Index X in 300 pregnant women (60 with the outcome): AUC = .84, 95% CI [.77, .90] (Hanley-McNeil method). Youden cut-off ≥ 56: sensitivity 78%, specificity 71%.","If you randomly pick a woman who developed preeclampsia and one who did not, in 84% of cases the index is higher in the one who did: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"edu":{"es":["Evaluar la capacidad del puntaje de alerta temprana para predecir la deserción.","Puntaje de alerta en 400 estudiantes (90 con el evento): AUC = 0,83 (IC 95 %: 0,77–0,88, método de Hanley y McNeil). Punto de corte de Youden ≥ 56: sensibilidad 81 %, especificidad 71 %.","Si se toma al azar un estudiante que desertó y otro que no, en el 83 % de los casos el puntaje es más alto en el que desertó: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate the ability of an early-warning score to predict dropout.","Warning score in 400 students (90 with the outcome): AUC = .83, 95% CI [.77, .88] (Hanley-McNeil method). Youden cut-off ≥ 56: sensitivity 81%, specificity 71%.","If you randomly pick a student who dropped out and one who did not, in 83% of cases the score is higher in the one who dropped out: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"soc":{"es":["Evaluar la capacidad de una escala de tamizaje para identificar riesgo suicida.","Escala de tamizaje en 300 personas (50 con el evento): AUC = 0,86 (IC 95 %: 0,79–0,92, método de Hanley y McNeil). Punto de corte de Youden ≥ 56: sensibilidad 90 %, especificidad 66 %.","Si se toma al azar una persona en riesgo y otra sin riesgo, en el 86 % de los casos el puntaje es más alto en la persona en riesgo: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate a screening scale's ability to identify suicide risk.","Screening scale in 300 people (50 with the outcome): AUC = .86, 95% CI [.79, .92] (Hanley-McNeil method). Youden cut-off ≥ 56: sensitivity 90%, specificity 66%.","If you randomly pick a person at risk and one not at risk, in 86% of cases the score is higher in the person at risk: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"adm":{"es":["Evaluar la capacidad de un modelo para predecir la renuncia de los empleados.","Probabilidad estimada por el modelo en 400 empleados (70 con el evento): AUC = 0,83 (IC 95 %: 0,76–0,89, método de Hanley y McNeil). Punto de corte de Youden ≥ 57: sensibilidad 77 %, especificidad 73 %.","Si se toma al azar un empleado que renunció y otro que no, en el 83 % de los casos la probabilidad es más alta en el que renunció: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate a model's ability to predict employee resignation.","Model-estimated probability in 400 employees (70 with the outcome): AUC = .83, 95% CI [.76, .89] (Hanley-McNeil method). Youden cut-off ≥ 57: sensitivity 77%, specificity 73%.","If you randomly pick an employee who resigned and one who did not, in 83% of cases the probability is higher in the one who resigned: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"eco":{"es":["Evaluar la capacidad del puntaje de riesgo para predecir el impago.","Puntaje de riesgo crediticio en 600 clientes (80 con el evento): AUC = 0,82 (IC 95 %: 0,77–0,88, método de Hanley y McNeil). Punto de corte de Youden ≥ 58: sensibilidad 71 %, especificidad 78 %.","Si se toma al azar un cliente que incumplió y otro que no, en el 82 % de los casos el puntaje de riesgo es más alto en el que incumplió: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate a risk score's ability to predict default.","Credit risk score in 600 clients (80 with the outcome): AUC = .82, 95% CI [.77, .88] (Hanley-McNeil method). Youden cut-off ≥ 58: sensitivity 71%, specificity 78%.","If you randomly pick a client who defaulted and one who did not, in 82% of cases the risk score is higher in the one who defaulted: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"ing":{"es":["Evaluar la capacidad del índice de vibración para predecir la falla de rodamientos en 30 días.","Índice de vibración en 300 rodamientos (40 con el evento): AUC = 0,88 (IC 95 %: 0,81–0,95, método de Hanley y McNeil). Punto de corte de Youden ≥ 57: sensibilidad 88 %, especificidad 77 %.","Si se toma al azar un rodamiento que falló y otro que no, en el 88 % de los casos el índice es más alto en el que falló: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate a vibration index's ability to predict bearing failure within 30 days.","Vibration index in 300 bearings (40 with the outcome): AUC = .88, 95% CI [.81, .95] (Hanley-McNeil method). Youden cut-off ≥ 57: sensitivity 88%, specificity 77%.","If you randomly pick a bearing that failed and one that did not, in 88% of cases the index is higher in the one that failed: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]},"der":{"es":["Evaluar la capacidad del instrumento de riesgo para predecir la reincidencia.","Puntaje del instrumento en 400 personas (120 con el evento): AUC = 0,84 (IC 95 %: 0,79–0,89, método de Hanley y McNeil). Punto de corte de Youden ≥ 58: sensibilidad 78 %, especificidad 78 %.","Si se toma al azar una persona que reincidió y otra que no, en el 84 % de los casos el puntaje es más alto en la que reincidió: la discriminación es excelente según Hosmer et al. (2013). El punto de corte elegido equilibra sensibilidad y especificidad; otro uso podría justificar otro corte.","Si el IC del AUC hubiera incluido 0,5, la prueba no discriminaría mejor que el azar."],"en":["Evaluate a risk instrument's ability to predict reoffending.","Instrument score in 400 people (120 with the outcome): AUC = .84, 95% CI [.79, .89] (Hanley-McNeil method). Youden cut-off ≥ 58: sensitivity 78%, specificity 78%.","If you randomly pick a person who reoffended and one who did not, in 84% of cases the score is higher in the one who reoffended: discrimination is excellent by Hosmer et al.'s (2013) benchmarks. The chosen cut-off balances sensitivity and specificity; another use could justify another cut-off.","If the AUC's CI had included .5, the test would discriminate no better than chance."]}},"disc":{"sal":{"es":["Clasificar a los pacientes en riesgo alto o bajo a partir de cinco parámetros clínicos.","200 pacientes (100 por grupo): lambda de Wilks = 0,74; F(5, 194) = 13,40; p < 0,001. Bien clasificados: 76 % con los mismos datos y 74 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 74 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify patients as high or low risk from five clinical parameters.","200 patients (100 per group): Wilks' Λ = .74; F(5, 194) = 13.40, p < .001. Correctly classified: 76% on the same data and 74% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 74% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"edu":{"es":["Clasificar a los estudiantes que aprobarán o reprobarán a partir de cinco indicadores de ingreso.","200 estudiantes (100 por grupo): lambda de Wilks = 0,71; F(5, 194) = 16,16; p < 0,001. Bien clasificados: 74 % con los mismos datos y 72 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 72 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify students who will pass or fail from five admission indicators.","200 students (100 per group): Wilks' Λ = .71; F(5, 194) = 16.16, p < .001. Correctly classified: 74% on the same data and 72% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 72% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"soc":{"es":["Clasificar a las personas con y sin trastorno de ansiedad a partir de cinco escalas.","200 personas (100 por grupo): lambda de Wilks = 0,73; F(5, 194) = 14,65; p < 0,001. Bien clasificados: 73 % con los mismos datos y 73 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 73 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify people with and without an anxiety disorder from five scales.","200 people (100 per group): Wilks' Λ = .73; F(5, 194) = 14.65, p < .001. Correctly classified: 73% on the same data and 73% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 73% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"adm":{"es":["Clasificar a las empresas exitosas o no exitosas a partir de cinco indicadores financieros.","200 empresas (100 por grupo): lambda de Wilks = 0,67; F(5, 194) = 18,90; p < 0,001. Bien clasificados: 75 % con los mismos datos y 74 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 74 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify firms as successful or not from five financial indicators.","200 firms (100 per group): Wilks' Λ = .67; F(5, 194) = 18.90, p < .001. Correctly classified: 75% on the same data and 74% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 74% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"eco":{"es":["Clasificar a los países con y sin crisis bancaria a partir de cinco indicadores macroeconómicos.","200 países (100 por grupo): lambda de Wilks = 0,70; F(5, 194) = 16,30; p < 0,001. Bien clasificados: 76 % con los mismos datos y 74 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 74 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify countries with and without banking crises from five macroeconomic indicators.","200 countries (100 per group): Wilks' Λ = .70; F(5, 194) = 16.30, p < .001. Correctly classified: 76% on the same data and 74% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 74% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"ing":{"es":["Clasificar las piezas conformes o no conformes a partir de cinco mediciones dimensionales.","200 piezas (100 por grupo): lambda de Wilks = 0,69; F(5, 194) = 17,50; p < 0,001. Bien clasificados: 76 % con los mismos datos y 74 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 74 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify parts as conforming or not from five dimensional measurements.","200 parts (100 per group): Wilks' Λ = .69; F(5, 194) = 17.50, p < .001. Correctly classified: 76% on the same data and 74% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 74% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]},"der":{"es":["Clasificar los procesos que terminarán en conciliación o en sentencia a partir de cinco características.","200 procesos (100 por grupo): lambda de Wilks = 0,70; F(5, 194) = 16,68; p < 0,001. Bien clasificados: 74 % con los mismos datos y 72 % con validación cruzada de 10 particiones.","Las variables separan los grupos: se espera que la función clasifique bien el 72 % de los casos nuevos. La cifra con los mismos datos es más optimista; la de validación cruzada es la que se debe reportar como desempeño esperado.","Si p hubiera sido ≥ 0,05, las variables no distinguirían entre los grupos."],"en":["Classify cases that will end in settlement or judgment from five characteristics.","200 cases (100 per group): Wilks' Λ = .70; F(5, 194) = 16.68, p < .001. Correctly classified: 74% on the same data and 72% with 10-fold cross-validation.","The variables separate the groups: the function is expected to classify 72% of new cases correctly. The same-data figure is optimistic; the cross-validated figure is the one to report as expected performance.","If p had been ≥ .05, the variables would not distinguish between the groups."]}},"arbol":{"sal":{"es":["Desarrollar un algoritmo para predecir el reingreso hospitalario a 30 días.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (600 casos, 193 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,89. Variables más importantes: hospitalizaciones previas y número de medicamentos.","El algoritmo distingue bien los pacientes que reingresan en datos que no se usaron para construirlo (AUC 0,89). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict 30-day hospital readmission.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (600 cases, 193 events) for validation. Training AUC = 1.00; validation AUC = .89. Most important variables: prior admissions and number of medications.","The algorithm distinguishes patients who are readmitted well in data not used to build it (AUC .89). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"edu":{"es":["Desarrollar un algoritmo para predecir la deserción con datos de la plataforma virtual.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (450 casos, 137 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,86. Variables más importantes: días sin ingresar y entregas atrasadas.","El algoritmo distingue bien los estudiantes que desertan en datos que no se usaron para construirlo (AUC 0,86). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict dropout from online-platform data.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (450 cases, 137 events) for validation. Training AUC = 1.00; validation AUC = .86. Most important variables: days without logging in and late submissions.","The algorithm distinguishes students who drop out well in data not used to build it (AUC .86). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"soc":{"es":["Desarrollar un algoritmo para identificar hogares en riesgo de violencia intrafamiliar con datos de servicios sociales.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (540 casos, 153 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,90. Variables más importantes: reportes previos y consumo de alcohol.","El algoritmo distingue bien los hogares con violencia reportada en datos que no se usaron para construirlo (AUC 0,90). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to identify households at risk of domestic violence from social-service data.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (540 cases, 153 events) for validation. Training AUC = 1.00; validation AUC = .90. Most important variables: prior reports and alcohol use.","The algorithm distinguishes households with reported violence well in data not used to build it (AUC .90). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"adm":{"es":["Desarrollar un algoritmo para predecir la fuga de clientes.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (750 casos, 243 eventos) para validar. AUC en entrenamiento = 0,99; AUC en validación = 0,82. Variables más importantes: caída de la frecuencia de compra y reclamos recientes.","El algoritmo distingue bien los clientes que se van en datos que no se usaron para construirlo (AUC 0,82). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict customer churn.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (750 cases, 243 events) for validation. Training AUC = .99; validation AUC = .82. Most important variables: drop in purchase frequency and recent complaints.","The algorithm distinguishes customers who leave well in data not used to build it (AUC .82). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"eco":{"es":["Desarrollar un algoritmo para predecir el impago de créditos.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (900 casos, 283 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,83. Variables más importantes: mora previa y nivel de endeudamiento.","El algoritmo distingue bien los clientes que incumplen en datos que no se usaron para construirlo (AUC 0,83). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict loan default.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (900 cases, 283 events) for validation. Training AUC = 1.00; validation AUC = .83. Most important variables: prior arrears and debt level.","The algorithm distinguishes clients who default well in data not used to build it (AUC .83). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"ing":{"es":["Desarrollar un algoritmo para predecir la falla de bombas a partir de sensores.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (360 casos, 106 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,85. Variables más importantes: temperatura del rodamiento y vibración.","El algoritmo distingue bien los bombas que fallan en datos que no se usaron para construirlo (AUC 0,85). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict pump failure from sensor data.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (360 cases, 106 events) for validation. Training AUC = 1.00; validation AUC = .85. Most important variables: bearing temperature and vibration.","The algorithm distinguishes pumps that fail well in data not used to build it (AUC .85). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]},"der":{"es":["Desarrollar un algoritmo para predecir el resultado de los procesos laborales a partir de la demanda.","Bosque aleatorio (300 árboles) con 30 variables; 70 % de los datos para entrenar y 30 % (480 casos, 126 eventos) para validar. AUC en entrenamiento = 1,00; AUC en validación = 0,85. Variables más importantes: tipo de pretensión y pruebas documentales.","El algoritmo distingue bien los procesos que se ganan en datos que no se usaron para construirlo (AUC 0,85). El AUC de entrenamiento es más alto, como es habitual; lo que importa es el de validación. La importancia de las variables indica qué usa el modelo para predecir, no que esas variables causen el resultado.","Si el AUC hubiera sido muy alto en entrenamiento y bajo en validación, el modelo estaría sobreajustado y no serviría para casos nuevos."],"en":["Develop an algorithm to predict labor case outcomes from the complaint.","Random forest (300 trees) with 30 variables; 70% of the data for training and 30% (480 cases, 126 events) for validation. Training AUC = 1.00; validation AUC = .85. Most important variables: type of claim and documentary evidence.","The algorithm distinguishes cases that are won well in data not used to build it (AUC .85). Training AUC is higher, as usual; validation AUC is what matters. Variable importance shows what the model uses to predict, not that those variables cause the outcome.","If AUC had been very high in training and low in validation, the model would be overfitted and useless for new cases."]}},"arima":{"sal":{"es":["Pronosticar las consultas mensuales de urgencias para el próximo año.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,56. Ljung-Box de los residuos (12 rezagos): Q = 17,04; p = 0,107. Error porcentual absoluto medio en los 12 meses reservados: 1,7 %.","El modelo pronostica las consultas de urgencias con un error promedio del 1,7 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast monthly emergency visits for the next year.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.56. Ljung-Box on residuals (12 lags): Q = 17.04, p = .107. Mean absolute percentage error over the 12 held-out months: 1.7%.","The model forecasts emergency visits with an average error of 1.7% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"edu":{"es":["Pronosticar las solicitudes mensuales de inscripción para el próximo año.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,33. Ljung-Box de los residuos (12 rezagos): Q = 12,51; p = 0,326. Error porcentual absoluto medio en los 12 meses reservados: 1,0 %.","El modelo pronostica las solicitudes de inscripción con un error promedio del 1,0 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast monthly enrollment applications for the next year.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.33. Ljung-Box on residuals (12 lags): Q = 12.51, p = .326. Mean absolute percentage error over the 12 held-out months: 1.0%.","The model forecasts enrollment applications with an average error of 1.0% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"soc":{"es":["Pronosticar las llamadas mensuales a la línea de atención por violencia.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,56. Ljung-Box de los residuos (12 rezagos): Q = 15,42; p = 0,164. Error porcentual absoluto medio en los 12 meses reservados: 1,8 %.","El modelo pronostica las llamadas con un error promedio del 1,8 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast monthly calls to the violence helpline.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.56. Ljung-Box on residuals (12 lags): Q = 15.42, p = .164. Mean absolute percentage error over the 12 held-out months: 1.8%.","The model forecasts calls with an average error of 1.8% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"adm":{"es":["Pronosticar la demanda mensual del producto para planear el inventario.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,69. Ljung-Box de los residuos (12 rezagos): Q = 10,26; p = 0,507. Error porcentual absoluto medio en los 12 meses reservados: 1,6 %.","El modelo pronostica la demanda con un error promedio del 1,6 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast monthly product demand to plan inventory.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.69. Ljung-Box on residuals (12 lags): Q = 10.26, p = .507. Mean absolute percentage error over the 12 held-out months: 1.6%.","The model forecasts demand with an average error of 1.6% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"eco":{"es":["Pronosticar el índice de precios mensual de los próximos 12 meses.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,53. Ljung-Box de los residuos (12 rezagos): Q = 13,25; p = 0,277. Error porcentual absoluto medio en los 12 meses reservados: 2,4 %.","El modelo pronostica el índice de precios con un error promedio del 2,4 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast the monthly price index for the next 12 months.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.53. Ljung-Box on residuals (12 lags): Q = 13.25, p = .277. Mean absolute percentage error over the 12 held-out months: 2.4%.","The model forecasts the price index with an average error of 2.4% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"ing":{"es":["Pronosticar el consumo eléctrico mensual de la planta.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,65. Ljung-Box de los residuos (12 rezagos): Q = 12,67; p = 0,315. Error porcentual absoluto medio en los 12 meses reservados: 1,5 %.","El modelo pronostica el consumo eléctrico con un error promedio del 1,5 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast the plant's monthly electricity use.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.65. Ljung-Box on residuals (12 lags): Q = 12.67, p = .315. Mean absolute percentage error over the 12 held-out months: 1.5%.","The model forecasts electricity use with an average error of 1.5% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]},"der":{"es":["Pronosticar la radicación mensual de demandas en el circuito judicial.","96 meses de datos; modelo ARIMA(1,0,0)(0,1,0)₁₂ con constante, ajustado con los primeros 84 meses: φ = 0,58. Ljung-Box de los residuos (12 rezagos): Q = 16,24; p = 0,133. Error porcentual absoluto medio en los 12 meses reservados: 1,3 %.","El modelo pronostica la radicación de demandas con un error promedio del 1,3 % en datos que no usó para ajustarse, y los residuos no muestran autocorrelación (p ≥ 0,05): captura bien la tendencia y la estacionalidad de la serie. Los intervalos de pronóstico se ensanchan a medida que el horizonte se aleja (Box et al., 2015).","Si Ljung-Box hubiera dado p < 0,05, quedaría estructura sin modelar y habría que ajustar el modelo."],"en":["Forecast monthly lawsuit filings in the judicial circuit.","96 months of data; ARIMA(1,0,0)(0,1,0)₁₂ model with a constant, fitted on the first 84 months: φ = 0.58. Ljung-Box on residuals (12 lags): Q = 16.24, p = .133. Mean absolute percentage error over the 12 held-out months: 1.3%.","The model forecasts lawsuit filings with an average error of 1.3% on data it did not use for fitting, and the residuals show no autocorrelation (p ≥ .05): it captures the series' trend and seasonality well. Forecast intervals widen as the horizon lengthens (Box et al., 2015).","If Ljung-Box had given p < .05, structure would remain unmodeled and the model would need revision."]}},"meta":{"sal":{"es":["Sintetizar los ensayos sobre el efecto del ejercicio en la presión arterial.","18 estudios, modelo de efectos aleatorios (DerSimonian-Laird): diferencia de medias combinada = −4,4 mmHg (IC 95 %: −6,1 a −2,7; p < 0,001). Heterogeneidad: Q(17) = 55,9; p < 0,001; I² = 70 %.","En conjunto, el ejercicio reduce la presión en unos 4,4 mmHg. El I² indica que cerca del 70 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize trials on the effect of exercise on blood pressure.","18 studies, random-effects model (DerSimonian-Laird): pooled mean difference = −4.4 mmHg, 95% CI [−6.1, −2.7], p < .001. Heterogeneity: Q(17) = 55.9, p < .001, I² = 70%.","Overall, exercise lowers blood pressure by about 4.4 mmHg. I² indicates that about 70% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"edu":{"es":["Sintetizar los estudios sobre el efecto de la tutoría entre pares sobre el rendimiento.","25 estudios, modelo de efectos aleatorios (DerSimonian-Laird): d combinado = 0,35 (IC 95 %: 0,29–0,41; p < 0,001). Heterogeneidad: Q(24) = 38,1; p = 0,034; I² = 37 %.","En conjunto, la tutoría entre pares tiene un efecto pequeño sobre el rendimiento. El I² indica que cerca del 37 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize studies on the effect of peer tutoring on achievement.","25 studies, random-effects model (DerSimonian-Laird): pooled d = 0.35, 95% CI [0.29, 0.41], p < .001. Heterogeneity: Q(24) = 38.1, p = .034, I² = 37%.","Overall, peer tutoring has a small effect on achievement. I² indicates that about 37% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"soc":{"es":["Sintetizar los estudios sobre el efecto de la terapia cognitivo-conductual sobre la ansiedad.","30 estudios, modelo de efectos aleatorios (DerSimonian-Laird): d combinado = −0,57 (IC 95 %: −0,66 a −0,48; p < 0,001). Heterogeneidad: Q(29) = 90,0; p < 0,001; I² = 68 %.","En conjunto, la terapia reduce la ansiedad con un efecto mediano. El I² indica que cerca del 68 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize studies on the effect of cognitive-behavioral therapy on anxiety.","30 studies, random-effects model (DerSimonian-Laird): pooled d = −0.57, 95% CI [−0.66, −0.48], p < .001. Heterogeneity: Q(29) = 90.0, p < .001, I² = 68%.","Overall, therapy reduces anxiety with a medium effect. I² indicates that about 68% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"adm":{"es":["Sintetizar los estudios sobre la relación entre satisfacción laboral y desempeño.","40 estudios, modelo de efectos aleatorios (DerSimonian-Laird): r combinado = 0,31 (IC 95 %: 0,28–0,34; p < 0,001). Heterogeneidad: Q(39) = 94,6; p < 0,001; I² = 59 %.","En conjunto, la satisfacción y el desempeño tienen una correlación positiva mediana. El I² indica que cerca del 59 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize studies on the job satisfaction–performance relationship.","40 studies, random-effects model (DerSimonian-Laird): pooled r = .31, 95% CI [.28, .34], p < .001. Heterogeneity: Q(39) = 94.6, p < .001, I² = 59%.","Overall, satisfaction and performance have a medium positive correlation. I² indicates that about 59% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"eco":{"es":["Sintetizar las evaluaciones del efecto de las transferencias condicionadas sobre la asistencia escolar.","20 estudios, modelo de efectos aleatorios (DerSimonian-Laird): diferencia combinada = 7,6 puntos porcentuales (IC 95 %: 6,3–9,0; p < 0,001). Heterogeneidad: Q(19) = 37,1; p = 0,008; I² = 49 %.","En conjunto, las transferencias aumentan la asistencia escolar en unos 7,6 puntos porcentuales. El I² indica que cerca del 49 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize evaluations of conditional cash transfers' effect on school attendance.","20 studies, random-effects model (DerSimonian-Laird): pooled difference = 7.6 percentage points, 95% CI [6.3, 9.0], p < .001. Heterogeneity: Q(19) = 37.1, p = .008, I² = 49%.","Overall, transfers raise school attendance by about 7.6 percentage points. I² indicates that about 49% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"ing":{"es":["Sintetizar los estudios sobre el efecto de reemplazar cemento por cenizas volantes en la resistencia del concreto.","15 estudios, modelo de efectos aleatorios (DerSimonian-Laird): diferencia de medias combinada = −1,4 MPa (IC 95 %: −2,0 a −0,7; p < 0,001). Heterogeneidad: Q(14) = 28,4; p = 0,013; I² = 51 %.","En conjunto, el reemplazo reduce la resistencia en unos 1,4 MPa a los 28 días. El I² indica que cerca del 51 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize studies on replacing cement with fly ash on concrete strength.","15 studies, random-effects model (DerSimonian-Laird): pooled mean difference = −1.4 MPa, 95% CI [−2.0, −0.7], p < .001. Heterogeneity: Q(14) = 28.4, p = .013, I² = 51%.","Overall, replacement lowers 28-day strength by about 1.4 MPa. I² indicates that about 51% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]},"der":{"es":["Sintetizar los estudios sobre el efecto de la justicia restaurativa sobre la reincidencia.","22 estudios, modelo de efectos aleatorios (DerSimonian-Laird): OR combinado = 0,83 (IC 95 %: 0,75–0,91; p < 0,001). Heterogeneidad: Q(21) = 40,8; p = 0,006; I² = 49 %.","En conjunto, la justicia restaurativa se asocia con menor chance de reincidir. El I² indica que cerca del 49 % de la variabilidad entre estudios se debe a diferencias reales entre ellos y no al azar (Higgins y Thompson, 2002); conviene explorar qué explica esas diferencias.","Si el IC combinado hubiera incluido el valor nulo, no habría evidencia de efecto."],"en":["Synthesize studies on restorative justice's effect on reoffending.","22 studies, random-effects model (DerSimonian-Laird): pooled OR = 0.83, 95% CI [0.75, 0.91], p < .001. Heterogeneity: Q(21) = 40.8, p = .006, I² = 49%.","Overall, restorative justice is associated with lower odds of reoffending. I² indicates that about 49% of the between-study variability reflects real differences rather than chance (Higgins & Thompson, 2002); what explains them is worth exploring.","If the pooled CI had included the null value, there would be no evidence of an effect."]}},"sem":{"sal":{"es":["Explicar la relación entre el apoyo social y la adherencia al tratamiento, mediada por la autoeficacia.","Modelo de rutas, n = 400 pacientes: apoyo social → autoeficacia β = 0,48; autoeficacia → adherencia β = 0,46; efecto indirecto = 0,22 (IC 95 %: 0,16–0,28; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 2,35, p = 0,13; CFI = 0,99; TLI = 0,98; RMSEA = 0,058; SRMR = 0,024.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «apoyo social» se relaciona con «adherencia» a través de «autoeficacia»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain the relationship between social support and treatment adherence, mediated by self-efficacy.","Path model, n = 400 patients: social support → self-efficacy β = .48; self-efficacy → adherence β = .46; indirect effect = .22, 95% CI [.16, .28], p < .001 (Sobel test). Fit: χ²(1) = 2.35, p = .13; CFI = .99; TLI = .98; RMSEA = .058; SRMR = .024.","The model fits the data well by Hu and Bentler's (1999) criteria, and “social support” relates to “adherence” through “self-efficacy”: the indirect effect is significant (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]},"edu":{"es":["Explicar la relación entre el clima de aula y el rendimiento, mediada por la motivación.","Modelo de rutas, n = 400 estudiantes: clima de aula → motivación β = 0,43; motivación → rendimiento β = 0,38; efecto indirecto = 0,16 (IC 95 %: 0,11–0,21; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 2,08, p = 0,15; CFI = 0,99; TLI = 0,98; RMSEA = 0,052; SRMR = 0,025.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «clima de aula» se relaciona con «rendimiento» a través de «motivación»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain the relationship between classroom climate and achievement, mediated by motivation.","Path model, n = 400 students: classroom climate → motivation β = .43; motivation → achievement β = .38; indirect effect = .16, 95% CI [.11, .21], p < .001 (Sobel test). Fit: χ²(1) = 2.08, p = .15; CFI = .99; TLI = .98; RMSEA = .052; SRMR = .025.","The model fits the data well by Hu and Bentler's (1999) criteria, and “classroom climate” relates to “achievement” through “motivation”: the indirect effect is significant (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]},"soc":{"es":["Explicar la relación entre la discriminación percibida y los síntomas depresivos, mediada por el estrés.","Modelo de rutas, n = 400 adultos: discriminación → estrés β = 0,52; estrés → síntomas depresivos β = 0,45; efecto indirecto = 0,24 (IC 95 %: 0,18–0,29; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 2,22, p = 0,14; CFI = 0,99; TLI = 0,98; RMSEA = 0,055; SRMR = 0,023.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «discriminación» se relaciona con «síntomas depresivos» a través de «estrés»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain the relationship between perceived discrimination and depressive symptoms, mediated by stress.","Path model, n = 400 adults: discrimination → stress β = .52; stress → depressive symptoms β = .45; indirect effect = .24, 95% CI [.18, .29], p < .001 (Sobel test). Fit: χ²(1) = 2.22, p = .14; CFI = .99; TLI = .98; RMSEA = .055; SRMR = .023.","The model fits the data well by Hu and Bentler's (1999) criteria, and “discrimination” relates to “depressive symptoms” through “stress”: the indirect effect is significant (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]},"adm":{"es":["Explicar la relación entre el liderazgo transformacional y el desempeño, mediada por el compromiso.","Modelo de rutas, n = 400 empleados: liderazgo → compromiso β = 0,40; compromiso → desempeño β = 0,39; efecto indirecto = 0,16 (IC 95 %: 0,11–0,21; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 2,37, p = 0,12; CFI = 0,99; TLI = 0,97; RMSEA = 0,059; SRMR = 0,026.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «liderazgo» se relaciona con «desempeño» a través de «compromiso»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain the relationship between transformational leadership and performance, mediated by commitment.","Path model, n = 400 employees: leadership → commitment β = .40; commitment → performance β = .39; indirect effect = .16, 95% CI [.11, .21], p < .001 (Sobel test). Fit: χ²(1) = 2.37, p = .12; CFI = .99; TLI = .97; RMSEA = .059; SRMR = .026.","The model fits the data well by Hu and Bentler's (1999) criteria, and “leadership” relates to “performance” through “commitment”: the indirect effect is significant (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]},"eco":{"es":["Explicar la relación entre la educación financiera y el ahorro, mediada por las actitudes hacia el ahorro.","Modelo de rutas, n = 400 hogares: educación financiera → actitudes β = 0,49; actitudes → ahorro β = 0,48; efecto indirecto = 0,24 (IC 95 %: 0,18–0,30; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 1,24, p = 0,27; CFI = 1,00; TLI = 1,00; RMSEA = 0,024; SRMR = 0,017.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «educación financiera» se relaciona con «ahorro» a través de «actitudes»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain the relationship between financial education and saving, mediated by attitudes toward saving.","Path model, n = 400 households: financial education → attitudes β = .49; attitudes → saving β = .48; indirect effect = .24, 95% CI [.18, .30], p < .001 (Sobel test). Fit: nt (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]},"der":{"es":["Explicar la disposición a denunciar a partir de la legitimidad de la policía, mediada por la confianza.","Modelo de rutas, n = 400 ciudadanos: legitimidad → confianza β = 0,54; confianza → disposición a denunciar β = 0,41; efecto indirecto = 0,22 (IC 95 %: 0,16–0,28; p < 0,001, prueba de Sobel). Ajuste: χ²(1) = 2,07, p = 0,15; CFI = 0,99; TLI = 0,98; RMSEA = 0,052; SRMR = 0,023.","El modelo se ajusta bien a los datos según los criterios de Hu y Bentler (1999), y «legitimidad» se relaciona con «disposición a denunciar» a través de «confianza»: el efecto indirecto es significativo (mediación). Como el modelo no incluye una ruta directa y aun así se ajusta, los datos son compatibles con una mediación completa. Que el modelo se ajuste no demuestra causalidad.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, el modelo no se ajustaría y sus coeficientes no deberían interpretarse."],"en":["Explain willingness to report crime from police legitimacy, mediated by trust.","Path model, n = 400 citizens: legitimacy → trust β = .54; trust → willingness to report β = .41; indirect effect = .22, 95% CI [.16, .28], p < .001 (Sobel test). Fit: χ²(1) = 2.07, p = .15; CFI = .99; TLI = .98; RMSEA = .052; SRMR = .023.","The model fits the data well by Hu and Bentler's (1999) criteria, and “legitimacy” relates to “willingness to report” through “trust”: the indirect effect is significant (mediation). Because the model has no direct path and still fits, the data are compatible with full mediation. Good fit does not prove causation.","If CFI had been below .90 or RMSEA above .10, the model would not fit and its coefficients should not be interpreted."]}},"afc":{"sal":{"es":["Confirmar la estructura de tres dimensiones de la escala de agotamiento laboral en enfermeras.","410 enfermeras, 9 ítems (3 por dimensión), estimación por máxima verosimilitud: χ²(24) = 43,02, p = 0,010; CFI = 0,984; TLI = 0,975; RMSEA = 0,044; SRMR = 0,040. Cargas estandarizadas entre 0,58 y 0,81.","La estructura de tres dimensiones se ajusta bien a los datos según Hu y Bentler (1999), y todos los ítems cargan con fuerza en su dimensión: los datos son compatibles con las tres dimensiones propuestas en esta población (evidencia de validez basada en la estructura interna). El χ² es significativo, algo común con muestras grandes; por eso se miran los índices de ajuste.","Si el CFI hubiera sido menor que 0,90 o el RMSEA mayor que 0,10, la estructura propuesta no se confirmaría."],"en":["Confirm the three-dimension structure of the burnout scale in nurses.","410 nurses, 9 items (3 per dimension), maximum likelihood: χ²(24) = 43.02, p = .010; CFI = .984; TLI = .975; RMSEA = .044; SRMR = .040. Standardized loadings from .58 to .81.","The three-dimension structure fits the data well by Hu and Bentler's (1999) criteria, and every item loads strongly on its dimension: the data are compatible with the three proposed dimensions in this population (validity evidence based on internal structure). χ² is significant, which is common with large samples; that is why fit indices are examined.","If CFI had been below .90 or RMSEA above .10, the proposed structure would not be confirmed."]},"edu":{"es":["Confirmar la estructura de tres dimensiones de la escala de compromiso académico.","600 estudiantes, 9 ítems (3 por dimensión), estimación por máxima verosimilitud: χ²(24) = 52,44, p < 0,001; CFI = 0,982; TLI = 0,973; RMSEA = 0,044; SRMR = 0,033. Cargas estandarizadas entre 0,59 y 0,81.","La estructura de tres dimensiones se ajusta bien a los datos según Hu y Bentler (1999), y todos los ítems cargan con fuerza en su dimensión: los datos son compatibles con las tres dimensiones propuestas en esta poblac  of the patient satisfaction questionnaire.","12 Likert items (1–5), 300 users: α = .86. Alpha if item deleted: .84 to .85.","The items show good internal consistency: the value exceeds .80, which Nunnally and Bernstein (1994) consider adequate for basic research. Deleting any item does not raise alpha meaningfully, so all items contribute. Alpha assumes the scale measures a single dimension.","If α had been below .70, the items would not be consistent and the total score would be unreliable."]},"edu":{"es":["Determinar la confiabilidad de la escala de motivación académica.","10 ítems Likert (1–5), 250 estudiantes: α = 0,86. Alfa si se elimina cada ítem: entre 0,84 y 0,86.","Los ítems tienen buena consistencia interna: el valor supera 0,80, que Nunnally y Bernstein (1994) consideran suficiente para investigación básica. Ningún ítem, al eliminarse, sube el alfa de forma importante, así que todos contribuyen. El alfa supone que la escala mide una sola dimensión.","Si α hubiera sido menor que 0,70, los ítems no serían consistentes entre sí y el puntaje total sería poco confiable."],"en":["Determine the reliability of the academic motivation scale.","10 Likert items (1–5), 250 students: α = .86. Alpha if item deleted: .84 to .86.","The items show good internal consistency: the value exceeds .80, which Nunnally and Bernstein (1994) consider adequate for basic research. Deleting any item does not raise alpha meaningfully, so all items contribute. Alpha assumes the scale measures a single dimension.","If α had been below .70, the items would not be consistent and the total score would be unreliable."]},"soc":{"es":["Determinar la confiabilidad de la escala de soledad.","20 ítems Likert (1–5), 320 adultos mayores: α = 0,90. Alfa si se elimina cada ítem: entre 0,90 y 0,90.","Los ítems tienen buena consistencia interna: el valor supera 0,80, que Nunnally y Bernstein (1994) consideran suficiente para investigación básica. Ningún ítem, al eliminarse, sube el alfa de forma impor tirían suficiente varianza y el análisis factorial no sería adecuado."],"en":["Explore the factor structure of the quality-of-life questionnaire.","18 items, 350 patients: KMO = .88; Bartlett χ²(153) = 1,993.5, p < .001. Eigenvalues above 1: 5.00, 2.51, and 2.08 (the fourth is 0.79); the first three explain 53% of the variance.","The data are suitable for factor analysis (KMO meritorious per Kaiser, 1974, and a significant Bartlett test), and the items group into three dimensions. The eigenvalue-greater-than-1 rule is only a starting point: confirm it with a scree plot and check that each item loads at least .32 on its factor (Tabachnick & Fidell, 2019).","If KMO had been below .50, the items would not share enough variance and factor analysis would not be appropriate."]},"edu":{"es":["Explorar la estructura factorial del cuestionario de estrategias de aprendizaje.","24 ítems, 500 estudiantes: KMO = 0,89; Bartlett χ²(276) = 3.763,6; p < 0,001. Autovalores mayores que 1: 5,36, 3,51 y 2,63 (el cuarto es 0,85); los tres primeros explican el 48 % de la varianza.","Los datos son adecuados para el análisis factorial (KMO meritorio según Kaiser, 1974, y Bartlett significativo) y los ítems se agrupan en tres dimensiones. El criterio de autovalores mayores que 1 es solo un punto de partida: conviene confirmarlo con el gráfico de sedimentación y revisar que cada ítem cargue al menos 0,32 en su factor (Tabachnick y Fidell, 2019).","Si el KMO hubiera sido menor que 0,50, los ítems no compartirían suficiente varianza y el análisis factorial no sería adecuado."],"en":["Explore the factor structure of the learning strategies questionnaire.","24 items, 500 students: KMO = .89; Bartlett χ²(276) = 3,763.6, p < .001. Eigenvalues above 1: 5.36, 3.51, and 2.63 (the fourth is 0.85); the first three explain 48% of the variance.","The data are suitable for factor analysis (KMO meritorious per Kaiser, 1974, and a significant Bartlett test), and the items group into three dimensions. The eig reater-than-1 rule is only a starting point: confirm it with a scree plot and check that each item loads at least .32 on its factor (Tabachnick & Fidell, 2019).","If KMO had been below .50, the items would not share enough variance and factor analysis would not be appropriate."]},"der":{"es":["Explorar la estructura factorial del cuestionario de justicia procedimental.","18 ítems, 450 ciudadanos: KMO = 0,88; Bartlett χ²(153) = 2.476,8; p < 0,001. Autovalores mayores que 1: 4,77, 2,38 y 2,30 (el cuarto es 0,81); los tres primeros explican el 53 % de la varianza.","Los datos son adecuados para el análisis factorial (KMO meritorio según Kaiser, 1974, y Bartlett significativo) y los ítems se agrupan en tres dimensiones. El criterio de autovalores mayores que 1 es solo un punto de partida: conviene confirmarlo con el gráfico de sedimentación y revisar que cada ítem cargue al menos 0,32 en su factor (Tabachnick y Fidell, 2019).","Si el KMO hubiera sido menor que 0,50, los ítems no compartirían suficiente varianza y el análisis factorial no sería adecuado."],"en":["Explore the factor structure of the procedural justice questionnaire.","18 items, 450 citizens: KMO = .88; Bartlett χ²(153) = 2,476.8, p < .001. Eigenvalues above 1: 4.77, 2.38, and 2.30 (the fourth is 0.81); the first three explain 53% of the variance.","The data are suitable for factor analysis (KMO meritorious per Kaiser, 1974, and a significant Bartlett test), and the items group into three dimensions. The eigenvalue-greater-than-1 rule is only a starting point: confirm it with a scree plot and check that each item loads at least .32 on its factor (Tabachnick & Fidell, 2019).","If KMO had been below .50, the items would not share enough variance and factor analysis would not be appropriate."]}},"acp":{"sal":{"es":["Construir un índice de vulnerabilidad sanitaria municipal con 8 indicadores.","300 municipios, 8 variables estandarizadas: el componente 1 explica el 49,2 % de la varianza y el componente 2, el 19,3 % (acumulado 68,5 %).","Un solo componente resume cerca del 49 % de la información de las 8 variables y puede usarse como el índice de vulnerabilidad; con dos componentes se conserva el 68 %. Cada componente se interpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Build a municipal health vulnerability index from 8 indicators.","300 municipalities, 8 standardized variables: component 1 explains 49.2% of the variance and component 2 19.3% (cumulative 68.5%).","A single component captures about 49% of the information in the 8 variables and can serve as the vulnerability index; two components retain 68%. Each component is interpreted through its highest-weighted variables.","If the first component explained little variance, the variables would not share a common dimension and the index would not be useful."]},"edu":{"es":["Construir un índice de capital cultural del hogar con 8 variables.","300 hogares, 8 variables estandarizadas: el componente 1 explica el 50,6 % de la varianza y el componente 2, el 21,1 % (acumulado 71,8 %).","Un solo componente resume cerca del 51 % de la información de las 8 variables y puede usarse como el índice de capital cultural; con dos componentes se conserva el 72 %. Cada componente se interpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Build a household cultural capital index from 8 variables.","300 households, 8 standardized variables: component 1 explains 50.6% of the variance and component 2 21.1% (cumulative 71.8%).","A single component captures about 51% of the information in the 8 variables and can serve as the cultural capital index; two components retain 72%. Each component is interpreted through its highest-weighted variables.","If the first component explained little variance, the variables would not share a common dimension and the index would not be useful."]},"soc":{"es":["Construir un índice de cohesión social barrial con 8 indicadores.","300 barrios, 8 variables estandarizadas: el componente 1 explica el 52,7 % de la varianza y el componente 2, el 19,0 % (acumulado 71,6 %).","Un solo componente resume cerca del 53 % de la información de las 8 variables y puede usarse como el índice de cohesión; con dos componentes se conserva el 72 %. Cada componente se interpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Build a neighborhood social cohesion index from 8 indicators.","300 neighborhoods, 8 standardized variables: component 1 explains 52.7% of the variance and component 2 19.0% (cumulative 71.6%).","A single component captures about 53% of the information in the 8 variables and can serve as the cohesion index; two components retain 72%. Each component is interpreted through its highest-weighted variables.","If the first component explained little variance, the variables would not share a common dimension and the index would not be useful."]},"adm":{"es":["Resumir 8 indicadores financieros de las empresas en pocos componentes.","300 empresas, 8 variables estandarizadas: el componente 1 explica el 46,1 % de la varianza y el componente 2, el 21,8 % (acumulado 67,9 %).","Un solo componente resume cerca del 46 % de la información de las 8 variables y puede usarse como un indicador resumen de solidez financiera; con dos componentes se conserva el 68 %. Cada componente se interpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Summarize 8 financial indicators of firms in a few components.","300 firms, 8 standardized variables: component 1 explains 46.1% of the variance terpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Summarize 8 sensor variables in a few components to monitor the process.","300 records, 8 standardized variables: component 1 explains 53.3% of the variance and component 2 17.9% (cumulative 71.1%).","A single component captures about 53% of the information in the 8 variables and can serve as a summary signal for monitoring; two components retain 71%. Each component is interpreted through its highest-weighted variables.","If the first component explained little variance, the variables would not share a common dimension and the index would not be useful."]},"der":{"es":["Construir un índice de desempeño judicial con 8 indicadores de los despachos.","300 despachos, 8 variables estandarizadas: el componente 1 explica el 47,1 % de la varianza y el componente 2, el 19,9 % (acumulado 67,0 %).","Un solo componente resume cerca del 47 % de la información de las 8 variables y puede usarse como el índice de desempeño; con dos componentes se conserva el 67 %. Cada componente se interpreta por las variables que más pesan en él.","Si el primer componente explicara poca varianza, las variables no compartirían una dimensión común y el índice no sería útil."],"en":["Build a judicial performance index from 8 court office indicators.","300 offices, 8 standardized variables: component 1 explains 47.1% of the variance and component 2 19.9% (cumulative 67.0%).","A single component captures about 47% of the information in the 8 variables and can serve as the performance index; two components retain 67%. Each component is interpreted through its highest-weighted variables.","If the first component explained little variance, the variables would not share a common dimension and the index would not be useful."]}},"clus":{"sal":{"es":["Identificar perfiles de pacientes crónicos según el uso de servicios.","400 pacientes, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,27; k = 3: 0,30; k = 4: 0,23; k = 5: 0,22). Tamaños: «bajo uso» 37 %; «uso regular programado» 35 %; «alto uso de urgencias» 28 %.","Se encontraron tres perfiles (bajo uso, uso regular programado, alto uso de urgencias); cada uno se describe por sus promedios en las variables. La silueta respalda la elección de tres grupos. Los perfiles describen cómo se agrupan las unidades; no explican por qué pertenecen a cada grupo.","Si la silueta hubiera sido baja con cualquier número de grupos, no habría una estructura de grupos clara en los datos."],"en":["Identify profiles of chronic patients by service use.","400 patients, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .27; k = 3: .30; k = 4: .23; k = 5: .22). Sizes: “low use” 37%; “regular scheduled use” 35%; “high emergency use” 28%.","Three profiles were found (low use, regular scheduled use, high emergency use); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]},"edu":{"es":["Identificar perfiles de estudiantes según sus hábitos de estudio.","400 estudiantes, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,25; k = 3: 0,28; k = 4: 0,24; k = 5: 0,22). Tamaños: «autónomos» 44 %; «dependientes del docente» 29 %; «desconectados» 26 %.","Se encontraron tres perfiles (autónomos, dependientes del docente, desconectados); cada uno se describe por sus promedios en las variables. La silueta respalda la elección de tres grupos. Los perfiles describen cómo se agrupan las unidades; no explican por qué pertenecen a cada grupo.","Si la silueta hubiera sido baja con cualquier número de grupos, no habría una estructura de grupos clara en los datos."],"en":["Identify student profiles by study habits.","400 students, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .25; k = 3: .28; k = 4: .24; k = 5: .22). Sizes: “independent” 44%; “teacher-dependent” 29%; “disengaged” 26%.","Three profiles were found (independent, teacher-dependent, disengaged); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]},"soc":{"es":["Identificar perfiles de estilos de vida en estudiantes universitarios.","400 estudiantes, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,26; k = 3: 0,29; k = 4: 0,25; k = 5: 0,22). Tamaños: «activo con buena alimentación» 35 %; «sedentario con buena alimentación» 40 %; «sedentario con mala alimentación» 25 %.","Se encontraron tres perfiles (activo con buena alimentación, sedentario con buena alimentación, sedentario con mala alimentación); cada uno se describe por sus promedios en las variables. La silueta respalda la elección de tres grupos. Los perfiles describen cómo se agrupan las unidades; no explican por qué pertenecen a cada grupo.","Si la silueta hubiera sido baja con cualquier número de grupos, no habría una estructura de grupos clara en los datos."],"en":["Identify lifestyle profiles among university students.","400 students, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .26; k = 3: .29; k = 4: .25; k = 5: .22). Sizes: “active with a good diet” 35%; “sedentary with a good diet” 40%; “sedentary with a poor diet” 25%.","Three profiles were found (active with a good diet, sedentary with a good diet, sedentary with a poor diet); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]},"adm":{"es":["Identificar segmentos de clientes según su comportamiento de compra.","400 clientes, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,26; k = 3: 0,29; k = 4: 0,24; k = 5: 0,21). Tamaños: «frecuentes de bajo monto» 40 %; «ocasionales de alto monto» 35 %; «inactivos» 25 %.","Se encontraron tres perfiles (frecuentes de bajo monto, ocasionales de alto monto, inactivos); cada uno se describe por sus promedios en las variables. La silueta respalda la elección de tres grupos. Los perfiles describen cómo se agrupan las unidades; no explican por qué pertenecen a cada grupo.","Si la silueta hubiera sido baja con cualquier número de grupos, no habría una estructura de grupos clara en los datos."],"en":["Identify customer segments by purchasing behavior.","400 customers, 4 standardized variables, k-means: the silhouette coefficient peaks at 3 clusters (k = 2: .26; k = 3: .29; k = 4: .24; k = 5: .21). Sizes: “frequent low spenders” 40%; “occasional high spenders” 35%; “inactive” 25%.","Three profiles were found (frequent low spenders, occasional high spenders, inactive); each is described by its means on the variables. The silhouette supports choosing three clusters. Profiles describe how units group together; they do not explain why units belong to each group.","If the silhouette had been low for every number of clusters, there would be no clear group structure in the data."]},"eco":{"es":["Identificar tipologías de municipios según sus indicadores económicos.","400 municipios, 4 variables estandarizadas, k-medias: el coeficiente de silueta es máximo con 3 grupos (k = 2: 0,28; k = 3: 0,29; k = 4: 0,25; k = 5: 0,23). Tamaños:
