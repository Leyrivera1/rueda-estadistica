= .04, p = .001.","For each daily hour on social media, the loneliness score increases by 1.1 points on average. That variable accounts for 4% of the variation in the loneliness score; the rest depends on other factors.","If the CI for b had included 0, there would be no evidence of a relationship."]},"adm":{"es":["Relacionar la inversión en publicidad con las ventas.","n = 80: β = 3,2 millones por millón invertido en publicidad (IC 95 %: 2,2–4,2); R² = 0,34; p < 0,001.","Por cada millón invertido en publicidad, las ventas aumenta en promedio 3,2 millones. Esa variable se asocia con el 34 % de la variación de las ventas; el resto depende de otros factores.","Si el IC de β hubiera incluido el 0, no habría evidencia de relación."],"en":["Relate advertising spending to sales.","n = 80: b = 3.2 million per million spent on advertising, 95% CI [2.2, 4.2]; R² = .34, p < .001.","For each million spent on advertising, sales increases by 3.2 million on average. That variable accounts for 34% of the variation in sales; the rest depends on other factors.","If the CI for b had included 0, there would be no evidence of a relationship."]},"eco":{"es":["Relacionar el ingreso del hogar con el gasto en alimentos.","n = 300: β = 0,18 millones por millón de ingreso (IC 95 %: 0,17–0,20); R² = 0,62; p < 0,001.","Por cada millón de ingreso, el gasto en alimentos aumenta en promedio 0,18 millones. Esa variable se asocia con el 62 % de la variación del gasto en alimentos; el resto depende de otros factores.","Si el IC de β hubiera incluido el 0, no habría evidencia de relación."],"en":["Relate household income to food spending.","n = 300: b = 0.18 million per million of income, 95% CI [0.17, 0.20]; R² = .62, p < .001.","For each million of income, food spending increases by 0.18 million on average. That variable accounts for 62% of the variation in food spending; the rest depends on other factors.","If the CI for b had included 0, there would be no evidence of a relationship."]},"ing":{"es":["Relacionar la temperatura de curado con la resistencia del concreto.","n = 60: β = 0,32 MPa por grado de temperatura de curado (IC 95 %: 0,19–0,44); R² = 0,30; p < 0,001.","Por cada grado de temperatura de curado, la resistencia aumenta en promedio 0,32 MPa. Esa variable se asocia con el 30 % de la variación de la resistencia; el resto depende de otros factores.","Si el IC de β hubiera incluido el 0, no habría evidencia de relación."],"en":["Relate curing temperature to concrete strength.","n = 60: b = 0.32 MPa per degree of curing temperature, 95% CI [0.19, 0.44]; R² = .30, p < .001.","For each degree of curing temperature, strength increases by 0.32 MPa on average. That variable accounts for 30% of the variation in strength; the rest depends on other factors.","If the CI for b had included 0, there would be no evidence of a relationship."]},"der":{"es":["Relacionar el número de audiencias con la duración del proceso.","n = 150: β = 40 días por audiencia adicional (IC 95 %: 30–50); R² = 0,30; p < 0,001.","Por cada audiencia adicional, la duración aumenta en promedio 40 días. Esa variable se asocia con el 30 % de la variación de la duración; el resto depende de otros factores.","Si el IC de β hubiera incluido el 0, no habría evidencia de relación."],"en":["Relate the number of hearings to case duration.","n = 150: b = 40 days per additional hearing, 95% CI [30, 50]; R² = .30, p < .001.","For each additional hearing, duration increases by 40 days on average. That variable accounts for 30% of the variation in duration; the rest depends on other factors.","If the CI for b had included 0, there would be no evidence of a relationship."]}},"tind":{"sal":{"es":["Comparar el colesterol entre pacientes con y sin actividad física regular.","Colesterol total: con actividad física M = 184 mg/dL (DE 28); sin actividad física M = 197 mg/dL (DE 27); n = 50 por grupo; Levene p = 0,87; t(98) = −2,32; p = 0,022; d = 0,46.","Como p < 0,05, las medias son diferentes: el colesterol es más bajo en quienes hacen actividad física. La diferencia es de 13 mg/dL y el tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare cholesterol between patients with and without regular physical activity.","Total cholesterol: with physical activity M = 184 mg/dL (SD = 28); without physical activity M = 197 mg/dL (SD = 27); n = 50 per group; Levene p = .87; t(98) = −2.32, p = .022, d = 0.46.","Because p < .05, the means differ: cholesterol is lower among those who exercise. The difference is 13 mg/dL, a small effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"edu":{"es":["Comparar el puntaje de lectura entre colegios con y sin biblioteca escolar.","Puntaje de lectura: con biblioteca M = 63,0 puntos (DE 8,7); sin biblioteca M = 57,4 puntos (DE 10,2); n = 50 por grupo; Levene p = 0,72; t(98) = 2,96; p = 0,004; d = 0,59.","Como p < 0,05, las medias son diferentes: los estudiantes de colegios con biblioteca tienen mejor puntaje. La diferencia es de 5,6 puntos y el tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare reading scores between schools with and without a library.","Reading score: with a library M = 63.0 points (SD = 8.7); without a library M = 57.4 points (SD = 10.2); n = 50 per group; Levene p = .72; t(98) = 2.96, p = .004, d = 0.59.","Because p < .05, the means differ: students at schools with a library score higher. The difference is 5.6 points, a medium effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"soc":{"es":["Comparar la soledad entre adultos mayores que viven solos y acompañados.","Soledad: viven solos M = 40,8 puntos (DE 7,5); viven acompañados M = 37,1 puntos (DE 7,3); n = 50 por grupo; Levene p = 0,41; t(98) = 2,53; p = 0,013; d = 0,51.","Como p < 0,05, las medias son diferentes: quienes viven solos reportan más soledad. La diferencia es de 3,7 puntos y el tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare loneliness between older adults living alone and with others.","Loneliness: living alone M = 40.8 points (SD = 7.5); living with others M = 37.1 points (SD = 7.3); n = 50 per group; Levene p = .41; t(98) = 2.53, p = .013, d = 0.51.","Because p < .05, the means differ: those living alone report more loneliness. The difference is 3.7 points, a medium effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"adm":{"es":["Comparar la satisfacción laboral entre empleados con teletrabajo parcial y presencial.","Satisfacción (0–100): teletrabajo parcial M = 74,6 (DE 11,1); presencial M = 69,0 (DE 8,5); n = 50 por grupo; Levene p = 0,10; t(98) = 2,84; p = 0,005; d = 0,57.","Como p < 0,05, las medias son diferentes: la satisfacción es mayor con teletrabajo parcial. La diferencia es de 5,6 y el tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare job satisfaction between hybrid and on-site employees.","Satisfaction (0–100): hybrid M = 74.6 (SD = 11.1); on-site M = 69.0 (SD = 8.5); n = 50 per group; Levene p = .10; t(98) = 2.84, p = .005, d = 0.57.","Because p < .05, the means differ: satisfaction is higher with hybrid work. The difference is 5.6, a medium effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"eco":{"es":["Comparar el precio pagado a productores asociados y no asociados.","Precio por kilo de café: asociados M = 14.833 pesos (DE 1.460); no asociados M = 14.187 pesos (DE 1.290); n = 50 por grupo; Levene p = 0,55; t(98) = 2,34; p = 0,021; d = 0,47.","Como p < 0,05, las medias son diferentes: los productores asociados reciben un precio mayor. La diferencia es de 646 pesos y el tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare the price paid to cooperative and independent growers.","Coffee price per kilo: cooperative members M = 14,833 pesos (SD = 1,460); independent M = 14,187 pesos (SD = 1,290); n = 50 per group; Levene p = .55; t(98) = 2.34, p = .021, d = 0.47.","Because p < .05, the means differ: cooperative members receive a higher price. The difference is 646 pesos, a small effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"ing":{"es":["Comparar la resistencia a la compresión de dos mezclas de concreto.","Resistencia: mezcla A M = 29,9 MPa (DE 2,1); mezcla B M = 28,7 MPa (DE 2,5); n = 50 por grupo; Levene p = 0,31; t(98) = 2,56; p = 0,012; d = 0,51.","Como p < 0,05, las medias son diferentes: la mezcla A es más resistente. La diferencia es de 1,2 MPa y el tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare compressive strength of two concrete mixes.","Strength: mix A M = 29.9 MPa (SD = 2.1); mix B M = 28.7 MPa (SD = 2.5); n = 50 per group; Levene p = .31; t(98) = 2.56, p = .012, d = 0.51.","Because p < .05, the means differ: mix A is stronger. The difference is 1.2 MPa, a medium effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]},"der":{"es":["Comparar el tiempo hasta la primera audiencia en juzgados con y sin expediente digital.","Días hasta la primera audiencia: con expediente digital M = 100 días (DE 39); sin expediente digital M = 123 días (DE 35); n = 50 por grupo; Levene p = 0,29; t(98) = −3,04; p = 0,003; d = 0,61.","Como p < 0,05, las medias son diferentes: con expediente digital la audiencia llega antes. La diferencia es de 23 días y el tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos (no significa que sean iguales)."],"en":["Compare time to first hearing in courts with and without digital case files.","Days to first hearing: with digital files M = 100 days (SD = 39); without digital files M = 123 days (SD = 35); n = 50 per group; Levene p = .29; t(98) = −3.04, p = .003, d = 0.61.","Because p < .05, the means differ: the hearing happens sooner with digital files. The difference is 23 days, a medium effect (Cohen, 1988).","If p had been ≥ .05, there would be no evidence of a difference between groups (which does not mean they are equal)."]}},"welch":{"sal":{"es":["Comparar la hemoglobina glicada entre pacientes con y sin el programa educativo.","HbA1c: con el programa M = 7,08 % (DE 0,60; n = 40); sin el programa M = 7,67 % (DE 1,43; n = 70); Levene p < 0,001; t(100,9) = 3,03; p = 0,003.","Como p < 0,05, las medias son diferentes: la hemoglobina glicada es más baja con el programa. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,54).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare HbA1c between patients with and without the education program.","HbA1c: with the program M = 7.08% (SD = 0.60, n = 40); without the program M = 7.67% (SD = 1.43, n = 70); Levene p < .001; t(100.9) = 3.03, p = .003.","Because p < .05, the means differ: HbA1c is lower with the program. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.54).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"edu":{"es":["Comparar el puntaje en matemáticas entre colegios rurales y urbanos.","Matemáticas: colegios urbanos M = 53,7 puntos (DE 7,6; n = 60); colegios rurales M = 48,1 puntos (DE 12,3; n = 40); Levene p = 0,019; t(59,2) = 2,60; p = 0,012.","Como p < 0,05, las medias son diferentes: los colegios urbanos tienen mejor puntaje. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,55).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare math scores between rural and urban schools.","Math score: urban schools M = 53.7 points (SD = 7.6, n = 60); rural schools M = 48.1 points (SD = 12.3, n = 40); Levene p = .019; t(59.2) = 2.60, p = .012.","Because p < .05, the means differ: urban schools score higher. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.55).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"soc":{"es":["Comparar el estrés entre cuidadores formales e informales.","Estrés: cuidadores informales M = 25,6 puntos (DE 9,8; n = 45); cuidadores formales M = 21,0 puntos (DE 5,1; n = 60); Levene p < 0,001; t(61,9) = 2,88; p = 0,005.","Como p < 0,05, las medias son diferentes: los cuidadores informales tienen más estrés. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,59).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare stress between formal and informal caregivers.","Stress: informal caregivers M = 25.6 points (SD = 9.8, n = 45); formal caregivers M = 21.0 points (SD = 5.1, n = 60); Levene p < .001; t(61.9) = 2.88, p = .005.","Because p < .05, the means differ: informal caregivers report more stress. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.59).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"adm":{"es":["Comparar los días para cerrar una venta entre el canal digital y el presencial.","Días para cerrar: canal presencial M = 18,0 días (DE 9,7; n = 40); canal digital M = 12,8 días (DE 3,9; n = 70); Levene p < 0,001; t(46,3) = 3,29; p = 0,002.","Como p < 0,05, las medias son diferentes: el canal digital cierra las ventas más rápido. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,71).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare days to close a sale between digital and in-person channels.","Days to close: in-person M = 18.0 days (SD = 9.7, n = 40); digital M = 12.8 days (SD = 3.9, n = 70); Levene p < .001; t(46.3) = 3.29, p = .002.","Because p < .05, the means differ: the digital channel closes sales faster. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.71).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"eco":{"es":["Comparar la rentabilidad de bancos y cooperativas.","Rentabilidad: bancos M = 9,6 % (DE 5,1; n = 30); cooperativas M = 6,7 % (DE 2,5; n = 60); Levene p < 0,001; t(35,9) = 2,97; p = 0,005.","Como p < 0,05, las medias son diferentes: los bancos tienen mayor rentabilidad promedio. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,73).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare profitability of banks and cooperatives.","Profitability: banks M = 9.6% (SD = 5.1, n = 30); cooperatives M = 6.7% (SD = 2.5, n = 60); Levene p < .001; t(35.9) = 2.97, p = .005.","Because p < .05, the means differ: banks have higher average profitability. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.73).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"ing":{"es":["Comparar el tiempo de respuesta de dos sistemas.","Tiempo de respuesta: sistema B M = 242 ms (DE 76; n = 40); sistema A M = 208 ms (DE 26; n = 60); Levene p < 0,001; t(45,1) = 2,67; p = 0,010.","Como p < 0,05, las medias son diferentes: el sistema A responde más rápido. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,59).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare response time of two systems.","Response time: system B M = 242 ms (SD = 76, n = 40); system A M = 208 ms (SD = 26, n = 60); Levene p < .001; t(45.1) = 2.67, p = .010.","Because p < .05, the means differ: system A responds faster. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.59).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"der":{"es":["Comparar el monto de las indemnizaciones en dos distritos judiciales.","Indemnización: distrito 2 M = 60,3 millones (DE 31,5; n = 40); distrito 1 M = 48,2 millones (DE 11,2; n = 60); Levene p < 0,001; t(45,6) = 2,34; p = 0,024.","Como p < 0,05, las medias son diferentes: el distrito 2 reconoce montos mayores. Se usó Welch porque las varianzas son distintas (Levene p < 0,05); el tamaño del efecto es mediano (d = 0,51).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare damages awarded in two judicial districts.","Damages: district 2 M = 60.3 million (SD = 31.5, n = 40); district 1 M = 48.2 million (SD = 11.2, n = 60); Levene p < .001; t(45.6) = 2.34, p = .024.","Because p < .05, the means differ: district 2 awards higher amounts. Welch's test was used because the variances differ (Levene p < .05); the effect size is medium (d = 0.51).","If p had been ≥ .05, there would be no evidence of a difference between groups."]}},"mw":{"sal":{"es":["Comparar la estancia hospitalaria entre pacientes operados por laparoscopia y por cirugía abierta.","Estancia: mediana 5 (RIC 3–7) días (laparoscopia) y 8 (RIC 5–10) días (cirugía abierta); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 472; p = 0,002; r = 0,35.","Como p < 0,05, los grupos son diferentes: los pacientes operados por laparoscopia tienden a estar menos días hospitalizados. El tamaño del efecto es mediano (r de 0,35).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare length of stay between laparoscopic and open surgery patients.","Length of stay: Mdn = 5 (IQR 3–7) days (laparoscopy) and 8 (IQR 5–10) days (open surgery); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 472, p = .002, r = .35.","Because p < .05, the groups differ: laparoscopy patients tend to stay fewer days. The effect size is medium (r = .35).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"edu":{"es":["Comparar las horas de uso de la plataforma virtual entre estudiantes de primer y último semestre.","Horas semanales: mediana 4 (RIC 3–5) horas (primer semestre) y 6 (RIC 4–8) horas (último semestre); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 484; p = 0,002; r = 0,34.","Como p < 0,05, los grupos son diferentes: los de último semestre tienden a usar más la plataforma. El tamaño del efecto es mediano (r de 0,34).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare virtual platform use between first- and final-semester students.","Weekly hours: Mdn = 4 (IQR 3–5) hours (first semester) and 6 (IQR 4–8) hours (final semester); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 484, p = .002, r = .34.","Because p < .05, the groups differ: final-semester students tend to use the platform more. The effect size is medium (r = .34).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"soc":{"es":["Comparar la ansiedad social entre adolescentes con y sin experiencia de acoso escolar.","Ansiedad social: mediana 19 (RIC 15–25) puntos (sin acoso) y 28 (RIC 19–37) puntos (con acoso); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 468; p = 0,001; r = 0,36.","Como p < 0,05, los grupos son diferentes: quienes vivieron acoso tienden a tener más ansiedad social. El tamaño del efecto es mediano (r de 0,36).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare social anxiety between adolescents with and without bullying experiences.","Social anxiety: Mdn = 19 (IQR 15–25) points (not bullied) and 28 (IQR 19–37) points (bullied); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 468, p = .001, r = .36.","Because p < .05, the groups differ: bullied adolescents tend to have more social anxiety. The effect size is medium (r = .36).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"adm":{"es":["Comparar el tiempo de resolución de quejas entre el chat y el correo.","Tiempo de resolución: mediana 7 (RIC 4–11) horas (chat) y 14 (RIC 7–22) horas (correo); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 460; p = 0,001; r = 0,37.","Como p < 0,05, los grupos son diferentes: las quejas por chat tienden a resolverse antes. El tamaño del efecto es mediano (r de 0,37).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare complaint resolution time between chat and email.","Resolution time: Mdn = 7 (IQR 4–11) hours (chat) and 14 (IQR 7–22) hours (email); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 460, p = .001, r = .37.","Because p < .05, the groups differ: chat complaints tend to be resolved sooner. The effect size is medium (r = .37).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"eco":{"es":["Comparar el ingreso de los hogares con y sin remesas.","Ingreso mensual: mediana 2,0 (RIC 1,4–2,5) millones de pesos (sin remesas) y 3,1 (RIC 1,9–4,2) millones de pesos (con remesas); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 486; p = 0,003; r = 0,34.","Como p < 0,05, los grupos son diferentes: los hogares con remesas tienden a tener ingresos más altos. El tamaño del efecto es mediano (r de 0,34).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare income of households with and without remittances.","Monthly income: Mdn = 2.0 (IQR 1.4–2.5) million pesos (without remittances) and 3.1 (IQR 1.9–4.2) million pesos (with remittances); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 486, p = .003, r = .34.","Because p < .05, the groups differ: households receiving remittances tend to have higher incomes. The effect size is medium (r = .34).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"ing":{"es":["Comparar el tiempo de reparación con y sin manual digital.","Tiempo de reparación: mediana 2,3 (RIC 1,8–3,1) horas (con manual digital) y 3,5 (RIC 2,4–4,5) horas (sin manual digital); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 474; p = 0,002; r = 0,35.","Como p < 0,05, los grupos son diferentes: con manual digital las reparaciones tienden a ser más rápidas. El tamaño del efecto es mediano (r de 0,35).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare repair time with and without a digital manual.","Repair time: Mdn = 2.3 (IQR 1.8–3.1) hours (with digital manual) and 3.5 (IQR 2.4–4.5) hours (without digital manual); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 474, p = .002, r = .35.","Because p < .05, the groups differ: repairs tend to be faster with the digital manual. The effect size is medium (r = .35).","If p had been ≥ .05, there would be no evidence of a difference between groups."]},"der":{"es":["Comparar la duración de los procesos con y sin conciliación previa.","Duración: mediana 234 (RIC 136–322) días (con conciliación previa) y 380 (RIC 228–552) días (sin conciliación previa); n = 40 por grupo; datos no normales (Shapiro-Wilk p < 0,05); U = 464; p = 0,001; r = 0,36.","Como p < 0,05, los grupos son diferentes: con conciliación previa los procesos tienden a durar menos. El tamaño del efecto es mediano (r de 0,36).","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre los grupos."],"en":["Compare case duration with and without prior mediation.","Duration: Mdn = 234 (IQR 136–322) days (with prior mediation) and 380 (IQR 228–552) days (without prior mediation); n = 40 per group; non-normal data (Shapiro-Wilk p < .05); U = 464, p = .001, r = .36.","Because p < .05, the groups differ: cases with prior mediation tend to be shorter. The effect size is medium (r = .36).","If p had been ≥ .05, there would be no evidence of a difference between groups."]}},"tpar":{"sal":{"es":["Comparar la glucosa en ayunas antes y después de la intervención nutricional.","Glucosa en 30 pacientes: 131 mg/dL antes y 122 mg/dL después; diferencia media −9 mg/dL (IC 95 %: −14 a −4); t(29) = −3,70; p < 0,001; dz = 0,68.","Como p < 0,05, hubo un cambio: la glucosa bajó en promedio 9 mg/dL. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare fasting glucose before and after the nutrition intervention.","Glucose in 30 patients: 131 mg/dL before and 122 mg/dL after; mean difference −9 mg/dL, 95% CI [−14, −4]; t(29) = −3.70, p < .001, dz = 0.68.","Because p < .05, there was a change: glucose decreased by 9 mg/dL on average. The effect size is medium.","If p had been ≥ .05, there would be no evidence of change between the two measurements."]},"edu":{"es":["Comparar la comprensión lectora antes y después del programa.","Comprensión lectora en 30 estudiantes: 50,3 puntos antes y 56,0 puntos después; diferencia media 5,7 puntos (IC 95 %: 1,9–9,6); t(29) = 3,03; p = 0,005; dz = 0,55.","Como p < 0,05, hubo un cambio: el puntaje aumentó en promedio 5,7 puntos. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare reading comprehension before and after the program.","Reading comprehension in 30 students: 50.3 points before and 56.0 points after; mean difference 5.7 points, 95% CI [1.9, 9.6]; t(29) = 3.03, p = .005, dz = 0.55.","Because p < .05, there was a change: the score increased by 5.7 points on average. The effect size is medium.","If p had been ≥ .05, there would be no evidence of change between the two measurements."]},"soc":{"es":["Comparar el estrés antes y después del taller de atención plena.","Estrés en 30 participantes: 24,2 puntos antes y 20,1 puntos después; diferencia media −4,1 puntos (IC 95 %: −6,1 a −2,1); t(29) = −4,23; p < 0,001; dz = 0,77.","Como p < 0,05, hubo un cambio: el estrés disminuyó en promedio 4,1 puntos. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare stress before and after the mindfulness workshop.","Stress in 30 participants: 24.2 points before and 20.1 points after; mean difference −4.1 points, 95% CI [−6.1, −2.1]; t(29) = −4.23, p < .001, dz = 0.77.","Because p < .05, there was a change: stress decreased by 4.1 points on average. The effect size is medium.","If p had been ≥ .05, there would be no evidence of change between the two measurements."]},"adm":{"es":["Comparar la productividad antes y después del nuevo sistema de gestión.","Productividad en 30 operarios: 39,1 unidades por hora antes y 42,6 unidades por hora después; diferencia media 3,5 unidades por hora (IC 95 %: 1,4–5,5); t(29) = 3,52; p = 0,001; dz = 0,64.","Como p < 0,05, hubo un cambio: la productividad aumentó en promedio 3,5 unidades por hora. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare productivity before and after the new management system.","Productivity in 30 operators: 39.1 units per hour before and 42.6 units per hour after; mean difference 3.5 units per hour, 95% CI [1.4, 5.5]; t(29) = 3.52, p = .001, dz = 0.64.","Because p < .05, there was a change: productivity increased by 3.5 units per hour on average. The effect size is medium.","If p had been ≥ .05, there would be no evidence of change between the two measurements."]},"eco":{"es":["Comparar el precio de venta de los productos antes y después del nuevo impuesto.","Precio en 30 productos: 12.460 pesos antes y 13.141 pesos después; diferencia media 681 pesos (IC 95 %: 355–1.006); t(29) = 4,28; p < 0,001; dz = 0,78.","Como p < 0,05, hubo un cambio: el precio subió en promedio 681 pesos. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare product prices before and after the new tax.","Price in 30 products: 12,460 pesos before and 13,141 pesos after; mean difference 681 pesos, 95% CI [355, 1,006]; t(29) = 4.28, p < .001, dz = 0.78.","Because p < .05, there was a change: prices rose by 681 pesos on average. The effect size is medium.","If p had been ≥ .05, there would be no evidence of change between the two measurements."]},"ing":{"es":["Comparar el consumo de combustible antes y después del mantenimiento.","Consumo en 30 vehículos: 11,7 L/100 km antes y 10,8 L/100 km después; diferencia media −0,9 L/100 km (IC 95 %: −1,3 a −0,4); t(29) = −3,90; p < 0,001; dz = 0,71.","Como p < 0,05, hubo un cambio: el consumo bajó en promedio 0,9 L/100 km. El tamaño del efecto es mediano.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las dos mediciones."],"en":["Compare fuel consumption before and after maintenance.","Consumption in 30 vehicles: 11.7 L/100 km before and 10.8 L/100 km after; mean difference −0.9 L/100 km, 95% CI [−1.3, −0.4]; t(29) = −3.  < .05, there was a change: satisfaction increased. The effect size is large by Cohen's (1988) benchmarks for r.","If p had been ≥ .05, there would be no evidence of change."]},"eco":{"es":["Comparar la percepción de seguridad económica antes y después del subsidio.","Seguridad económica (1–10) en 25 hogares: mediana 4 antes y 5 después; Wilcoxon W = 60,5; z = −2,59; p = 0,010; r = 0,53.","Como p < 0,05, hubo un cambio: la percepción de seguridad aumentó. El tamaño del efecto es grande según los umbrales de Cohen (1988) para r.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare perceived economic security before and after the subsidy.","Economic security (1–10) in 25 households: Mdn = 4 before and 5 after; Wilcoxon W = 60.5, z = −2.59, p = .010, r = .53.","Because p < .05, there was a change: perceived security increased. The effect size is large by Cohen's (1988) benchmarks for r.","If p had been ≥ .05, there would be no evidence of change."]},"ing":{"es":["Comparar el nivel de ruido percibido antes y después del aislamiento acústico.","Ruido percibido (1–10) en 25 puestos de trabajo: mediana 7 antes y 6 después; Wilcoxon W = 32,5; z = −2,91; p = 0,004; r = 0,64.","Como p < 0,05, hubo un cambio: el ruido percibido disminuyó. El tamaño del efecto es grande según los umbrales de Cohen (1988) para r.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare perceived noise before and after acoustic insulation.","Perceived noise (1–10) in 25 workstations: Mdn = 7 before and 6 after; Wilcoxon W = 32.5, z = −2.91, p = .004, r = .64.","Because p < .05, there was a change: perceived noise decreased. The effect size is large by Cohen's (1988) benchmarks for r.","If p had been ≥ .05, there would be no evidence of change."]},"der":{"es":["Comparar la percepción de acceso a la justicia antes y después de abrir la casa de justicia.","Acceso percibido (1–10) en 25 líderes comunitarios: mediana 5 antes y 7 después; Wilcoxon W = 9,5; z = , 2.9], adjusted p = .066; admixture C vs. admixture A: 1.8, 95% CI [0.3, 3.3], adjusted p = .011; admixture C vs. admixture B: 0.4, 95% CI [−1.0, 1.9], adjusted p = .777.","Only admixture C and admixture A differ: it is the only pair with adjusted p < .05 and a CI that excludes 0. The other differences may be due to chance.","Without correcting for multiple comparisons, the chance of declaring differences that do not exist would increase."]},"der":{"es":["Identificar qué grupos difieren en la duración (comparar la duración hasta el fallo según el tipo de proceso).","Tukey (n = 40 por grupo), diferencias de medias en días: proceso ejecutivo frente a proceso verbal: 31 (IC 95 %: −1 a 64; p ajustado = 0,065); proceso ordinario frente a proceso verbal: 51 (IC 95 %: 18–83; p ajustado < 0,001); proceso ordinario frente a proceso ejecutivo: 20 (IC 95 %: −13 a 52; p ajustado = 0,325).","Solo difieren proceso ordinario y proceso verbal: es el único par con p ajustado < 0,05 y con un IC que no incluye el 0. Las demás diferencias pueden deberse al azar.","Sin corrección por comparaciones múltiples, aumentaría la probabilidad de declarar diferencias que no existen."],"en":["Identify which groups differ in duration (compare time to judgment by type of proceeding).","Tukey (n = 40 per group), mean differences in days: enforcement proceeding vs. oral proceeding: 31, 95% CI [−1, 64], adjusted p = .065; ordinary proceeding vs. oral proceeding: 51, 95% CI [18, 83], adjusted p < .001; ordinary proceeding vs. enforcement proceeding: 20, 95% CI [−13, 52], adjusted p = .325.","Only ordinary proceeding and oral proceeding differ: it is the only pair with adjusted p < .05 and a CI that excludes 0. The other differences may be due to chance.","Without correcting for multiple comparisons, the chance of declaring differences that do not exist would increase."]}},"kw":{"sal":{"es":["Comparar la calidad de vida según el estadio de la enfermedad.","Calidad de vida (0–100), medianas (n = 35 por 5 por grupo; datos no normales): grupo A 11; grupo B 13; grupo C 19; H(2) = 14,24; p < 0,001; ε² = 0,14. Dunn con corrección de Holm: difieren grupo A y grupo C.","Como p < 0,05, la discriminación percibida difiere entre los grupos; las comparaciones por pares de Dunn muestran que la diferencia está entre grupo A y grupo C.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias entre grupos."],"en":["Compare perceived discrimination across three population groups.","Perceived discrimination, medians (n = 35 per group; non-normal data): group A 11; group B 13; group C 19; H(2) = 14.24, p < .001, ε² = .14. Dunn with Holm correction: group A and group C differ.","Because p < .05, perceived discrimination differs across groups; Dunn's pairwise comparisons show the difference lies between group A and group C.","If p had been ≥ .05, there would be no evidence of group differences."]},"adm":{"es":["Comparar los tiempos de entrega de tres proveedores.","Días de entrega, medianas (n = 35 por grupo; datos no normales): proveedor 1 3,3; proveedor 2 3,7; proveedor 3 4,7; H(2) = 9,77; p = 0,008; ε² = 0,09. Dunn con corrección de Holm: difieren proveedor 1 y proveedor 3.","Como p < 0,05, el tiempo de entrega difiere entre los grupos; las comparaciones por pares de Dunn muestran que la diferencia está entre proveedor 1 y proveedor 3.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias entre grupos."],"en":["Compare delivery times of three suppliers.","Delivery days, medians (n = 35 per group; non-normal data): supplier 1 3.3; supplier 2 3.7; supplier 3 4.7; H(2) = 9.77, p = .008, ε² = .09. Dunn with Holm correction: supplier 1 and supplier 3 differ.","Because p < .05, delivery time differs across groups; Dunn's pairwise comparisons show the difference lies between supplier 1 and supplier 3.","If p had been ≥ .05, there would be no evidence of group differences."]},"eco":{"es":["Comparar los ingresos de las microempresas según el sector.","Ingresos mensuales (millones), medianas (n = 35 por grupo; datos no normales): comercio 2,5; servicios 4,2; manufactura 5,3; H(2) = 13,62; p = 0,001; ε² = 0,13. Dunn con corrección de Holm: difieren comercio y manufactura.","Como p < 0,05, los ingresos difiere entre los grupos; las comparaciones por pares de Dunn muestran que la diferencia está entre comercio y manufactura.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias entre grupos."],"en":["Compare microenterprise revenue by sector.","Monthly revenue (million), medians (n = 35 per group; non-normal data): retail 2.5; services 4.2; manufacturing 5.3; H(2) = 13.62, p = .001, ε² = .13. Dunn with Holm correction: retail and manufacturing differ.","Because p < .05, revenue differs across groups; Dunn's pairwise comparisons show the difference lies between retail and manufacturing.","If p had been ≥ .05, there would be no evidence of group differences."]},"ing":{"es":["Comparar el tiempo entre fallas de tres líneas de producción.","Horas entre fallas, medianas (n = 35 por grupo; datos no normales): línea 1 104; línea 2 102; línea 3 78; H(2) = 8,00; p = 0,018; ε² = 0,08. Dunn con corrección de Holm: difieren línea 1 y línea 3.","Como p < 0,05, el tiempo entre fallas difiere entre los grupos; las comparaciones por pares de Dunn muestran que la diferencia está entre línea 1 y línea 3.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias entre grupos."],"en":["Compare time between failures across three production lines.","Hours between failures, medians (n = 35 per group; non-normal data): line 1 104; line 2 102; line 3 78; H(2) = 8.00, p = .018, ε² = .08. Dunn with Holm correction: line 1 and line 3 differ.","Because p < .05, time between failures differs across groups; Dunn's pairwise comparisons show the difference lies between line 1 and line 3.","If p had been ≥ .05, there would be no evidence of group differences."]},"der":{"es":["Comparar la duración de los procesos según la especialidad.","Días de duración, medianas (n = 35 por grupo; datos no normales): familia 322; laboral 377; civil 454; H(2) = 7,95; p = 0,019; ε² = 0,08. Dunn con corrección de Holm: difieren familia y civil.","Como p < 0,05, la duración difiere entre los grupos; las comparaciones por pares de Dunn muestran que la diferencia está entre familia y civil.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias entre grupos."],"en":["Compare case duration by jurisdiction.","Days, medians (n = 35 per group; non-normal data): family 322; labor 377; civil 454; H(2) = 7.95, p = .019, ε² = .08. Dunn with Holm correction: family and civil differ.","Because p < .05, duration differs across groups; Dunn's pairwise comparisons show the difference lies between family and civil.","If p had been ≥ .05, there would be no evidence of group differences."]}},"anovamr":{"sal":{"es":["Comparar la presión arterial al inicio, a los 3 y a los 6 meses de tratamiento.","Presión sistólica (mmHg), 30 pacientes medidos 3 veces: inicio 147; 3 meses 142; 6 meses 137; Mauchly W = 0,91, p = 0,27 (se cumple la esfericidad); F(2, 58) = 11,97; p < 0,001; η² parcial = 0,29.","Como p < 0,05, hubo cambios a lo largo del tiempo: la presión bajó con el tratamiento. Como Mauchly no fue significativo, no se necesitó la corrección de Greenhouse-Geisser.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio en el tiempo."],"en":["Compare blood pressure at baseline, 3, and 6 months of treatment.","Systolic pressure (mmHg), 30 patients measured 3 times: baseline 147; 3 months 142; 6 months 137; Mauchly's W = .91, p = .27 (sphericity holds); F(2, 58) = 11.97, p < .001, partial η² = .29.","Because p < .05, there were changes over time: pressure fell with treatment. Because Mauchly's test was not significant, no Greenhouse-Geisser correction was needed.","If p had been ≥ .05, there would be no evidence of change over time."]},"edu":{"es":["Comparar el puntaje de los estudiantes en tres evaluaciones del año.","Puntaje, 30 estudiantes medidos 3
