; adjusted R² = .40.","Holding tenure and region constant, each training hour is associated with 1.04 million more in sales. The full model explains 40% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"eco":{"es":["Estimar la relación entre educación y salario, ajustando por experiencia y sexo.","Logaritmo del salario (n = 1000): años de educación β = 0,086 por año (IC 95 %: 0,077–0,096; p < 0,001), ajustado por experiencia y sexo; R² ajustado = 0,45.","A igual experiencia y sexo, cada año adicional de educación se asocia con un salario 9,0 % mayor. El modelo completo explica el 45 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Estimate the relationship between education and wages, adjusting for experience and sex.","Log wage (n = 1000): years of schooling b = 0.086 per year, 95% CI [0.077, 0.096], p < .001, adjusted for experience and sex; adjusted R² = .45.","Holding experience and sex constant, each additional year of schooling is associated with a 9.0% higher wage. The full model explains 45% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"ing":{"es":["Determinar los factores del proceso que explican la resistencia del concreto.","Resistencia (n = 120): relación agua/cemento β = −44,7 MPa por unidad (IC 95 %: −52,6 a −36,9; p < 0,001), ajustado por edad del concreto y aditivo; R² ajustado = 0,57.","A igual edad del concreto y aditivo, aumentar la relación agua/cemento en 0,1 reduce la resistencia en unos 4,5 MPa. El modelo completo explica el 57 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine process factors that explain concrete strength.","Strength (n = 120): water/cement ratio b = −44.7 MPa per unit, 95% CI [−52.6, −36.9], p < .001, adjusted for concrete age and admixture; adjusted R² = .57.","Holding concrete age and admixture constant, raising the water/cement ratio by 0.1 lowers strength by about 4.5 MPa. The full model explains 57% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"der":{"es":["Determinar los factores asociados a la duración de los procesos.","Duración (días) (n = 400): número de partes β = 51 días por parte adicional (IC 95 %: 39–63; p < 0,001), ajustado por especialidad y carga del despacho; R² ajustado = 0,39.","A igual especialidad y carga del despacho, cada parte adicional se asocia con 51 días más de duración. El modelo completo explica el 39 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine factors associated with case duration.","Duration (days) (n = 400): number of parties b = 51 days per additional party, 95% CI [39, 63], p < .001, adjusted for jurisdiction and court caseload; adjusted R² = .39.","Holding jurisdiction and court caseload constant, each additional party is associated with 51 more days. The full model explains 39% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]}},"logb":{"sal":{"es":["Identificar los factores de riesgo asociados a la diabetes gestacional.","Diabetes gestacional (n = 600; 155 eventos; 4 parámetros): obesidad ORa = 3,48 (IC 95 %: 2,35–5,14; p < 0,001), ajustado por edad, antecedente familiar y paridad.","A igual edad, antecedente familiar y paridad, las gestantes con obesidad tienen 3,48 veces la chance de diabetes gestacional que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify risk factors for gestational diabetes.","Gestational diabetes (n = 600; 155 events; 4 parameters): obesity aOR = 3.48, 95% CI [2.35, 5.14], p < .001, adjusted for age, family history, and parity.","Holding age, family history, and parity constant, pregnant women with obesity have 3.48 times the odds of gestational diabetes compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"edu":{"es":["Identificar los factores asociados a la deserción en el primer año.","Deserción (n = 600; 153 eventos; 4 parámetros): trabajar más de 20 horas ORa = 2,37 (IC 95 %: 1,60–3,51; p < 0,001), ajustado por promedio del colegio y estrato.","A igual promedio del colegio y estrato, los estudiantes que trabajan más de 20 horas tienen 2,37 veces la chance de desertar que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with first-year dropout.","Dropout (n = 600; 153 events; 4 parameters): working over 20 hours aOR = 2.37, 95% CI [1.60, 3.51], p < .001, adjusted for high-school GPA and stratum.","Holding high-school GPA and stratum constant, students working over 20 hours have 2.37 times the odds of dropping out compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"soc":{"es":["Identificar los factores asociados a la violencia de pareja.","Violencia de pareja (n = 600; 153 eventos; 4 parámetros): consumo de alcohol de la pareja ORa = 2,02 (IC 95 %: 1,37–2,98; p < 0,001), ajustado por edad, escolaridad y zona.","A igual edad, escolaridad y zona, las mujeres cuya pareja bebe en exceso tienen 2,02 veces la chance de reportar violencia que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with intimate partner violence.","Partner violence (n = 600; 153 events; 4 parameters): partner's heavy drinking aOR = 2.02, 95% CI [1.37, 2.98], p < .001, adjusted for age, schooling, and area.","Holding age, schooling, and area constant, women whose partner drinks heavily have 2.02 times the odds of reporting violence compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"adm":{"es":["Identificar los factores asociados a la renuncia voluntaria.","Renuncia (n = 600; 159 eventos; 4 parámetros): horas extra frecuentes ORa = 2,53 (IC 95 %: 1,73–3,68; p < 0,001), ajustado por salario, antigüedad y área.","A igual salario, antigüedad y área, los empleados con horas extra frecuentes tienen 2,53 veces la chance de renunciar que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with voluntary resignation.","Resignation (n = 600; 159 events; 4 parameters): frequent overtime aOR = 2.53, 95% CI [1.73, 3.68], p < .001, adjusted for salary, tenure, and department.","Holding salary, tenure, and department constant, employees with frequent overtime have 2.53 times the odds of resigning compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"eco":{"es":["Identificar los factores asociados a la informalidad laboral.","Informalidad (n = 600; 176 eventos; 4 parámetros): secundaria incompleta ORa = 2,11 (IC 95 %: 1,47–3,05; p < 0,001), ajustado por edad, sexo y región.","A igual edad, sexo y región, quienes no terminaron la secundaria tienen 2,11 veces la chance de ser informales que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with informal employment.","Informality (n = 600; 176 events; 4 parameters): incomplete secondary school aOR = 2.11, 95% CI [1.47, 3.05], p < .001, adjusted for age, sex, and region.","Holding age, sex, and region constant, those without a secondary diploma have 2.11 times the odds of informal employment compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"ing":{"es":["Identificar los factores asociados a la falla de los motores.","Falla (n = 600; 172 eventos; 4 parámetros): operación con sobrecarga ORa = 2,93 (IC 95 %: 2,01–4,26; p < 0,001), ajustado por antigüedad y fabricante.","A igual antigüedad y fabricante, los motores que operan con sobrecarga tienen 2,93 veces la chance de fallar que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with motor failure.","Failure (n = 600; 172 events; 4 parameters): overload operation aOR = 2.93, 95% CI [2.01, 4.26], p < .001, adjusted for age and manufacturer.","Holding age and manufacturer constant, overloaded motors have 2.93 times the odds of failing compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]},"der":{"es":["Identificar los factores asociados a la condena.","Condena (n = 600; 157 eventos; 4 parámetros): defensa pública ORa = 2,75 (IC 95 %: 1,87–4,04; p < 0,001), ajustado por tipo de delito y antecedentes.","A igual tipo de delito y antecedentes, los acusados con defensa pública tienen 2,75 veces la chance de ser condenados que quienes no tienen esa característica. El IC no incluye el 1. Hay más de 10 eventos por parámetro estimado, como sugieren Peduzzi et al. (1996).","Si el IC hubiera incluido el 1, después de ajustar no habría asociación significativa."],"en":["Identify factors associated with conviction.","Conviction (n = 600; 157 events; 4 parameters): public defender aOR = 2.75, 95% CI [1.87, 4.04], p < .001, adjusted for offense type and prior record.","Holding offense type and prior record constant, defendants with a public defender have 2.75 times the odds of conviction compared with those without that characteristic. The CI excludes 1. There are more than 10 events per estimated parameter, as Peduzzi et al. (1996) suggest.","If the CI had included 1, there would be no significant association after adjustment."]}},"logcond":{"sal":{"es":["Identificar los factores de riesgo del cáncer gástrico en un estudio de casos y controles emparejados.","150 conjuntos 1:1 (casos emparejados por edad y sexo); 69 pares discordantes en la exposición. Infección por H. pylori: ORa = 2,28 (IC 95 %: 1,35–3,86; p = 0,002), ajustado por consumo de sal.","Dentro de cada par emparejado y a igual consumo de sal, la exposición (infección por H. pylori) se asocia con 2,28 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify risk factors for gastric cancer in a matched case-control study.","150 1:1 sets (cases matched on age and sex); 69 pairs discordant on exposure. H. pylori infection: aOR = 2.28, 95% CI [1.35, 3.86], p = .002, adjusted for salt intake.","Within each matched pair and holding salt intake constant, H. pylori infection is associated with 2.28 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"edu":{"es":["Identificar los factores asociados a la deserción en un estudio de casos y controles emparejados.","150 conjuntos 1:1 (desertores emparejados por programa y cohorte); 66 pares discordantes en la exposición. No tener beca: ORa = 2,44 (IC 95 %: 1,41–4,24; p = 0,002), ajustado por promedio de ingreso.","Dentro de cada par emparejado y a igual promedio de ingreso, la exposición (no tener beca) se asocia con 2,44 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with dropout in a matched case-control study.","150 1:1 sets (dropouts matched on program and cohort); 66 pairs discordant on exposure. Having no scholarship: aOR = 2.44, 95% CI [1.41, 4.24], p = .002, adjusted for admission score.","Within each matched pair and holding admission score constant, having no scholarship is associated with 2.44 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"soc":{"es":["Identificar los factores asociados al intento de suicidio en un estudio de casos y controles emparejados.","150 conjuntos 1:1 (casos emparejados por edad, sexo y barrio); 73 pares discordantes en la exposición. Consumo problemático de alcohol: ORa = 3,04 (IC 95 %: 1,77–5,23; p < 0,001), ajustado por apoyo social.","Dentro de cada par emparejado y a igual apoyo social, la exposición (consumo problemático de alcohol) se asocia con 3,04 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with suicide attempts in a matched case-control study.","150 1:1 sets (cases matched on age, sex, and neighborhood); 73 pairs discordant on exposure. Problem drinking: aOR = 3.04, 95% CI [1.77, 5.23], p < .001, adjusted for social support.","Within each matched pair and holding social support constant, problem drinking is associated with 3.04 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"adm":{"es":["Identificar los factores asociados a la quiebra en un estudio de empresas emparejadas.","150 conjuntos 1:1 (empresas quebradas emparejadas por sector y tamaño); 61 pares discordantes en la exposición. Endeudamiento alto: ORa = 3,40 (IC 95 %: 1,83–6,32; p < 0,001), ajustado por rentabilidad.","Dentro de cada par emparejado y a igual rentabilidad, la exposición (endeudamiento alto) se asocia con 3,40 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with bankruptcy in a matched-firm study.","150 1:1 sets (bankrupt firms matched on sector and size); 61 pairs discordant on exposure. High leverage: aOR = 3.40, 95% CI [1.83, 6.32], p < .001, adjusted for profitability.","Within each matched pair and holding profitability constant, high leverage is associated with 3.40 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"eco":{"es":["Identificar los factores asociados a las protestas sociales en un estudio de municipios emparejados.","150 conjuntos 1:1 (municipios con protestas emparejados por región y población); 70 pares discordantes en la exposición. Aumento del precio de los alimentos: ORa = 2,49 (IC 95 %: 1,47–4,24; p < 0,001), ajustado por desempleo.","Dentro de cada par emparejado y a igual desempleo, la exposición (aumento del precio de los alimentos) se asocia con 2,49 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with social protests in a matched-municipality study.","150 1:1 sets (municipalities with protests matched on region and population); 70 pairs discordant on exposure. Food price increase: aOR = 2.49, 95% CI [1.47, 4.24], p < .001, adjusted for unemployment.","Within each matched pair and holding unemployment constant, food price increase is associated with 2.49 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"ing":{"es":["Identificar los factores asociados a los accidentes de tránsito en un diseño de casos cruzados.","150 conjuntos 1:1 (viajes con accidente emparejados con viajes del mismo conductor); 75 pares discordantes en la exposición. Uso del celular al conducir: ORa = 3,55 (IC 95 %: 2,00–6,30; p < 0,001), ajustado por velocidad.","Dentro de cada par emparejado y a igual velocidad, la exposición (uso del celular al conducir) se asocia con 3,55 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with traffic crashes in a case-crossover design.","150 1:1 sets (crash trips matched with trips by the same driver); 75 pairs discordant on exposure. Phone use while driving: aOR = 3.55, 95% CI [2.00, 6.30], p < .001, adjusted for speed.","Within each matched pair and holding speed constant, phone use while driving is associated with 3.55 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]},"der":{"es":["Identificar los factores asociados a la reincidencia en un estudio de casos y controles emparejados.","150 conjuntos 1:1 (reincidentes emparejados por edad y delito); 68 pares discordantes en la exposición. No haber trabajado durante la reclusión: ORa = 4,01 (IC 95 %: 2,14–7,52; p < 0,001), ajustado por edad al primer delito.","Dentro de cada par emparejado y a igual edad al primer delito, la exposición (no haber trabajado durante la reclusión) se asocia con 4,01 veces la chance del evento. Solo los pares en los que caso y control difieren en la exposición aportan información.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with reoffending in a matched case-control study.","150 1:1 sets (reoffenders matched on age and offense); 68 pairs discordant on exposure. Not working during incarceration: aOR = 4.01, 95% CI [2.14, 7.52], p < .001, adjusted for age at first offense.","Within each matched pair and holding age at first offense constant, not working during incarceration is associated with 4.01 times the odds of the outcome. Only pairs in which case and control differ on exposure contribute information.","If the CI had included 1, there would be no significant association."]}},"logm":{"sal":{"es":["Determinar los factores asociados a la severidad del dengue.","Severidad (sin signos de alarma, con signos de alarma, grave); n = 400 (186, 110 y 104 por categoría); modelo ordinal de odds proporcionales: diabetes ORa = 2,25 (IC 95 %: 1,53–3,30; p < 0,001), ajustado por una covariable.","Los pacientes con diabetes tienen 2,25 veces la chance de estar en una categoría de mayor severidad, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with dengue severity.","Severity (no warning signs, warning signs, severe); n = 400 (186, 110, and 104 per category); proportional-odds ordinal model: diabetes aOR = 2.25, 95% CI [1.53, 3.30], p < .001, adjusted for one covariate.","Patients with diabetes have 2.25 times the odds of being in a more severe category, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"edu":{"es":["Determinar los factores asociados al nivel de desempeño en la prueba.","Desempeño (bajo, medio, alto); n = 400 (193, 105 y 102 por categoría); modelo ordinal de odds proporcionales: internet en casa ORa = 1,90 (IC 95 %: 1,29–2,82; p = 0,001), ajustado por una covariable.","Los estudiantes con internet en casa tienen 1,90 veces la chance de estar en un nivel de desempeño más alto, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with test performance level.","Performance (low, medium, high); n = 400 (193, 105, and 102 per category); proportional-odds ordinal model: home internet aOR = 1.90, 95% CI [1.29, 2.82], p = .001, adjusted for one covariate.","Students with home internet have 1.90 times the odds of being in a higher performance level, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"soc":{"es":["Determinar los factores asociados a la severidad de la depresión.","Severidad (leve, moderada, grave); n = 400 (188, 109 y 103 por categoría); modelo ordinal de odds proporcionales: desempleo ORa = 1,71 (IC 95 %: 1,17–2,49; p = 0,006), ajustado por una covariable.","Las personas desempleadas tienen 1,71 veces la chance de estar en una categoría de mayor severidad, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with depression severity.","Severity (mild, moderate, severe); n = 400 (188, 109, and 103 per category); proportional-odds ordinal model: unemployment aOR = 1.71, 95% CI [1.17, 2.49], p = .006, adjusted for one covariate.","Unemployed people have 1.71 times the odds of being in a more severe category, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"adm":{"es":["Determinar los factores asociados al nivel de satisfacción del cliente.","Satisfacción (baja, media, alta); n = 400 (181, 106 y 113 por categoría); modelo ordinal de odds proporcionales: atención personalizada ORa = 2,27 (IC 95 %: 1,56–3,32; p < 0,001), ajustado por una covariable.","Los clientes con atención personalizada tienen 2,27 veces la chance de estar en un nivel de satisfacción más alto, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with customer satisfaction level.","Satisfaction (low, medium, high); n = 400 (181, 106, and 113 per category); proportional-odds ordinal model: personalized service aOR = 2.27, 95% CI [1.56, 3.32], p < .001, adjusted for one covariate.","Customers receiving personalized service have 2.27 times the odds of being in a higher satisfaction level, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"eco":{"es":["Determinar los factores asociados a la seguridad alimentaria del hogar.","Seguridad alimentaria (inseguro, en riesgo, seguro); n = 400 (190, 104 y 106 por categoría); modelo ordinal de odds proporcionales: ingreso estable ORa = 1,76 (IC 95 %: 1,20–2,59; p = 0,004), ajustado por una covariable.","Los hogares con ingreso estable tienen 1,76 veces la chance de estar en una categoría más segura, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with household food security.","Food security (insecure, at risk, secure); n = 400 (190, 104, and 106 per category); proportional-odds ordinal model: stable income aOR = 1.76, 95% CI [1.20, 2.59], p = .004, adjusted for one covariate.","Households with a stable income have 1.76 times the odds of being in a more secure category, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"ing":{"es":["Determinar los factores asociados al nivel de daño estructural después de un sismo.","Daño (leve, moderado, severo); n = 400 (194, 120 y 86 por categoría); modelo ordinal de odds proporcionales: construcción anterior a la norma sismorresistente ORa = 1,85 (IC 95 %: 1,26–2,72; p = 0,002), ajustado por una covariable.","Las edificaciones anteriores a la norma tienen 1,85 veces la chance de estar en una categoría de mayor daño, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with structural damage level after an earthquake.","Damage (light, moderate, severe); n = 400 (194, 120, and 86 per category); proportional-odds ordinal model: construction before the seismic code aOR = 1.85, 95% CI [1.26, 2.72], p = .002, adjusted for one covariate.","Pre-code buildings have 1.85 times the odds of being in a higher damage category, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]},"der":{"es":["Determinar los factores asociados a la severidad de la pena.","Pena (baja, media, alta); n = 400 (190, 88 y 122 por categoría); modelo ordinal de odds proporcionales: reincidencia ORa = 1,80 (IC 95 %: 1,22–2,64; p = 0,003), ajustado por una covariable.","Los reincidentes tienen 1,80 veces la chance de recibir una pena de mayor severidad, ajustando por las demás variables. El modelo supone que ese OR es el mismo en todos los cortes entre categorías.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Determine factors associated with sentence severity.","Sentence (low, medium, high); n = 400 (190, 88, and 122 per category); proportional-odds ordinal model: prior conviction aOR = 1.80, 95% CI [1.22, 2.64], p = .003, adjusted for one covariate.","Repeat offenders have 1.80 times the odds of a more severe sentence, adjusting for the other variables. The model assumes this OR is the same at every cut-point between categories.","If the CI had included 1, there would be no significant association."]}},"pois":{"sal":{"es":["Identificar los factores asociados al número de caídas en adultos mayores.","Caídas en un año (n = 400), modelo de Poisson: mareo razón de tasas ajustada = 1,76 (IC 95 %: 1,40–2,21; p < 0,001); dispersión = 0,97.","Con igualdad en las demás variables, los adultos mayores con mareo tienen 76 % más caídas. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of falls in older adults.","Falls per year (n = 400), Poisson model: dizziness adjusted rate ratio = 1.76, 95% CI [1.40, 2.21], p < .001; dispersion = 0.97.","Holding other variables constant, older adults with dizziness have 76% more falls. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"edu":{"es":["Identificar los factores asociados al número de ausencias escolares.","Ausencias en el año (n = 400), modelo de Poisson: vivir a más de 5 km del colegio razón de tasas ajustada = 1,41 (IC 95 %: 1,33–1,51; p < 0,001); dispersión = 1,17.","Con igualdad en las demás variables, los estudiantes que viven lejos tienen 41 % más ausencias. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of school absences.","Absences per year (n = 400), Poisson model: living over 5 km from school adjusted rate ratio = 1.41, 95% CI [1.33, 1.51], p < .001; dispersion = 1.17.","Holding other variables constant, students living far away have 41% more absences. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"soc":{"es":["Identificar los factores asociados al número de riñas por barrio.","Riñas por barrio en un año (n = 400), modelo de Poisson: falta de alumbrado público razón de tasas ajustada = 1,45 (IC 95 %: 1,35–1,56; p < 0,001); dispersión = 1,06.","Con igualdad en las demás variables, los barrios sin alumbrado adecuado tienen 45 % más riñas. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of fights per neighborhood.","Fights per neighborhood per year (n = 400), Poisson model: lack of street lighting adjusted rate ratio = 1.45, 95% CI [1.35, 1.56], p < .001; dispersion = 1.06.","Holding other variables constant, neighborhoods without adequate lighting have 45% more fights. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"adm":{"es":["Identificar los factores asociados al número de accidentes laborales.","Accidentes por trabajador en un año (n = 400), modelo de Poisson: turno nocturno razón de tasas ajustada = 1,85 (IC 95 %: 1,41–2,42; p < 0,001); dispersión = 0,93.","Con igualdad en las demás variables, los trabajadores del turno nocturno tienen 85 % más accidentes. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of workplace accidents.","Accidents per worker per year (n = 400), Poisson model: night shift adjusted rate ratio = 1.85, 95% CI [1.41, 2.42], p < .001; dispersion = 0.93.","Holding other variables constant, night-shift workers have 85% more accidents. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"eco":{"es":["Identificar los factores asociados al número de empresas creadas por municipio.","Empresas creadas en un año (n = 400), modelo de Poisson: acceso a banda ancha razón de tasas ajustada = 1,46 (IC 95 %: 1,40–1,51; p < 0,001); dispersión = 0,93.","Con igualdad en las demás variables, los municipios con banda ancha crean 46 % más empresas. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of new firms per municipality.","New firms per year (n = 400), Poisson model: broadband access adjusted rate ratio = 1.46, 95% CI [1.40, 1.51], p < .001; dispersion = 0.93.","Holding other variables constant, municipalities with broadband create 46% more firms. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"ing":{"es":["Identificar los factores asociados al número de defectos por lote.","Defectos por lote (n = 400), modelo de Poisson: máquina con más de 10 años razón de tasas ajustada = 1,37 (IC 95 %: 1,24–1,52; p < 0,001); dispersión = 0,93.","Con igualdad en las demás variables, los lotes de máquinas antiguas tienen 37 % más defectos. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of defects per batch.","Defects per batch (n = 400), Poisson model: machine over 10 years old adjusted rate ratio = 1.37, 95% CI [1.24, 1.52], p < .001; dispersion = 0.93.","Holding other variables constant, batches from older machines have 37% more defects. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]},"der":{"es":["Identificar los factores asociados al número de recursos interpuestos por proceso.","Recursos por proceso (n = 400), modelo de Poisson: defensa privada razón de tasas ajustada = 1,44 (IC 95 %: 1,22–1,69; p < 0,001); dispersión = 1,05.","Con igualdad en las demás variables, los procesos con defensa privada tienen 44 % más recursos. La dispersión cercana a 1 indica que el modelo de Poisson es adecuado; si fuera mucho mayor, se usaría la binomial negativa.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Identify factors associated with the number of appeals filed per case.","Appeals per case (n = 400), Poisson model: private attorney adjusted rate ratio = 1.44, 95% CI [1.22, 1.69], p < .001; dispersion = 1.05.","Holding other variables constant, cases with a private attorney have 44% more appeals. Dispersion near 1 indicates the Poisson model fits; if it were much larger, negative binomial regression would be used.","If the CI had included 1, there would be no significant association."]}},"mix":{"sal":{"es":["Evaluar el efecto de la intervención sobre la hemoglobina glicada durante 12 meses.","HbA1c (%): 200 pacientes medidos 4 veces; modelo mixto con intercepto aleatorio por paciente; interacción tiempo × grupo β = −0,068 por mes (IC 95 %: −0,083 a −0,053; p < 0,001).","En el grupo de intervención la hemoglobina glicada bajó 0,068 puntos por mes más que en el control, teniendo en cuenta que cada unidad aporta varias mediciones correlacionadas.","Si la interacción no hubiera sido significativa, las trayectorias de los grupos serían similares."],"en":["Evaluate the intervention's effect on HbA1c over 12 months.","HbA1c (%): 200 patients measured 4 times; mixed model with a random intercept per patient; time × group interaction b = −0.068 per month, 95% CI [−0.083, −0.053], p < .001.","In the intervention group HbA1c fell 0.068 points per month more than in the control group, accounting for the fact that each unit contributes several correlated measurements.","If the interaction had not been significant, the groups' trajectories would be similar."]},"soc":{"es":["Evaluar el efecto del programa sobre el bienestar a lo largo de cuatro mediciones.","Bienestar: 200 participantes medidos 4 veces; modelo mixto con intercepto aleatorio por participante; interacción tiempo × grupo β = 1,10 por medición (IC 95 %: 0,61–1,59; p < 0,001).","El bienestar del grupo del programa aumentó 1,10 puntos por medición más que el del grupo de comparación, teniendo en cuenta que cada unidad aporta varias mediciones correlacionadas.","Si la interacción no hubiera sido significativa, las trayectorias de los grupos serían similares."],"en":["Evaluate the program's effect on well-being across four measurements.","Well-being: 200 participants measured 4 times; mixed model with a random intercept per participant; time × group interaction b = 1.10 per measurement, 95% CI [0.61, 1.59], p < .001.","Well-being in the program group rose 1.10 points per measurement more than in the comparison group, accounting for the fact that each unit contributes several correlated measurements.","If the interaction had not been significant, the groups' trajectories would be similar."]},"ing":{"es":["Evaluar el efecto del recubrimiento sobre el desgaste a lo largo de seis mediciones.","Desgaste (mm): 40 piezas medidos 6 veces; modelo mixto con intercepto aleatorio por pieza; interacción tiempo × grupo β = −0,031 por mes (IC 95 %: −0,034 a −0,028; p < 0,001).","Las piezas con recubrimiento se desgastan 0,031 mm menos por mes que las piezas sin recubrimiento, teniendo en cuenta que cada unidad aporta varias mediciones correlacionadas.","Si la interacción no hubiera sido significativa, las trayectorias de los grupos serían similares."],"en":["Evaluate the effect of coating on wear across six measurements.","Wear (mm): 40 parts measured 6 times; mixed model with a random intercept per part; time × group interaction b = −0.031 per month, 95% CI [−0.034, −0.028], p < .001.","Coated parts wear 0.031 mm less per month than uncoated parts, accounting for the fact that each unit contributes several correlated measurements.","If the interaction had not been significant, the groups' trajectories would be similar."]},"edu":{"es":["Estimar el efecto de la tutoría sobre el puntaje, considerando que los estudiantes están agrupados en colegios.","Puntaje: 3000 estudiantes en 120 colegios; modelo multinivel con intercepto aleatorio por colegio: tutoría β = 5,1 puntos (IC 95 %: 1,8–8,5; p = 0,003); correlación intraclase = 0,15.","Teniendo en cuenta que las unidades de un mismo grupo se parecen, la tutoría se asocia con 5,1 puntos más. El 15 % de la variación total se debe a diferencias entre colegios; ignorar ese agrupamiento subestimaría los errores estándar.","Si el IC hubiera incluido el 0, no habría evidencia de efecto."],"en":["Estimate the effect of tutoring on scores, accounting for students nested in schools.","Score: 3000 students in 120 schools; multilevel model with a random intercept per school: tutoring b = 5.1 points, 95% CI [1.8, 8.5], p = .003; intraclass correlation = .15.","Accounting for the similarity of units in the same group, tutoring is associated with 5.1 points more. 15% of the total variation lies between schools; ignoring this clustering would understate the standard errors.","If the CI had included 0, there would be no evidence of an effect."]},"adm":{"es":["Estimar el efecto del buen liderazgo del jefe sobre la satisfacción, considerando que los empleados están agrupados en equipos.","Satisfacción (0–100): 1500 empleados en 60 equipos; modelo multinivel con intercepto aleatorio por equipo: liderazgo alto del jefe β = 3,7 puntos (IC 95 %: 2,1–5,3; p < 0,001); correlación intraclase = 0,28.","Teniendo en cuenta que las unidades de un mismo grupo se parecen, el liderazgo alto del jefe se asocia con 3,7 puntos más. El 28 % de la variación total se debe a diferencias entre equipos; ignorar ese agrupamiento subestimaría los errores estándar.","Si el IC hubiera incluido el 0, no habría evidencia de efecto."],"en":["Estimate the effect of good supervisor leadership on satisfaction, accounting for employees nested in teams.","Satisfaction (0–100): 1500 employees in 60 teams; multilevel model with a random intercept per team: high supervisor leadership b = 3.7 points, 95% CI [2.1, 5.3], p < .001; intraclass correlation = .28.","Accounting for the similarity of units in the same group, high supervisor leadership is associated with 3.7 points more. 28% of the total variation lies between teams; ignoring this clustering would understate the standard errors.","If the CI had included 0, there would be no evidence of an effect."]},"eco":{"es":["Estimar el efecto del acceso a crédito sobre el ingreso, considerando que los hogares están agrupados en municipios.","Ingreso mensual (millones): 2000 hogares en 80 municipios; modelo multinivel con intercepto aleatorio por municipio: acceso a crédito β = 0,16 millones (IC 95 %: 0,07–0,25; p < 0,001); correlación intraclase = 0,12.","Teniendo en cuenta que las unidades de un mismo grupo se parecen, el acceso a crédito se asocia con 0,16 millones más. El 12 % de la variación total se debe a diferencias entre municipios; ignorar ese agrupamiento subestimaría los errores estándar.","Si el IC hubiera incluido el 0, no habría evidencia de efecto."],"en":["Estimate the effect of credit access on income, accounting for households nested in municipalities.","Monthly income (million): 2000 households in 80 municipalities; multilevel model with a random intercept per municipalitie: credit access b = 0.16 million, 95% CI [0.07, 0.25], p < .001; intraclass correlation = .12.","Accounting for the similarity of units in the same group, credit access is associated with 0.16 million more. 12% of the total variation lies between municipalities; ignoring this clustering would understate the standard errors.","If the CI had included 0, there would be no evidence of an effect."]},"der":{"es":["Estimar el efecto de la oralidad sobre la duración, considerando que los procesos están agrupados en despachos.","Duración (días): 4500 procesos en 150 despachos; modelo multinivel con intercepto aleatorio por despacho: proceso oral β = −59 días (IC 95 %: −68 a −51; p < 0,001); correlación intraclase = 0,28.","Teniendo en cuenta que las unidades de un mismo grupo se parecen, el proceso oral se asocia con 59 días menos. El 28 % de la variación total se debe a diferencias entre despachos; ignorar ese agrupamiento subestimaría los errores estándar.","Si el IC hubiera incluido el 0, no habría evidencia de efecto."],"en":["Estimate the effect of oral proceedings on duration, accounting for cases nested in court offices.","Duration (days): 4500 cases in 150 offices; multilevel model with a random intercept per office: oral proceeding b = −59 days, 95% CI [−68, −51], p < .001; intraclass correlation = .28.","Accounting for the similarity of units in the same group, oral proceeding is associated with 59 days less. 28% of the total variation lies between offices; ignoring this clustering would understate the standard errors.","If the CI had included 0, there would be no evidence of an effect."]}},"cox":{"sal":{"es":["Determinar los factores pronósticos de mortalidad en pacientes con insuficiencia cardiaca.","Mortalidad (n = 300; 165 eventos): diabetes HR = 2,11 (IC 95 %: 1,54–2,91; p < 0,001), ajustado por edad y fracción de eyección.","A igual edad y fracción de eyección, los pacientes con diabetes tienen en cada momento un riesgo de morir 2,11 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine prognostic factors for mortality in heart failure patients.","Mortality (n = 300; 165 events): diabetes HR = 2.11, 95% CI [1.54, 2.91], p < .001, adjusted for age and ejection fraction.","Holding age and ejection fraction constant, patients with diabetes have, at any given time, 2.11 times the hazard of death. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"edu":{"es":["Determinar los factores asociados al tiempo hasta la deserción.","Deserción (n = 300; 132 eventos): no tener apoyo financiero HR = 1,92 (IC 95 %: 1,35–2,73; p < 0,001), ajustado por puntaje de ingreso y programa.","A igual puntaje de ingreso y programa, los estudiantes sin apoyo financiero tienen en cada momento un riesgo de desertar 1,92 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to dropout.","Dropout (n = 300; 132 events): no financial aid HR = 1.92, 95% CI [1.35, 2.73], p < .001, adjusted for admission score and program.","Holding admission score and program constant, students without financial aid have, at any given time, 1.92 times the hazard of dropping out. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"soc":{"es":["Determinar los factores asociados al tiempo hasta la recaída.","Recaída (n = 300; 195 eventos): entorno con consumo HR = 1,91 (IC 95 %: 1,44–2,54; p < 0,001), ajustado por edad y tipo de sustancia.","A igual edad y tipo de sustancia, quienes viven en un entorno con consumo tienen en cada momento un riesgo de recaer 1,91 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to relapse.","Relapse (n = 300; 195 events): living where others use substances HR = 1.91, 95% CI [1.44, 2.54], p < .001, adjusted for age and substance type.","Holding age and substance type constant, those living where others use substances have, at any given time, 1.91 times the hazard of relapse. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"adm":{"es":["Determinar los factores asociados al tiempo hasta la renuncia.","Renuncia (n = 300; 216 eventos): salario por debajo del mercado HR = 1,90 (IC 95 %: 1,44–2,49; p < 0,001), ajustado por antigüedad y área.","A igual antigüedad y área, los empleados con salario por debajo del mercado tienen en cada momento un riesgo de renunciar 1,90 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to resignation.","Resignation (n = 300; 216 events): below-market salary HR = 1.90, 95% CI [1.44, 2.49], p < .001, adjusted for tenure and department.","Holding tenure and department constant, employees with below-market salaries have, at any given time, 1.90 times the hazard of resigning. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"eco":{"es":["Determinar los factores asociados al tiempo hasta el cierre de las empresas.","Cierre (n = 300; 173 eventos): endeudamiento alto HR = 1,64 (IC 95 %: 1,21–2,22; p = 0,001), ajustado por sector y tamaño.","A igual sector y tamaño, las empresas muy endeudadas tienen en cada momento un riesgo de cerrar 1,64 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to firm closure.","Closure (n = 300; 173 events): high leverage HR = 1.64, 95% CI [1.21, 2.22], p = .001, adjusted for sector and size.","Holding sector and size constant, highly leveraged firms have, at any given time, 1.64 times the hazard of closing. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"ing":{"es":["Determinar los factores asociados al tiempo hasta la falla de los equipos.","Falla (n = 300; 214 eventos): carga mayor al 80 % HR = 2,05 (IC 95 %: 1,56–2,69; p < 0,001), ajustado por antigüedad y fabricante.","A igual antigüedad y fabricante, los equipos con alta carga tienen en cada momento un riesgo de falla 2,05 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to equipment failure.","Failure (n = 300; 214 events): load above 80% HR = 2.05, 95% CI [1.56, 2.69], p < .001, adjusted for age and manufacturer.","Holding age and manufacturer constant, high-load equipment has, at any given time, 2.05 times the hazard of failure. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]},"der":{"es":["Determinar los factores asociados al tiempo hasta la reincidencia.","Reincidencia (n = 300; 137 eventos): no haber participado en programas laborales HR = 1,75 (IC 95 %: 1,25–2,45; p = 0,001), ajustado por edad y delito.","A igual edad y delito, quienes no participaron en programas laborales tienen en cada momento un riesgo de reincidir 1,75 veces mayor. El IC no incluye el 1. El modelo supone que esa razón de riesgos se mantiene constante en el tiempo (riesgos proporcionales).","Si el IC hubiera incluido el 1, no sería un factor significativo."],"en":["Determine factors associated with time to reoffending.","Reoffending (n = 300; 137 events): no work program participation HR = 1.75, 95% CI [1.25, 2.45], p = .001, adjusted for age and offense.","Holding age and offense constant, those who did not join work programs have, at any given time, 1.75 times the hazard of reoffending. The CI excludes 1. The model assumes the hazard ratio is constant over time (proportional hazards).","If the CI had included 1, it would not be a significant factor."]}},"panel":{"sal":{"es":["Estimar el efecto del gasto en salud sobre la mortalidad infantil. (32 departamentos, 10 años)","Efectos fijos: gasto per cápita (por cada 100 mil pesos) β = −0,54 muertes por 1.000 nacidos vivos (IC 95 %: −0,73 a −0,35; p < 0,001). Efectos aleatorios: β = −0,40. Prueba de Hausman χ²(1) = 19,19; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, los años con más gasto se asocian con menos mortalidad infantil, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of health spending on infant mortality. (32 departments, 10 years)","Fixed effects: per-capita spending (per 100,000 pesos) b = −0.54 deaths per 1,000 live births, 95% CI [−0.73, −0.35], p < .001. Random effects: b = −0.40. Hausman test χ²(1) = 19.19, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, years with higher spending are associated with lower infant mortality, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"edu":{"es":["Estimar el efecto del gasto por estudiante sobre el puntaje. (500 colegios, 6 años)","Efectos fijos: gasto por estudiante (por millón) β = 1,45 puntos (IC 95 %: 1,32–1,57; p < 0,001). Efectos aleatorios: β = 1,57. Prueba de Hausman χ²(1) = 57,53; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, los años con más gasto por estudiante se asocian con mejores puntajes, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of spending per student on test scores. (500 schools, 6 years)","Fixed effects: spending per student (per million) b = 1.45 points, 95% CI [1.32, 1.57], p < .001. Random effects: b = 1.57. Hausman test χ²(1) = 57.53, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, years with higher spending per student are associated with higher scores, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"soc":{"es":["Estimar el efecto del desempleo sobre los homicidios. (200 municipios, 12 años)","Efectos fijos: tasa de desempleo (por punto) β = 0,85 homicidios por 100 mil (IC 95 %: 0,76–0,93; p < 0,001). Efectos aleatorios: β = 0,90. Prueba de Hausman χ²(1) = 145,43; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, los años con más desempleo tienen más homicidios, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of unemployment on homicides. (200 municipalities, 12 years)","Fixed effects: unemployment rate (per point) b = 0.85 homicides per 100,000, 95% CI [0.76, 0.93], p < .001. Random effects: b = 0.90. Hausman test χ²(1) = 145.43, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, years with higher unemployment have more homicides, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"adm":{"es":["Estimar el efecto de la inversión en innovación sobre la productividad. (300 empresas, 8 años)","Efectos fijos: log de la inversión β = 0,037 en el log de la productividad (IC 95 %: 0,033–0,041; p < 0,001). Efectos aleatorios: β = 0,039. Prueba de Hausman χ²(1) = 47,57; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, un aumento de 1 % en la inversión se asocia con cerca de 0,04 % más de productividad, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of innovation investment on productivity. (300 firms, 8 years)","Fixed effects: log investment b = 0.037 in log productivity, 95% CI [0.033, 0.041], p < .001. Random effects: b = 0.039. Hausman test χ²(1) = 47.57, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, a 1% increase in investment is associated with about 0.04% higher productivity, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"eco":{"es":["Estimar el efecto de la apertura comercial sobre el crecimiento. (40 países, 20 años)","Efectos fijos: apertura (por punto porcentual del PIB) β = 0,026 puntos de crecimiento (IC 95 %: 0,021–0,031; p < 0,001). Efectos aleatorios: β = 0,030. Prueba de Hausman χ²(1) = 136,92; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, los años con más apertura se asocian con un crecimiento ligeramente mayor, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of trade openness on growth. (40 countries, 20 years)","Fixed effects: openness (per percentage point of GDP) b = 0.026 growth points, 95% CI [0.021, 0.031], p < .001. Random effects: b = 0.030. Hausman test χ²(1) = 136.92, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, years with more openness are associated with slightly higher growth, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"ing":{"es":["Estimar el efecto de la edad del pavimento sobre la rugosidad. (150 tramos, 10 años)","Efectos fijos: edad (por año) β = 0,121 m/km de rugosidad (IRI) (IC 95 %: 0,107–0,135; p < 0,001). Efectos aleatorios: β = 0,130. Prueba de Hausman χ²(1) = 58,28; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, cada año adicional aumenta la rugosidad, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of pavement age on roughness. (150 road sections, 10 years)","Fixed effects: age (per year) b = 0.121 m/km roughness (IRI), 95% CI [0.107, 0.135], p < .001. Random effects: b = 0.130. Hausman test χ²(1) = 58.28, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, each additional year increases roughness, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]},"der":{"es":["Estimar el efecto del número de jueces sobre la congestión judicial. (33 distritos, 10 años)","Efectos fijos: jueces por 100 mil habitantes β = −3,84 puntos del índice de congestión (IC 95 %: −4,84 a −2,83; p < 0,001). Efectos aleatorios: β = −2,84. Prueba de Hausman χ²(1) = 144,92; p < 0,001.","Hausman con p < 0,05 indica que los efectos aleatorios están sesgados y favorece los efectos fijos: dentro de cada unidad, más jueces se asocian con menos congestión, controlando todo lo que es estable en cada una.","Si el IC de β hubiera incluido el 0, no habría evidencia de efecto dentro de las unidades."],"en":["Estimate the effect of the number of judges on court congestion. (33 districts, 10 years)","Fixed effects: judges per 100,000 inhabitants b = −3.84 congestion index points, 95% CI [−4.84, −2.83], p < .001. Random effects: b = −2.84. Hausman test χ²(1) = 144.92, p < .001.","A Hausman p < .05 indicates the random-effects estimate is biased and favors fixed effects: within each unit, more judges are associated with less congestion, controlling for everything stable in each unit.","If the CI for b had included 0, there would be no evidence of a within-unit effect."]}},"did":{"sal":{"es":["Estimar el efecto del impuesto a las bebidas azucaradas sobre su consumo.","Litros por hogar a la semana: región con impuesto 3,55 → 3,02; región sin impuesto 3,16 → 3,08 (100 unidades por grupo). Efecto (interacción grupo × periodo) = −0,45 litros (IC 95 %: −0,79 a −0,11; p = 0,009). Tendencias previas (3 periodos): diferencia de pendientes p = 0,958.","El grupo tratado cambió −0,53 y el de comparación −0,08; el efecto atribuible es la diferencia entre esos cambios: el impuesto redujo el consumo en 0,45 litros. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of a sugary-drink tax on consumption.","Liters per household per week: taxed region 3.55 → 3.02; untaxed region 3.16 → 3.08 (100 units per group). Effect (group × period interaction) = −0.45 liters, 95% CI [−0.79, −0.11], p = .009. Pre-trends (3 periods): slope difference p = .958.","The treated group changed by −0.53 and the comparison group by −0.08; the attributable effect is the difference between those changes: the tax reduced consumption by 0.45 liters. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"edu":{"es":["Estimar el efecto de la jornada única sobre el puntaje en la prueba estatal.","Puntaje: colegios con jornada única 65,1 → 70,8; colegios sin jornada única 62,1 → 60,1 (60 unidades por grupo). Efecto (interacción grupo × periodo) = 7,7 puntos (IC 95 %: 2,9–12,5; p = 0,002). Tendencias previas (3 periodos): diferencia de pendientes p = 0,963.","El grupo tratado cambió 5,7 y el de comparación −2,0; el efecto atribuible es la diferencia entre esos cambios: la jornada única aumentó el puntaje en 7,7 puntos. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of full-day schooling on state test scores.","Score: full-day schools 65.1 → 70.8; other schools 62.1 → 60.1 (60 units per group). Effect (group × period interaction) = 7.7 points, 95% CI [2.9, 12.5], p = .002. Pre-trends (3 periods): slope difference p = .963.","The treated group changed by 5.7 and the comparison group by −2.0; the attributable effect is the difference between those changes: full-day schooling raised scores by 7.7 points. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"soc":{"es":["Estimar el efecto de un programa de prevención sobre los homicidios de jóvenes.","Homicidios por 100 mil jóvenes: barrios con programa 28,0 → 20,4; barrios sin programa 24,2 → 24,3 (40 unidades por grupo). Efecto (interacción grupo × periodo) = −7,7 homicidios por 100 mil (IC 95 %: −11,9 a −3,5; p < 0,001). Tendencias previas (3 periodos): diferencia de pendientes p = 0,814.","El grupo tratado cambió −7,6 y el de comparación 0,1; el efecto atribuible es la diferencia entre esos cambios: el programa redujo los homicidios en 7,7 homicidios por 100 mil. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of a prevention program on youth homicides.","Homicides per 100,000 youth: program neighborhoods 28.0 → 20.4; other neighborhoods 24.2 → 24.3 (40 units per group). Effect (group × period interaction) = −7.7 per 100,000, 95% CI [−11.9, −3.5], p < .001. Pre-trends (3 periods): slope difference p = .814.","The treated group changed by −7.6 and the comparison group by 0.1; the attributable effect is the difference between those changes: the program reduced homicides by 7.7 per 100,000. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"adm":{"es":["Estimar el efecto del teletrabajo sobre el ausentismo.","Días de ausencia al año: sede con teletrabajo 7,5 → 5,7; sedes sin teletrabajo 6,5 → 6,6 (120 unidades por grupo). Efecto (interacción grupo × periodo) = −1,9 días (IC 95 %: −2,8 a −1,0; p < 0,001). Tendencias previas (3 periodos): diferencia de pendientes p = 0,817.","El grupo tratado cambió −1,8 y el de comparación 0,1; el efecto atribuible es la diferencia entre esos cambios: el teletrabajo redujo el ausentismo en 1,9 días. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of telework on absenteeism.","Days absent per year: telework site 7.5 → 5.7; other sites 6.5 → 6.6 (120 units per group). Effect (group × period interaction) = −1.9 days, 95% CI [−2.8, −1.0], p < .001. Pre-trends (3 periods): slope difference p = .817.","The treated group changed by −1.8 and the comparison group by 0.1; the attributable effect is the difference between those changes: telework reduced absenteeism by 1.9 days. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"eco":{"es":["Estimar el efecto del aumento del salario mínimo sobre el empleo formal.","Empleo formal (índice, base 100): municipios con aumento 102,5 → 100,7; municipios sin aumento 100,2 → 100,7 (150 unidades por grupo). Efecto (interacción grupo × periodo) = −2,3 puntos (IC 95 %: −3,9 a −0,7; p = 0,005). Tendencias previas (3 periodos): diferencia de pendientes p = 0,308.","El grupo tratado cambió −1,8 y el de comparación 0,5; el efecto atribuible es la diferencia entre esos cambios: el aumento del salario mínimo redujo el crecimiento del empleo formal en 2,3 puntos. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of a minimum wage increase on formal employment.","Formal employment (index, base 100): municipalities with the increase 102.5 → 100.7; municipalities without it 100.2 → 100.7 (150 units per group). Effect (group × period interaction) = −2.3 points, 95% CI [−3.9, −0.7], p = .005. Pre-trends (3 periods): slope difference p = .308.","The treated group changed by −1.8 and the comparison group by 0.5; the attributable effect is the difference between those changes: the minimum wage increase slowed formal employment growth by 2.3 points. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"ing":{"es":["Estimar el efecto del carril exclusivo de buses sobre el tiempo de viaje.","Minutos de viaje: corredor con carril 45,7 → 37,6; corredores sin carril 42,7 → 42,7 (60 unidades por grupo). Efecto (interacción grupo × periodo) = −8,1 minutos (IC 95 %: −10,9 a −5,3; p < 0,001). Tendencias previas (3 periodos): diferencia de pendientes p = 0,654.","El grupo tratado cambió −8,1 y el de comparación 0,0; el efecto atribuible es la diferencia entre esos cambios: el carril exclusivo redujo el tiempo de viaje en 8,1 minutos. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of a bus lane on travel time.","Travel minutes: corridor with the lane 45.7 → 37.6; other corridors 42.7 → 42.7 (60 units per group). Effect (group × period interaction) = −8.1 minutes, 95% CI [−10.9, −5.3], p < .001. Pre-trends (3 periods): slope difference p = .654.","The treated group changed by −8.1 and the comparison group by 0.0; the attributable effect is the difference between those changes: the bus lane cut travel time by 8.1 minutes. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]},"der":{"es":["Estimar el efecto de la reforma de oralidad sobre la duración de los procesos.","Días de duración: distritos con reforma 621 → 484; distritos sin reforma 543 → 543 (80 unidades por grupo). Efecto (interacción grupo × periodo) = −137 días (IC 95 %: −198 a −75; p < 0,001). Tendencias previas (3 periodos): diferencia de pendientes p = 0,314.","El grupo tratado cambió −137 y el de comparación 0; el efecto atribuible es la diferencia entre esos cambios: la reforma redujo la duración en 137 días. Las tendencias previas no difieren (p ≥ 0,05), lo que respalda el supuesto de tendencias paralelas.","Si las tendencias previas hubieran sido diferentes, la diferencia no podría atribuirse a la intervención."],"en":["Estimate the effect of the oral-trial reform on case duration.","Days: reform districts 621 → 484; other districts 543 → 543 (80 units per group). Effect (group × period interaction) = −137 days, 95% CI [−198, −75], p < .001. Pre-trends (3 periods): slope difference p = .314.","The treated group changed by −137 and the comparison group by 0; the attributable effect is the difference between those changes: the reform shortened cases by 137 days. Pre-trends do not differ (p ≥ .05), which supports the parallel-trends assumption.","If pre-trends had differed, the difference could not be attributed to the intervention."]}},"iv":{"sal":{"es":["Estimar el efecto del número de controles prenatales sobre el peso al nacer. Instrumento: la distancia al centro de salud.","Mínimos cuadrados en dos etapas (n = 2000): β = 35 g por control (IC 95 %: 20–51; p < 0,001). Primera etapa: F = 265,0. MCO sin instrumento: β = 93.","El instrumento es fuerte (F mayor que 10). Usando la distancia al centro de salud como fuente de variación, cada control adicional aumenta el peso al nacer en unos 35 g en las gestantes cuyo número de controles depende de la distancia. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of the number of prenatal visits on birth weight. Instrument: distance to the health center.","Two-stage least squares (n = 2000): b = 35 g per visit, 95% CI [20, 51], p < .001. First stage: F = 265.0. OLS without the instrument: b = 93.","The instrument is strong (F above 10). Using distance to the health center as the source of variation, each additional visit raises birth weight by about 35 g among women whose number of visits depends on distance. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"edu":{"es":["Estimar el efecto de los años de escolaridad sobre el salario. Instrumento: una reforma de edad mínima de salida escolar.","Mínimos cuadrados en dos etapas (n = 2000): β = 0,113 en el log del salario por año (IC 95 %: 0,056–0,170; p < 0,001). Primera etapa: F = 319,5. MCO sin instrumento: β = 0,283.","El instrumento es fuerte (F mayor que 10). Usando una reforma de edad mínima de salida escolar como fuente de variación, cada año adicional de escolaridad aumenta el salario en cerca de 11 % para quienes estudiaron más por la reforma. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of years of schooling on wages. Instrument: a minimum school-leaving age reform.","Two-stage least squares (n = 2000): b = 0.113 in log wage per year, 95% CI [0.056, 0.170], p < .001. First stage: F = 319.5. OLS without the instrument: b = 0.283.","The instrument is strong (F above 10). Using a minimum school-leaving age reform as the source of variation, each additional year of schooling raises wages by about 11% for those who stayed in school because of the reform. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"soc":{"es":["Estimar el efecto de participar en programas comunitarios sobre la confianza interpersonal. Instrumento: la cercanía al centro comunitario.","Mínimos cuadrados en dos etapas (n = 2000): β = 0,57 puntos por actividad mensual (IC 95 %: 0,28–0,87; p < 0,001). Primera etapa: F = 291,8. MCO sin instrumento: β = 1,53.","El instrumento es fuerte (F mayor que 10). Usando la cercanía al centro comunitario como fuente de variación, cada actividad mensual adicional aumenta la confianza en 0,57 puntos para quienes participan por vivir cerca. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of community program participation on interpersonal trust. Instrument: proximity to the community center.","Two-stage least squares (n = 2000): b = 0.57 points per monthly activity, 95% CI [0.28, 0.87], p < .001. First stage: F = 291.8. OLS without the instrument: b = 1.53.","The instrument is strong (F above 10). Using proximity to the community center as the source of variation, each additional monthly activity raises trust by 0.57 points for those who participate because they live nearby. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"adm":{"es":["Estimar el efecto de la capacitación sobre la productividad. Instrumento: invitaciones asignadas al azar.","Mínimos cuadrados en dos etapas (n = 2000): β = 0,82 unidades/hora por hora de capacitación (IC 95 %: 0,39–1,26; p < 0,001). Primera etapa: F = 326,8. MCO sin instrumento: β = 2,02.","El instrumento es fuerte (F mayor que 10). Usando invitaciones asignadas al azar como fuente de variación, cada hora de capacitación aumenta la productividad en 0,82 unidades por hora para quienes se capacitaron por la invitación. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of training on productivity. Instrument: randomly assigned invitations.","Two-stage least squares (n = 2000): b = 0.82 units/hour per training hour, 95% CI [0.39, 1.26], p < .001. First stage: F = 326.8. OLS without the instrument: b = 2.02.","The instrument is strong (F above 10). Using randomly assigned invitations as the source of variation, each training hour raises productivity by 0.82 units per hour for those who trained because of the invitation. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"eco":{"es":["Estimar el efecto del ingreso agrícola sobre la demanda de crédito. Instrumento: las lluvias.","Mínimos cuadrados en dos etapas (n = 2000): β = −0,09 (elasticidad) (IC 95 %: −0,12 a −0,07; p < 0,001). Primera etapa: F = 376,2. MCO sin instrumento: β = −0,02.","El instrumento es fuerte (F mayor que 10). Usando las lluvias como fuente de variación, cuando el ingreso agrícola sube por buenas lluvias, la demanda de crédito baja: un aumento de 1 % en el ingreso la reduce en 0,09 %. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of farm income on credit demand. Instrument: rainfall.","Two-stage least squares (n = 2000): b = −0.09 (elasticity), 95% CI [−0.12, −0.07], p < .001. First stage: F = 376.2. OLS without the instrument: b = −0.02.","The instrument is strong (F above 10). Using rainfall as the source of variation, when farm income rises because of good rains, credit demand falls: a 1% rise in income lowers it by 0.09%. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"ing":{"es":["Estimar el efecto del tráfico pesado sobre el deterioro de la vía. Instrumento: el cierre de una vía alterna.","Mínimos cuadrados en dos etapas (n = 2000): β = 0,080 m/km por cada mil camiones diarios (IC 95 %: 0,063–0,097; p < 0,001). Primera etapa: F = 339,9. MCO sin instrumento: β = 0,138.","El instrumento es fuerte (F mayor que 10). Usando el cierre de una vía alterna como fuente de variación, el tráfico pesado desviado por el cierre aumentó el deterioro en 0,080 m/km por cada mil camiones diarios. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of heavy traffic on road deterioration. Instrument: the closure of an alternative road.","Two-stage least squares (n = 2000): b = 0.080 m/km per 1,000 daily trucks, 95% CI [0.063, 0.097], p < .001. First stage: F = 339.9. OLS without the instrument: b = 0.138.","The instrument is strong (F above 10). Using the closure of an alternative road as the source of variation, heavy traffic diverted by the closure increased deterioration by 0.080 m/km per 1,000 daily trucks. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unreliable."]},"der":{"es":["Estimar el efecto de la detención preventiva sobre la reincidencia. Instrumento: la asignación aleatoria de jueces más o menos severos.","Mínimos cuadrados en dos etapas (n = 2000): β = 0,084 (diferencia de probabilidad) (IC 95 %: 0,035–0,134; p < 0,001). Primera etapa: F = 290,2. MCO sin instrumento: β = 0,241.","El instrumento es fuerte (F mayor que 10). Usando la asignación aleatoria de jueces más o menos severos como fuente de variación, para quienes fueron detenidos por haberles tocado un juez más severo, la detención aumenta la probabilidad de reincidir en 8 puntos porcentuales. La estimación por MCO era distinta porque estaba contaminada por factores no observados. El resultado depende de que el instrumento no afecte el resultado por otras vías.","Si el F de la primera etapa hubiera sido bajo (instrumento débil), la estimación sería poco confiable."],"en":["Estimate the effect of pretrial detention on reoffending. Instrument: random assignment to more or less strict judges.","Two-stage least squares (n = 2000): b = 0.084 (probability difference), 95% CI [0.035, 0.134], p < .001. First stage: F = 290.2. OLS without the instrument: b = 0.241.","The instrument is strong (F above 10). Using random assignment to more or less strict judges as the source of variation, for those detained because they drew a stricter judge, detention raises the probability of reoffending by 8 percentage points. The OLS estimate differed because unobserved factors contaminated it. The result depends on the instrument affecting the outcome through no other channel.","If the first-stage F had been low (a weak instrument), the estimate would be unrel
