ca del 63 % de los vehículos habrá tenido una falla grave."],"en":["Characterize the service life of the delivery fleet.","80 observed times, maximum-likelihood Weibull fit: shape β = 2.69; characteristic life η = 186,482 km.","β greater than 1: the risk of a major failure increases with mileage (wear-out). By about 186,482 km, roughly 63% of the vehicles will have had a major failure."]},"eco":{"es":["Describir la duración de los periodos de desempleo.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 0,77; vida característica η = 5,6 meses.","β menor que 1: la probabilidad de salir del desempleo disminuye a medida que se prolonga. Al llegar a 5,6 meses, cerca del 63 % ya salió del desempleo."],"en":["Describe the duration of unemployment spells.","80 observed times, maximum-likelihood Weibull fit: shape β = 0.77; characteristic life η = 5.6 months.","β less than 1: the chance of leaving unemployment declines as the spell gets longer. By about 5.6 months, roughly 63% have left unemployment."]},"ing":{"es":["Caracterizar la vida de los rodamientos de la línea de producción.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 2,34; vida característica η = 6.307 horas.","β mayor que 1: las fallas son por desgaste: el riesgo aumenta con el uso; sirve para planear el mantenimiento preventivo. Al llegar a 6.307 horas, cerca del 63 % de los rodamientos habrá fallado."],"en":["Characterize the life of production-line bearings.","80 observed times, maximum-likelihood Weibull fit: shape β = 2.34; characteristic life η = 6,307 hours.","β greater than 1: failures are wear-out failures: risk increases with use, which helps plan preventive maintenance. By about 6,307 hours, roughly 63% of the bearings will have failed."]},"der":{"es":["Describir el tiempo hasta la decisión de los recursos de apelación.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 1,53; vida característica η = 14,5 meses.","β mayor que 1: la probabilidad de que se decida el recurso aumenta con el tiempo transcurrido. Al llegar a 14,5 meses, cerca del 63 % ya tiene decisión."],"en":["Describe time to decision for appeals.","80 observed times, maximum-likelihood Weibull fit: shape β = 1.53; characteristic life η = 14.5 months.","β greater than 1: the chance of an appeal being decided increases with elapsed time. By about 14.5 months, roughly 63% have been decided."]}},"logrank":{"sal":{"es":["Comparar la supervivencia entre pacientes con y sin quimioterapia adyuvante.","Supervivencia a 36 meses (Kaplan-Meier): 74,1 % con quimioterapia y 59,8 % sin quimioterapia; log-rank χ²(1) = 8,26; p = 0,004.","Como p < 0,05, las curvas son diferentes: los pacientes con quimioterapia sobreviven más.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare survival between patients with and without adjuvant chemotherapy.","Survival at 36 months (Kaplan-Meier): 74.1% with chemotherapy and 59.8% without chemotherapy; log-rank χ²(1) = 8.26, p = .004.","Because p < .05, the curves differ: patients receiving chemotherapy survive longer.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"edu":{"es":["Comparar la permanencia estudiantil entre quienes reciben tutoría y quienes no.","Permanencia a 4 semestres (Kaplan-Meier): 69,7 % con tutoría y 51,5 % sin tutoría; log-rank χ²(1) = 6,76; p = 0,009.","Como p < 0,05, las curvas son diferentes: los estudiantes con tutoría desertan más tarde.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare student retention between those who receive tutoring and those who do not.","Retention at 4 semesters (Kaplan-Meier): 69.7% with tutoring and 51.5% without tutoring; log-rank χ²(1) = 6.76, p = .009.","Because p < .05, the curves differ: tutored students drop out later.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"soc":{"es":["Comparar el tiempo hasta la recaída entre personas con y sin acompañamiento familiar.","Proporción sin recaída a 12 meses (Kaplan-Meier): 53,7 % con acompañamiento y 34,4 % sin acompañamiento; log-rank χ²(1) = 8,49; p = 0,004.","Como p < 0,05, las curvas son diferentes: con acompañamiento familiar la recaída llega más tarde.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare time to relapse between people with and without family support.","Proportion relapse-free at 12 months (Kaplan-Meier): 53.7% with family support and 34.4% without family support; log-rank χ²(1) = 8.49, p = .004.","Because p < .05, the curves differ: with family support, relapse comes later.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"adm":{"es":["Comparar la permanencia de empleados con y sin programa de inducción.","Permanencia a 24 meses (Kaplan-Meier): 71,5 % con inducción y 58,3 % sin inducción; log-rank χ²(1) = 5,67; p = 0,017.","Como p < 0,05, las curvas son diferentes: quienes reciben inducción se quedan más tiempo.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare retention of employees with and without an onboarding program.","Retention at 24 months (Kaplan-Meier): 71.5% with onboarding and 58.3% without onboarding; log-rank χ²(1) = 5.67, p = .017.","Because p < .05, the curves differ: those who receive onboarding stay longer.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"eco":{"es":["Comparar la supervivencia de empresas con y sin acceso a crédito.","Supervivencia a 5 años (Kaplan-Meier): 55,1 % con crédito y 39,2 % sin crédito; log-rank χ²(1) = 10,23; p = 0,001.","Como p < 0,05, las curvas son diferentes: las empresas con crédito cierran más tarde.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare survival of firms with and without access to credit.","Survival at 5 years (Kaplan-Meier): 55.1% with credit and 39.2% without credit; log-rank χ²(1) = 10.23, p = .001.","Because p < .05, the curves differ: firms with credit close later.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"ing":{"es":["Comparar el tiempo hasta la falla entre bombas con lubricación automática y manual.","Proporción sin falla a 5.000 horas (Kaplan-Meier): 60,0 % lubricación automática y 42,6 % lubricación manual; log-rank χ²(1) = 6,88; p = 0,009.","Como p < 0,05, las curvas son diferentes: con lubricación automática las bombas fallan más tarde.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare time to failure between pumps with automatic and manual lubrication.","Proportion failure-free at 5,000 hours (Kaplan-Meier): 60.0% automatic lubrication and 42.6% manual lubrication; log-rank χ²(1) = 6.88, p = .009.","Because p < .05, the curves differ: pumps with automatic lubrication fail later.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]},"der":{"es":["Comparar el tiempo hasta la reincidencia entre quienes participan en un programa de reinserción y quienes no.","Proporción sin reincidencia a 24 meses (Kaplan-Meier): 71,4 % con programa y 51,6 % sin programa; log-rank χ²(1) = 10,39; p = 0,001.","Como p < 0,05, las curvas son diferentes: quienes participan reinciden más tarde.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencia entre las curvas."],"en":["Compare time to reoffending between participants and non-participants in a reentry program.","Proportion not reoffending at 24 months (Kaplan-Meier): 71.4% with the program and 51.6% without the program; log-rank χ²(1) = 10.39, p = .001.","Because p < .05, the curves differ: participants reoffend later.","If p had been ≥ .05, there would be no evidence of a difference between the curves."]}},"chi":{"sal":{"es":["Establecer la asociación entre el consumo de tabaco y la EPOC.","EPOC: 46 de 150 fumadores (30,7 %) y 27 de 150 no fumadores (18,0 %); χ²(1) = 6,54; p = 0,011; phi = 0,15. Frecuencia esperada mínima: 36,5.","Como p < 0,05, el tabaquismo y la EPOC están asociados: la EPOC es más frecuente en fumadores. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between smoking and COPD.","COPD: 46 of 150 smokers (30.7%) and 27 of 150 non-smokers (18.0%); χ²(1) = 6.54, p = .011, φ = .15. Smallest expected frequency: 36.5.","Because p < .05, smoking and COPD are associated: COPD is more frequent among smokers. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"edu":{"es":["Establecer la asociación entre trabajar y repetir el año escolar.","Repitencia: 48 de 150 estudiantes que trabajan (32,0 %) y 25 de 150 estudiantes que no trabajan (16,7 %); χ²(1) = 9,58; p = 0,002; phi = 0,18. Frecuencia esperada mínima: 36,5.","Como p < 0,05, trabajar y repetir están asociados: la repitencia es más frecuente en quienes trabajan. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between working and repeating a school year.","Grade repetition: 48 of 150 students who work (32.0%) and 25 of 150 students who do not work (16.7%); χ²(1) = 9.58, p = .002, φ = .18. Smallest expected frequency: 36.5.","Because p < .05, working and repeating are associated: repetition is more frequent among students who work. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"soc":{"es":["Establecer la asociación entre el desempleo y los síntomas depresivos.","Síntomas depresivos: 48 de 150 desempleados (32,0 %) y 27 de 150 empleados (18,0 %); χ²(1) = 7,84; p = 0,005; phi = 0,16. Frecuencia esperada mínima: 37,5.","Como p < 0,05, el desempleo y los síntomas depresivos están asociados: son más frecuentes en desempleados. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between unemployment and depressive symptoms.","Depressive symptoms: 48 of 150 unemployed (32.0%) and 27 of 150 employed (18.0%); χ²(1) = 7.84, p = .005, φ = .16. Smallest expected frequency: 37.5.","Because p < .05, unemployment and depressive symptoms are associated: symptoms are more frequent among the unemployed. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"adm":{"es":["Establecer la asociación entre tener plan de carrera y la renuncia.","Renuncia: 48 de 150 sin plan de carrera (32,0 %) y 27 de 150 con plan de carrera (18,0 %); χ²(1) = 7,84; p = 0,005; phi = 0,16. Frecuencia esperada mínima: 37,5.","Como p < 0,05, el plan de carrera y la renuncia están asociados: renuncian más quienes no tienen plan. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between having a career plan and resignation.","Resignation: 48 of 150 without a career plan (32.0%) and 27 of 150 with a career plan (18.0%); χ²(1) = 7.84, p = .005, φ = .16. Smallest expected frequency: 37.5.","Because p < .05, career plans and resignation are associated: employees without a plan resign more often. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"eco":{"es":["Establecer la asociación entre la capacitación financiera y la mora en microcréditos.","Mora: 49 de 150 microempresas sin capacitación (32,7 %) y 28 de 150 microempresas con capacitación (18,7 %); χ²(1) = 7,70; p = 0,006; phi = 0,16. Frecuencia esperada mínima: 38,5.","Como p < 0,05, la capacitación y la mora están asociadas: la mora es más frecuente sin capacitación. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between financial training and microloan arrears.","Arrears: 49 of 150 firms without training (32.7%) and 28 of 150 firms with training (18.7%); χ²(1) = 7.70, p = .006, φ = .16. Smallest expected frequency: 38.5.","Because p < .05, training and arrears are associated: arrears are more frequent without training. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"ing":{"es":["Establecer la asociación entre el turno de producción y los lotes defectuosos.","Lotes con defectos: 55 de 150 turno nocturno (36,7 %) y 38 de 150 turno diurno (25,3 %); χ²(1) = 4,50; p = 0,034; phi = 0,12. Frecuencia esperada mínima: 46,5.","Como p < 0,05, el turno y los defectos están asociados: hay más lotes defectuosos en la noche. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between production shift and defective batches.","Defective batches: 55 of 150 night shift (36.7%) and 38 of 150 day shift (25.3%); χ²(1) = 4.50, p = .034, φ = .12. Smallest expected frequency: 46.5.","Because p < .05, shift and defects are associated: there are more defective batches at night. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]},"der":{"es":["Establecer la asociación entre el tipo de defensa y la detención preventiva.","Detención preventiva: 46 de 150 defensa pública (30,7 %) y 23 de 150 defensa privada (15,3 %); χ²(1) = 9,96; p = 0,002; phi = 0,18. Frecuencia esperada mínima: 34,5.","Como p < 0,05, el tipo de defensa y la detención preventiva están asociados: es más frecuente con defensa pública. La asociación es pequeña según Cohen (1988); para saber cuánto más frecuente es, se calcula OR o RR.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Establish the association between type of defense and pretrial detention.","Pretrial detention: 46 of 150 public defender (30.7%) and 23 of 150 private attorney (15.3%); χ²(1) = 9.96, p = .002, φ = .18. Smallest expected frequency: 34.5.","Because p < .05, type of defense and pretrial detention are associated: detention is more frequent with a public defender. The association is small by Cohen's (1988) benchmarks; OR or RR shows how much more frequent it is.","If p had been ≥ .05, there would be no evidence of an association."]}},"fisher":{"sal":{"es":["Determinar la asociación entre el tipo de anestesia y las complicaciones posoperatorias.","Complicaciones: 6 de 14 (anestesia general) y 0 de 16 (anestesia regional); prueba exacta de Fisher (bilateral) p = 0,005.","Como p < 0,05, las variables están asociadas: hubo más complicaciones con anestesia general. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between type of anesthesia and postoperative complications.","Complications: 6 of 14 (general anesthesia) and 0 of 16 (regional anesthesia); Fisher's exact test (two-sided), p = .005.","Because p < .05, the variables are associated: there were more complications with general anesthesia. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"edu":{"es":["Determinar la asociación entre tener tutor y abandonar el curso virtual.","Abandono: 5 de 14 (sin tutor) y 0 de 16 (con tutor); prueba exacta de Fisher (bilateral) p = 0,014.","Como p < 0,05, las variables están asociadas: abandonaron más quienes no tenían tutor. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between having a tutor and dropping out of an online course.","Dropout: 5 of 14 (without a tutor) and 0 of 16 (with a tutor); Fisher's exact test (two-sided), p = .014.","Because p < .05, the variables are associated: students without a tutor dropped out more. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"soc":{"es":["Determinar la asociación entre la red de apoyo y la recaída.","Recaída: 6 de 14 (sin red de apoyo) y 0 de 16 (con red de apoyo); prueba exacta de Fisher (bilateral) p = 0,005.","Como p < 0,05, las variables están asociadas: recayeron más quienes no tenían red de apoyo. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between support network and relapse.","Relapse: 6 of 14 (without a support network) and 0 of 16 (with a support network); Fisher's exact test (two-sided), p = .005.","Because p < .05, the variables are associated: people without a support network relapsed more. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"adm":{"es":["Determinar la asociación entre la capacitación en seguridad y los accidentes laborales.","Accidentes: 6 de 14 (operarios sin capacitación) y 1 de 16 (operarios capacitados); prueba exacta de Fisher (bilateral) p = 0,031.","Como p < 0,05, las variables están asociadas: hubo más accidentes en los operarios sin capacitación. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between safety training and workplace accidents.","Accidents: 6 of 14 (untrained operators) and 1 of 16 (trained operators); Fisher's exact test (two-sided), p = .031.","Because p < .05, the variables are associated: untrained operators had more accidents. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"eco":{"es":["Determinar la asociación entre la concentración de clientes y la quiebra de pequeñas empresas.","Quiebra en 5 años: 7 de 14 (empresas con un solo cliente grande) y 2 de 16 (empresas diversificadas); prueba exacta de Fisher (bilateral) p = 0,046.","Como p < 0,05, las variables están asociadas: quebraron más las empresas dependientes de un solo cliente. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between customer concentration and small-business failure.","Failure within 5 years: 7 of 14 (firms with a single large customer) and 2 of 16 (diversified firms); Fisher's exact test (two-sided), p = .046.","Because p < .05, the variables are associated: firms dependent on a single customer failed more often. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"ing":{"es":["Determinar la asociación entre el procedimiento de soldadura y las fallas.","Fallas: 9 de 14 (procedimiento A) y 2 de 16 (procedimiento B); prueba exacta de Fisher (bilateral) p = 0,007.","Como p < 0,05, las variables están asociadas: fallaron más las uniones hechas con el procedimiento A. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between welding procedure and failures.","Failures: 9 of 14 (procedure A) and 2 of 16 (procedure B); Fisher's exact test (two-sided), p = .007.","Because p < .05, the variables are associated: joints made with procedure A failed more often. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]},"der":{"es":["Determinar la asociación entre la forma de notificación y la nulidad del proceso.","Nulidad: 7 de 14 (notificación por aviso) y 2 de 16 (notificación personal); prueba exacta de Fisher (bilateral) p = 0,046.","Como p < 0,05, las variables están asociadas: hubo más nulidades con notificación por aviso. Con tan pocos casos, el chi-cuadrado no era adecuado.","Si p hubiera sido ≥ 0,05, no habría evidencia de asociación."],"en":["Determine the association between method of service and annulment of proceedings.","Annulment: 7 of 14 (service by notice) and 2 of 16 (personal service); Fisher's exact test (two-sided), p = .046.","Because p < .05, the variables are associated: there were more annulments with service by notice. With so few cases, chi-square was not appropriate.","If p had been ≥ .05, there would be no evidence of an association."]}},"or":{"sal":{"es":["Evaluar la asociación entre obesidad y diabetes gestacional.","Diabetes gestacional: 38 de 180 con obesidad y 17 de 220 sin obesidad; OR = 3,20 (IC 95 %: 1,73–5,89).","Las gestantes con obesidad tienen 3,20 veces la chance (odds) de diabetes gestacional que las que no tienen obesidad; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between obesity and gestational diabetes.","Gestational diabetes: 38 of 180 (with obesity) and 17 of 220 (without obesity); OR = 3.20, 95% CI [1.73, 5.89].","Pregnant women with obesity have 3.20 times the odds of gestational diabetes of those without obesity; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"edu":{"es":["Evaluar la asociación entre trabajar más de 20 horas semanales y la deserción.","Deserción: 55 de 180 que trabajan más de 20 h y 30 de 220 que no trabajan; OR = 2,79 (IC 95 %: 1,69–4,59).","Los estudiantes que trabajan más de 20 horas tienen 2,79 veces la chance de desertar que los que no trabajan; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between working over 20 hours a week and dropout.","Dropout: 55 of 180 (working over 20 h) and 30 of 220 (not working); OR = 2.79, 95% CI [1.69, 4.59].","Students working over 20 hours have 2.79 times the odds of dropping out of those not working; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"soc":{"es":["Evaluar la asociación entre el consumo de alcohol de la pareja y la violencia de pareja.","Violencia de pareja: 59 de 180 con pareja que bebe en exceso y 29 de 220 sin pareja que bebe en exceso; OR = 3,21 (IC 95 %: 1,95–5,29).","Las mujeres cuya pareja bebe en exceso tienen 3,21 veces la chance de reportar violencia que aquellas cuya pareja no bebe en exceso; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between partner's alcohol use and intimate partner violence.","Partner violence: 59 of 180 (partner drinks heavily) and 29 of 220 (partner does not drink heavily); OR = 3.21, 95% CI [1.95, 5.29].","Women whose partner drinks heavily have 3.21 times the odds of reporting violence of women whose partner does not; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"adm":{"es":["Evaluar la asociación entre hacer horas extra frecuentes y renunciar.","Renuncia: 35 de 180 con horas extra frecuentes y 19 de 220 sin horas extra frecuentes; OR = 2,55 (IC 95 %: 1,40–4,64).","Los empleados con horas extra frecuentes tienen 2,55 veces la chance de renunciar que quienes no las hacen; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between frequent overtime and resigning.","Resignation: 35 of 180 (frequent overtime) and 19 of 220 (no frequent overtime); OR = 2.55, 95% CI [1.40, 4.64].","Employees with frequent overtime have 2.55 times the odds of resigning of those without; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"eco":{"es":["Evaluar la asociación entre la informalidad del jefe de hogar y la pobreza.","Pobreza: 85 de 180 con jefe informal y 46 de 220 con jefe formal; OR = 3,38 (IC 95 %: 2,19–5,24).","Los hogares con jefe informal tienen 3,38 veces la chance de estar en pobreza que los hogares con jefe formal; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between informal employment of the household head and poverty.","Poverty: 85 of 180 (informal head) and 46 of 220 (formal head); OR = 3.38, 95% CI [2.19, 5.24].","Households with an informally employed head have 3.38 times the odds of being poor of households with a formally employed head; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"ing":{"es":["Evaluar la asociación entre operar por encima de la carga nominal y la falla del motor.","Falla: 44 de 180 con sobrecarga y 28 de 220 sin sobrecarga; OR = 2,22 (IC 95 %: 1,32–3,74).","Los motores operados con sobrecarga tienen 2,22 veces la chance de fallar que los que operan sin sobrecarga; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between overload operation and motor failure.","Failure: 44 of 180 (overloaded) and 28 of 220 (not overloaded); OR = 2.22, 95% CI [1.32, 3.74].","Overloaded motors have 2.22 times the odds of failing of motors without overload; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]},"der":{"es":["Evaluar la asociación entre el consumo de drogas y la reincidencia.","Reincidencia: 81 de 180 con consumo de drogas y 45 de 220 sin consumo de drogas; OR = 3,18 (IC 95 %: 2,05–4,94).","Las personas con consumo de drogas tienen 3,18 veces la chance de reincidir que quienes no consumen; el IC no incluye el 1, así que la asociación es significativa. Es un OR crudo: todavía no está ajustado por otras variables.","Si el IC hubiera incluido el 1, no habría asociación significativa."],"en":["Evaluate the association between drug use and reoffending.","Reoffending: 81 of 180 (drug use) and 45 of 220 (no drug use); OR = 3.18, 95% CI [2.05, 4.94].","People who use drugs have 3.18 times the odds of reoffending of people who do not; the CI excludes 1, so the association is significant. This is a crude OR, not yet adjusted for other variables.","If the CI had included 1, the association would not be significant."]}},"tendencia":{"sal":{"es":["Evaluar la tendencia de la prevalencia de hipertensión según el grupo de edad.","Hipertensión (100 por grupo): 40–49, 8 %; 50–59, 14 %; 60–69, 31 %; Cochran-Armitage z = 4,26, χ² de tendencia (1) = 18,18; p < 0,001.","Como p < 0,05, la prevalencia de hipertensión aumenta de forma ordenada con la edad.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in hypertension prevalence across age groups.","Hypertension (100 per group): 40–49, 8%; 50–59, 14%; 60–69, 31%; Cochran-Armitage z = 4.26, χ² for trend (1) = 18.18, p < .001.","Because p < .05, hypertension prevalence rises steadily with age.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"edu":{"es":["Evaluar la tendencia de la deserción según el estrato socioeconómico.","Deserción (100 por grupo): estrato 1, 22 %; estrato 2, 18 %; estrato 3, 7 %; Cochran-Armitage z = −2,92, χ² de tendencia (1) = 8,51; p = 0,004.","Como p < 0,05, la deserción disminuye de forma ordenada a medida que sube el estrato.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in dropout across socioeconomic strata.","Dropout (100 per group): stratum 1, 22%; stratum 2, 18%; stratum 3, 7%; Cochran-Armitage z = −2.92, χ² for trend (1) = 8.51, p = .004.","Because p < .05, dropout falls steadily as stratum rises.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"soc":{"es":["Evaluar la tendencia del uso de servicios de salud mental según el nivel educativo.","Uso (100 por grupo): primaria, 8 %; secundaria, 15 %; universitaria, 31 %; Cochran-Armitage z = 4,23, χ² de tendencia (1) = 17,92; p < 0,001.","Como p < 0,05, el uso aumenta de forma ordenada con el nivel educativo.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in mental health service use by education level.","Use (100 per group): primary, 8%; secondary, 15%; university, 31%; Cochran-Armitage z = 4.23, χ² for trend (1) = 17.92, p < .001.","Because p < .05, use rises steadily with education level.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"adm":{"es":["Evaluar la tendencia de la rotación según la antigüedad.","Rotación (100 por grupo): 0–1 años, 30 %; 2–4 años, 14 %; 5 o más, 6 %; Cochran-Armitage z = −4,55, χ² de tendencia (1) = 20,74; p < 0,001.","Como p < 0,05, la rotación disminuye de forma ordenada con la antigüedad.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in turnover by tenure.","Turnover (100 per group): 0–1 years, 30%; 2–4 years, 14%; 5+ years, 6%; Cochran-Armitage z = −4.55, χ² for trend (1) = 20.74, p < .001.","Because p < .05, turnover falls steadily with tenure.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"eco":{"es":["Evaluar la tendencia del ahorro formal según el quintil de ingreso.","Ahorro formal (100 por grupo): quintil 1, 12 %; quintil 3, 17 %; quintil 5, 36 %; Cochran-Armitage z = 4,12, χ² de tendencia (1) = 16,97; p < 0,001.","Como p < 0,05, el ahorro formal aumenta de forma ordenada con el ingreso.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in formal saving by income quintile.","Formal saving (100 per group): quintile 1, 12%; quintile 3, 17%; quintile 5, 36%; Cochran-Armitage z = 4.12, χ² for trend (1) = 16.97, p < .001.","Because p < .05, formal saving rises steadily with income.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"ing":{"es":["Evaluar la tendencia de los defectos según la velocidad de la línea.","Defectos (100 por grupo): velocidad baja, 8 %; velocidad media, 15 %; velocidad alta, 35 %; Cochran-Armitage z = 4,83, χ² de tendencia (1) = 23,37; p < 0,001.","Como p < 0,05, los defectos aumentan de forma ordenada con la velocidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in defects by line speed.","Defects (100 per group): low speed, 8%; medium speed, 15%; high speed, 35%; Cochran-Armitage z = 4.83, χ² for trend (1) = 23.37, p < .001.","Because p < .05, defects rise steadily with speed.","If p had been ≥ .05, there would be no evidence of an ordered trend."]},"der":{"es":["Evaluar la tendencia de la detención preventiva según el número de antecedentes.","Detención (100 por grupo): sin antecedentes, 11 %; un antecedente, 15 %; dos o más, 36 %; Cochran-Armitage z = 4,37, χ² de tendencia (1) = 19,06; p < 0,001.","Como p < 0,05, la detención preventiva aumenta de forma ordenada con los antecedentes.","Si p hubiera sido ≥ 0,05, no habría evidencia de una tendencia ordenada."],"en":["Evaluate the trend in pretrial detention by number of prior records.","Detention (100 per group): no priors, 11%; one prior, 15%; two or more priors, 36%; Cochran-Armitage z = 4.37, χ² for trend (1) = 19.06, p < .001.","Because p < .05, pretrial detention rises steadily with prior records.","If p had been ≥ .05, there would be no evidence of an ordered trend."]}},"mcnemar":{"sal":{"es":["Comparar el nivel de conocimientos antes y después de la intervención educativa.","Conocimiento adecuado en 80 personas: 35,0 % antes y 51,2 % después; cambiaron de «sí» a «no» 2 y de «no» a «sí» 15; McNemar χ²(1) = 9,94; p = 0,002.","Como p < 0,05, la proporción con conocimiento adecuado aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare knowledge before and after the educational intervention.","Adequate knowledge among 80 people: 35.0% before and 51.2% after; 2 changed from yes to no and 15 from no to yes; McNemar χ²(1) = 9.94, p = .002.","Because p < .05, the proportion with adequate knowledge increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"edu":{"es":["Comparar el nivel satisfactorio en lectura al inicio y al final del programa.","Nivel satisfactorio en 80 estudiantes: 27,5 % antes y 47,5 % después; cambiaron de «sí» a «no» 3 y de «no» a «sí» 19; McNemar χ²(1) = 11,64; p < 0,001.","Como p < 0,05, la proporción con nivel satisfactorio aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare satisfactory reading level at the start and end of the program.","Satisfactory level among 80 students: 27.5% before and 47.5% after; 3 changed from yes to no and 19 from no to yes; McNemar χ²(1) = 11.64, p < .001.","Because p < .05, the proportion at a satisfactory level increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"soc":{"es":["Comparar el consumo de tabaco antes y después de la campaña.","Fuman en 80 personas: 52,5 % antes y 35,0 % después; cambiaron de «sí» a «no» 16 y de «no» a «sí» 2; McNemar χ²(1) = 10,89; p < 0,001.","Como p < 0,05, la proporción de fumadores disminuyó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare tobacco use before and after the campaign.","Smoking among 80 people: 52.5% before and 35.0% after; 16 changed from yes to no and 2 from no to yes; McNemar χ²(1) = 10.89, p < .001.","Because p < .05, the proportion of smokers decreased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"adm":{"es":["Comparar el cumplimiento de la meta de ventas antes y después del entrenamiento.","Cumplen la meta en 80 asesores: 46,2 % antes y 58,8 % después; cambiaron de «sí» a «no» 1 y de «no» a «sí» 11; McNemar χ²(1) = 8,33; p = 0,004.","Como p < 0,05, la proporción que cumple la meta aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare meeting the sales target before and after training.","Meeting the target among 80 sales agents: 46.2% before and 58.8% after; 1 changed from yes to no and 11 from no to yes; McNemar χ²(1) = 8.33, p = .004.","Because p < .05, the proportion meeting the target increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"eco":{"es":["Comparar el registro de gastos del hogar antes y después del programa de educación financiera.","Llevan registro de gastos en 80 hogares: 46,2 % antes y 60,0 % después; cambiaron de «sí» a «no» 6 y de «no» a «sí» 17; McNemar χ²(1) = 5,26; p = 0,022.","Como p < 0,05, la proporción de hogares que registra sus gastos aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare household expense tracking before and after the financial education program.","Tracking expenses among 80 households: 46.2% before and 60.0% after; 6 changed from yes to no and 17 from no to yes; McNemar χ²(1) = 5.26, p = .022.","Because p < .05, the proportion of households tracking expenses increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"ing":{"es":["Comparar la aplicación correcta del protocolo de bloqueo antes y después de la capacitación.","Aplican bien el protocolo en 80 operarios: 33,8 % antes y 52,5 % después; cambiaron de «sí» a «no» 2 y de «no» a «sí» 17; McNemar χ²(1) = 11,84; p < 0,001.","Como p < 0,05, la proporción que aplica bien el protocolo aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare correct application of the lockout protocol before and after training.","Applying the protocol correctly among 80 operators: 33.8% before and 52.5% after; 2 changed from yes to no and 17 from no to yes; McNemar χ²(1) = 11.84, p < .001.","Because p < .05, the proportion applying the protocol correctly increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]},"der":{"es":["Comparar la aplicación correcta del protocolo de notificación electrónica antes y después de la capacitación.","Aplican bien el protocolo en 80 funcionarios: 36,2 % antes y 47,5 % después; cambiaron de «sí» a «no» 1 y de «no» a «sí» 10; McNemar χ²(1) = 7,36; p = 0,007.","Como p < 0,05, la proporción que aplica bien el protocolo aumentó. La prueba solo usa a quienes cambiaron de respuesta.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare correct use of the e-service protocol before and after training.","Applying the protocol correctly among 80 staff members: 36.2% before and 47.5% after; 1 changed from yes to no and 10 from no to yes; McNemar χ²(1) = 7.36, p = .007.","Because p < .05, the proportion applying the protocol correctly increased. The test only uses those whose answer changed.","If p had been ≥ .05, there would be no evidence of change."]}},"kappa":{"sal":{"es":["Evaluar la concordancia entre el diagnóstico ecográfico y el diagnóstico clínico.","Ecografía frente a diagnóstico clínico en 120 pacientes: acuerdo observado 88,3 %; κ = 0,77 (IC 95 %: 0,65–0,88).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between ultrasound and clinical diagnosis.","Ultrasound vs. clinical diagnosis in 120 patients: observed agreement 88.3%; κ = .77, 95% CI [.65, .88].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"edu":{"es":["Evaluar la concordancia entre dos docentes al calificar ensayos como aprobados o reprobados.","Dos docentes calificando 120 ensayos: acuerdo observado 85,8 %; κ = 0,72 (IC 95 %: 0,59–0,84).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two teachers grading essays as pass or fail.","Two teachers grading 120 essays: observed agreement 85.8%; κ = .72, 95% CI [.59, .84].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"soc":{"es":["Evaluar la concordancia entre dos codificadores al clasificar entrevistas por tema principal.","Dos codificadores clasificando 120 entrevistas en 4 temas: acuerdo observado 71,7 %; κ = 0,62 (IC 95 %: 0,52–0,73).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two coders classifying interviews by main theme.","Two coders classifying 120 interviews into 4 themes: observed agreement 71.7%; κ = .62, 95% CI [.52, .73].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"adm":{"es":["Evaluar la concordancia entre dos auditores al clasificar facturas como conformes o no conformes.","Dos auditores revisando 120 facturas: acuerdo observado 85,0 %; κ = 0,70 (IC 95 %: 0,57–0,83).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two auditors classifying invoices as compliant or not.","Two auditors reviewing 120 invoices: observed agreement 85.0%; κ = .70, 95% CI [.57, .83].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"eco":{"es":["Evaluar la concordancia entre dos analistas al clasificar empresas según su riesgo crediticio.","Dos analistas clasificando 120 empresas en riesgo bajo, medio o alto: acuerdo observado 79,2 %; κ = 0,69 (IC 95 %: 0,58–0,80).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two analysts rating firms' credit risk.","Two analysts rating 120 firms as low, medium, or high risk: observed agreement 79.2%; κ = .69, 95% CI [.58, .80].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"ing":{"es":["Evaluar la concordancia entre dos inspectores al aceptar o rechazar piezas.","Dos inspectores clasificando 120 piezas: acuerdo observado 86,7 %; κ = 0,73 (IC 95 %: 0,61–0,85).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two inspectors accepting or rejecting parts.","Two inspectors classifying 120 parts: observed agreement 86.7%; κ = .73, 95% CI [.61, .85].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]},"der":{"es":["Evaluar la concordancia entre dos codificadores al clasificar sentencias según el derecho protegido.","Dos codificadores clasificando 120 sentencias en 3 categorías: acuerdo observado 86,7 %; κ = 0,80 (IC 95 %: 0,70–0,89).","El acuerdo es considerable según Landis y Koch (1977): coinciden mucho más de lo que se esperaría por azar. El κ es menor que el acuerdo observado porque descuenta las coincidencias por azar.","Si κ hubiera sido cercano a 0,20, el acuerdo sería apenas leve y habría que revisar los criterios de clasificación."],"en":["Evaluate agreement between two coders classifying rulings by protected right.","Two coders classifying 120 rulings into 3 categories: observed agreement 86.7%; κ = .80, 95% CI [.70, .89].","Agreement is substantial by Landis and Koch's (1977) benchmarks: the raters agree far more than chance would predict. κ is lower than observed agreement because it discounts chance agreement.","If κ had been near .20, agreement would be only slight, and the classification criteria would need revision."]}},"fleiss":{"sal":{"es":["Evaluar la concordancia entre cinco radiólogos al clasificar radiografías.","Cinco radiólogos, 80 radiografías (normal, dudosa, patológica): κ de Fleiss = 0,47.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five radiologists classifying X-rays.","Five radiologists, 80 X-rays (normal, uncertain, abnormal): Fleiss' κ = .47.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"edu":{"es":["Evaluar la concordancia entre cinco jurados al calificar proyectos de grado.","Cinco jurados, 80 proyectos (aprobado, con ajustes, reprobado): κ de Fleiss = 0,47.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five examiners grading capstone projects.","Five examiners, 80 projects (pass, revise, fail): Fleiss' κ = .47.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"soc":{"es":["Evaluar la concordancia entre cinco codificadores al clasificar el tono de publicaciones en redes sociales.","Cinco codificadores, 80 publicaciones (positivo, neutro, negativo): κ de Fleiss = 0,51.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five coders classifying the tone of social media posts.","Five coders, 80 posts (positive, neutral, negative): Fleiss' κ = .51.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"adm":{"es":["Evaluar la concordancia entre cinco evaluadores al clasificar hojas de vida.","Cinco evaluadores, 80 hojas de vida (apto, revisar, no apto): κ de Fleiss = 0,47.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five reviewers classifying résumés.","Five reviewers, 80 résumés (suitable, review, unsuitable): Fleiss' κ = .47.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"eco":{"es":["Evaluar la concordancia entre cinco analistas al clasificar proyectos de inversión según su riesgo.","Cinco analistas, 80 proyectos (riesgo bajo, medio, alto): κ de Fleiss = 0,43.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five analysts rating investment projects by risk.","Five analysts, 80 projects (low, medium, high risk): Fleiss' κ = .43.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"ing":{"es":["Evaluar la concordancia entre cinco inspectores al clasificar soldaduras.","Cinco inspectores, 80 soldaduras (aceptable, reparar, rechazar): κ de Fleiss = 0,44.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five inspectors classifying welds.","Five inspectors, 80 welds (accept, repair, reject): Fleiss' κ = .44.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]},"der":{"es":["Evaluar la concordancia entre cinco jueces al resolver casos hipotéticos.","Cinco jueces, 80 casos hipotéticos (conceder, negar, improcedente): κ de Fleiss = 0,50.","El acuerdo entre los cinco evaluadores es moderado según Landis y Koch (1977): hay bastante coincidencia, pero también criterios que no todos aplican igual.","Si κ hubiera sido mayor que 0,80, el acuerdo sería casi perfecto."],"en":["Evaluate agreement among five judges deciding hypothetical cases.","Five judges, 80 hypothetical cases (grant, deny, dismiss): Fleiss' κ = .50.","Agreement among the five raters is moderate by Landis and Koch's (1977) benchmarks: there is considerable agreement, but some criteria are not applied consistently.","If κ had been above .80, agreement would be almost perfect."]}},"cci":{"sal":{"es":["Determinar la confiabilidad test-retest de la escala de dolor.","Escala de dolor aplicada dos veces con una semana de diferencia (50 pacientes): CCI (dos vías, acuerdo absoluto, medición única) = 0,88 (IC 95 %: 0,79–0,93).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de buena a excelente, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine the test-retest reliability of the pain scale.","Pain scale given twice, one week apart (50 patients): ICC (two-way, absolute agreement, single measure) = .88, 95% CI [.79, .93].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans good to excellent, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"edu":{"es":["Determinar la confiabilidad entre dos docentes que usan la misma rúbrica.","Dos docentes puntuando 50 ensayos con la misma rúbrica: CCI (dos vías, acuerdo absoluto, medición única) = 0,79 (IC 95 %: 0,66–0,88).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de moderada a buena, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine inter-rater reliability of two teachers using the same rubric.","Two teachers scoring 50 essays with the same rubric: ICC (two-way, absolute agreement, single measure) = .79, 95% CI [.66, .88].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans moderate to good, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"soc":{"es":["Determinar la confiabilidad test-retest de la escala de bienestar.","Escala aplicada dos veces con dos semanas de diferencia (50 participantes): CCI (dos vías, acuerdo absoluto, medición única) = 0,88 (IC 95 %: 0,79–0,93).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de buena a excelente, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine the test-retest reliability of the well-being scale.","Scale given twice, two weeks apart (50 participants): ICC (two-way, absolute agreement, single measure) = .88, 95% CI [.79, .93].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans good to excellent, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"adm":{"es":["Determinar la confiabilidad entre dos evaluadores del desempeño.","Dos evaluadores puntuando a 50 empleados: CCI (dos vías, acuerdo absoluto, medición única) = 0,87 (IC 95 %: 0,78–0,92).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de buena a excelente, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine inter-rater reliability of two performance appraisers.","Two appraisers rating 50 employees: ICC (two-way, absolute agreement, single measure) = .87, 95% CI [.78, .92].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans good to excellent, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"eco":{"es":["Determinar la confiabilidad entre dos peritos que tasan inmuebles.","Dos peritos tasando 50 inmuebles: CCI (dos vías, acuerdo absoluto, medición única) = 0,89 (IC 95 %: 0,82–0,94).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de buena a excelente, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine inter-rater reliability of two property appraisers.","Two appraisers valuing 50 properties: ICC (two-way, absolute agreement, single measure) = .89, 95% CI [.82, .94].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans good to excellent, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"ing":{"es":["Determinar la repetibilidad de la medición del espesor entre dos técnicos.","Dos técnicos midiendo 50 piezas con el mismo calibrador: CCI (dos vías, acuerdo absoluto, medición única) = 0,88 (IC 95 %: 0,79–0,93).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de buena a excelente, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine the repeatability of thickness measurements between two technicians.","Two technicians measuring 50 parts with the same caliper: ICC (two-way, absolute agreement, single measure) = .88, 95% CI [.79, .93].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans good to excellent, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]},"der":{"es":["Determinar la confiabilidad entre dos peritos que estiman el daño económico.","Dos peritos estimando el daño en 50 casos: CCI (dos vías, acuerdo absoluto, medición única) = 0,79 (IC 95 %: 0,64–0,88).","La confiabilidad es buena según Koo y Li (2016); el intervalo va de moderada a buena, así que la estimación todavía tiene cierta incertidumbre.","Si el CCI hubiera sido menor que 0,50, la confiabilidad sería pobre."],"en":["Determine inter-rater reliability of two experts estimating economic damages.","Two experts estimating damages in 50 cases: ICC (two-way, absolute agreement, single measure) = .79, 95% CI [.64, .88].","Reliability is good by Koo and Li's (2016) benchmarks; the interval spans moderate to good, so the estimate still carries some uncertainty.","If the ICC had been below .50, reliability would be poor."]}},"blandaltman":{"sal":{"es":["Evaluar el acuerdo entre el tensiómetro digital y el de mercurio.","60 pares de mediciones: sesgo (diferencia media) = 1,6 mmHg; límites de acuerdo del 95 %: −6,6 a 9,8 mmHg.","En promedio, el tensiómetro digital marca 1,6 mmHg más que el método de referencia; en un paciente la diferencia puede ir de −6,6 a 9,8 mmHg. Si esa diferencia es aceptable lo decide el criterio clínico, no un valor p.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between digital and mercury blood pressure monitors.","60 paired measurements: bias (mean difference) = 1.6 mmHg; 95% limits of agreement: −6.6 to 9.8 mmHg.","On average, the digital monitor reads 1.6 mmHg higher than the reference method; for a given patient the difference may range from −6.6 to 9.8 mmHg. Whether that is acceptable is a clinical judgment, not a p-value.","If the limits had been much narrower, the two methods could be used interchangeably."]},"edu":{"es":["Evaluar el acuerdo entre la versión corta y la versión completa de una prueba de matemáticas (0–100).","60 pares de mediciones: sesgo (diferencia media) = 1,7 puntos; límites de acuerdo del 95 %: −6,9 a 10,3 puntos.","En promedio, la versión corta marca 1,7 puntos más que el método de referencia; en un estudiante la diferencia puede ir de −6,9 a 10,3 puntos. Si la diferencia es aceptable depende del uso que se dará al puntaje.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between the short and full versions of a math test (0–100).","60 paired measurements: bias (mean difference) = 1.7 points; 95% limits of agreement: −6.9 to 10.3 points.","On average, the short version reads 1.7 points higher than the reference method; for a given student the difference may range from −6.9 to 10.3 points. Whether that is acceptable depends on how the score will be used.","If the limits had been much narrower, the two methods could be used interchangeably."]},"soc":{"es":["Evaluar el acuerdo entre la versión digital y la versión en papel de una escala de estrés (0–40).","60 pares de mediciones: sesgo (diferencia media) = 0,6 puntos; límites de acuerdo del 95 %: −3,6 a 4,8 puntos.","En promedio, la versión digital marca 0,6 puntos más que el método de referencia; en una persona la diferencia puede ir de −3,6 a 4,8 puntos. Si la diferencia es aceptable lo decide el criterio del investigador.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between digital and paper versions of a stress scale (0–40).","60 paired measurements: bias (mean difference) = 0.6 points; 95% limits of agreement: −3.6 to 4.8 points.","On average, the digital version reads 0.6 points higher than the reference method; for a given person the difference may range from −3.6 to 4.8 points. Whether that is acceptable is the researcher's judgment.","If the limits had been much narrower, the two methods could be used interchangeably."]},"adm":{"es":["Evaluar el acuerdo entre el conteo de inventario con lector y el conteo manual.","60 pares de mediciones: sesgo (diferencia media) = −1,7 unidades; límites de acuerdo del 95 %: −12,3 a 8,8 unidades.","En promedio, el lector marca 1,7 unidades menos que el método de referencia; en una referencia la diferencia puede ir de −12,3 a 8,8 unidades. Si la diferencia es aceptable depende de la tolerancia del inventario.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between scanner-based and manual inventory counts.","60 paired measurements: bias (mean difference) = −1.7 units; 95% limits of agreement: −12.3 to 8.8 units.","On average, the scanner reads 1.7 units lower than the reference method; for a given item the difference may range from −12.3 to 8.8 units. Whether that is acceptable depends on the inventory tolerance.","If the limits had been much narrower, the two methods could be used interchangeably."]},"eco":{"es":["Evaluar el acuerdo entre el ingreso declarado en la encuesta y el registrado en fuentes administrativas.","60 pares de mediciones: sesgo (diferencia media) = −231 miles de pesos; límites de acuerdo del 95 %: −935 a 473 miles de pesos.","En promedio, la encuesta marca 231 miles de pesos menos que el método de referencia; en un hogar la diferencia puede ir de −935 a 473 miles de pesos. La encuesta subestima el ingreso de forma sistemática.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between survey-reported and administrative-record income.","60 paired measurements: bias (mean difference) = −231 thousand pesos; 95% limits of agreement: −935 to 473 thousand pesos.","On average, the survey reads 231 thousand pesos lower than the reference method; for a given household the difference may range from −935 to 473 thousand pesos. The survey systematically underestimates income.","If the limits had been much narrower, the two methods could be used interchangeably."]},"ing":{"es":["Evaluar el acuerdo entre un sensor de temperatura nuevo y el sensor patrón.","60 pares de mediciones: sesgo (diferencia media) = 0,41 °C; límites de acuerdo del 95 %: −0,97 a 1,79 °C.","En promedio, el sensor nuevo marca 0,41 °C más que el método de referencia; en una medición la diferencia puede ir de −0,97 a 1,79 °C. Si la tolerancia del proceso es menor que esos límites, el sensor necesita calibración.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between a new temperature sensor and the reference sensor.","60 paired measurements: bias (mean difference) = 0.41 °C; 95% limits of agreement: −0.97 to 1.79 °C.","On average, the new sensor reads 0.41 °C higher than the reference method; for a single reading the difference may range from −0.97 to 1.79 °C. If the process tolerance is tighter than these limits, the sensor needs calibration.","If the limits had been much narrower, the two methods could be used interchangeably."]},"der":{"es":["Evaluar el acuerdo entre la duración registrada en el sistema y la revisada en el expediente.","60 pares de mediciones: sesgo (diferencia media) = 2,3 días; límites de acuerdo del 95 %: −12,4 a 17,0 días.","En promedio, el sistema marca 2,3 días más que el método de referencia; en un proceso la diferencia puede ir de −12,4 a 17,0 días. Si la diferencia es aceptable depende del uso que se dará a la duración.","Si los límites hubieran sido mucho más estrechos, los dos métodos podrían usarse de forma intercambiable."],"en":["Evaluate agreement between case duration in the system and in the case file.","60 paired measurements: bias (mean difference) = 2.3 days; 95% limits of agreement: −12.4 to 17.0 days.","On average, the system reads 2.3 days higher than the reference method; for a given case the difference may range from −12.4 to 17.0 days. Whether that is acceptable depends on how the duration will be used.","If the limits had been much narrower, the two methods could be used interchangeably."]}},"pearson":{"sal":{"es":["Correlacionar el índice de masa corporal con la presión arterial sistólica.","IMC y presión sistólica en 85 adultos (ambas normales): r = 0,62 (IC 95 %: 0,47–0,74); p < 0,001; r² = 0,38.","Como p < 0,05, hay correlación positiva y grande según Cohen (1988): a mayor IMC, mayor presión sistólica. Las dos variables comparten el 38 % de su variación. No demuestra causalidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de correlación lineal (conviene revisar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate body mass index with systolic blood pressure.","BMI and systolic blood pressure in 85 adults (both normal): r = .62, 95% CI [.47, .74], p < .001; r² = .38.","Because p < .05, there is a positive, large correlation by Cohen's (1988) benchmarks: higher BMI goes with higher systolic pressure. The two variables share 38% of their variance. This does not show causation.","If p had been ≥ .05, there would be no evidence of a linear correlation (check the scatterplot for other kinds of relationship)."]},"edu":{"es":["Correlacionar las horas de estudio semanales con la nota final.","Horas de estudio y nota final en 85 estudiantes (ambas normales): r = 0,61 (IC 95 %: 0,46–0,73); p < 0,001; r² = 0,37.","Como p < 0,05, hay correlación positiva y grande según Cohen (1988): a más horas de estudio, mayor nota. Las dos variables comparten el 37 % de su variación. No demuestra causalidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de correlación lineal (conviene revisar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate weekly study hours with the final grade.","Study hours and final grade in 85 students (both normal): r = .61, 95% CI [.46, .73], p < .001; r² = .37.","Because p < .05, there is a positive, large correlation by Cohen's (1988) benchmarks: more study hours go with higher grades. The two variables share 37% of their variance. This does not show causation.","If p had been ≥ .05, there would be no evidence of a linear correlation (check the scatterplot for other kinds of relationship)."]},"soc":{"es":["Correlacionar el apoyo social percibido con la satisfacción con la vida.","Apoyo social y satisfacción con la vida en 85 adultos (ambas normales): r = 0,60 (IC 95 %: 0,44–0,72); p < 0,001; r² = 0,36.","Como p < 0,05, hay correlación positiva y grande según Cohen (1988): a más apoyo social, mayor satisfacción. Las dos variables comparten el 36 % de su variación. No demuestra causalidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de correlación lineal (conviene revisar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate perceived social support with life satisfaction.","Social support and life satisfaction in 85 adults (both normal): r = .60, 95% CI [.44, .72], p < .001; r² = .36.","Because p < .05, there is a positive, large correlation by Cohen's (1988) benchmarks: more social support goes with greater satisfaction. The two variables share 36% of their variance. This does not show causation.","If p had been ≥ .05, there would be no evidence of a linear correlation (check the scatterplot for other kinds of relationship)."]},"adm":{"es":["Correlacionar la inversión en publicidad con las ventas mensuales.","Publicidad y ventas en 85 tiendas (ambas normales): r = 0,50 (IC 95 %: 0,33–0,65); p < 0,001; r² = 0,25.","Como p < 0,05, hay correlación positiva y grande según Cohen (1988): a mayor inversión en publicidad, mayores ventas. Las dos variables comparten el 25 % de su variación. No demuestra causalidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de correlación lineal (conviene revisar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate advertising spending with monthly sales.","Advertising and sales in 85 stores (both normal): r = .50, 95% CI [.33, .65], p < .001; r² = .25.","Because p < .05, there is a positive, large correlation by Cohen's (1988) benchmarks: higher advertising spending goes with higher sales. The two variables share 25% of their variance. This does not show causation.","If p had been ≥ .05, there would be no evidence of a linear correlation (check the scatterplot for other kinds of relationship)."]},"eco":{"es":["Correlacionar el ingreso del hogar con el gasto en educación.","Ingreso y gasto en educación en 85 hogares (ambas normales): r = 0,67 (IC 95 %: 0,53–0,77); p < 0,001; r² = 0,45.","Como p < 0,05, hay correlación positiva y grande según Cohen (1988): a mayor ingreso, mayor gasto en educación. Las dos variables comparten el 45 % de su variación. No demuestra causalidad.","Si p hubiera sido ≥ 0,05, no habría evidencia de correlación lineal (conviene revisar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate household income with education spending.","Inco isar el diagrama de dispersión por si hay otra forma de relación)."],"en":["Correlate the number of hearings with case duration.","Hearings and duration in 85 cases (both normal): r = .57, 95% CI [.41, .70], p < .001; r² = .32.","Because p < .05, there is a positive, large correlation by Cohen's (1988) benchmarks: more hearings go with longer duration. The two variables share 32% of their variance. This does not show causation.","If p had been ≥ .05, there would be no evidence of a linear correlation (check the scatterplot for other kinds of relationship)."]}},"spearman":{"sal":{"es":["Relacionar la intensidad del dolor con la discapacidad funcional.","Dolor (0–10) y discapacidad en 60 pacientes: ρ = 0,40; p = 0,002.","Como p < 0,05, hay correlación positiva y mediana: a más dolor, más discapacidad. Se usó Spearman porque una variable es ordinal y la otra no es normal.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate pain intensity to functional disability.","Pain (0–10) and disability in 60 patients: ρ = .40, p = .002.","Because p < .05, there is a positive, medium correlation: more pain goes with more disability. Spearman was used because one variable is ordinal and the other is not normal.","If p had been ≥ .05, there would be no evidence of a relationship."]},"edu":{"es":["Relacionar la motivación académica con el rendimiento.","Motivación (escala Likert) y promedio en 60 estudiantes: ρ = 0,37; p = 0,004.","Como p < 0,05, hay correlación positiva y mediana: a más motivación, mejor rendimiento. Se usó Spearman porque una variable es ordinal y la otra no es normal.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate academic motivation to achievement.","Motivation (Likert scale) and GPA in 60 students: ρ = .37, p = .004.","Because p < .05, there is a positive, medium correlation: more motivation goes with better achievement. Spearman was used because one variable is ordinal and the other is not normal.","If p ha pates.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate frequency of community participation to life satisfaction.","Participation and satisfaction (ordinal scales) in 40 people: τ-b = .44, p = .001.","Because p < .05, there is a positive correlation: more participation goes with more satisfaction. τ-b was used because both variables are ordinal, with few categories and many ties.","If p had been ≥ .05, there would be no evidence of a relationship."]},"adm":{"es":["Relacionar el nivel jerárquico con la satisfacción laboral.","Nivel jerárquico y satisfacción (baja, media, alta) en 40 empleados: τ-b = 0,32; p = 0,020.","Como p < 0,05, hay correlación positiva: a mayor nivel jerárquico, mayor satisfacción. Se usó τ-b porque las dos variables son ordinales, con pocas categorías y muchos empates.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate job level to job satisfaction.","Job level and satisfaction (low, medium, high) in 40 employees: τ-b = .32, p = .020.","Because p < .05, there is a positive correlation: higher job level goes with greater satisfaction. τ-b was used because both variables are ordinal, with few categories and many ties.","If p had been ≥ .05, there would be no evidence of a relationship."]},"eco":{"es":["Relacionar la calificación de riesgo soberano con el nivel de las tasas de interés.","Riesgo (escala ordinal) y tasa (baja, media, alta) en 40 países: τ-b = 0,31; p = 0,026.","Como p < 0,05, hay correlación positiva: a mayor riesgo, tasas más altas. Se usó τ-b porque las dos variables son ordinales, con pocas categorías y muchos empates.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate sovereign risk rating to interest rate level.","Risk (ordinal scale) and rate (low, medium, high) in 40 countries: τ-b = .31, p = .026.","Because p < .05, there is a positive correlation: higher risk goes with higher rates. τ-b was used because both variables are ordinal, with few categories and many ties.","If p had been ≥ .05, there would be no evidence of a relationship."]},"ing":{"es":["Relacionar la antigüedad del equipo con el grado de corrosión.","Antigüedad por rangos y corrosión (grado 1–4) en 40 estructuras: τ-b = 0,44; p = 0,002.","Como p < 0,05, hay correlación positiva: a mayor antigüedad, mayor corrosión. Se usó τ-b porque las dos variables son ordinales, con pocas categorías y muchos empates.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate equipment age to degree of corrosion.","Age bands and corrosion (grade 1–4) in 40 structures: τ-b = .44, p = .002.","Because p < .05, there is a positive correlation: older structures show more corrosion. τ-b was used because both variables are ordinal, with few categories and many ties.","If p had been ≥ .05, there would be no evidence of a relationship."]},"der":{"es":["Relacionar la gravedad del delito con la severidad de la pena impuesta.","Gravedad (leve, moderada, grave) y severidad de la pena (categorías) en 40 casos: τ-b = 0,41; p = 0,003.","Como p < 0,05, hay correlación positiva: a mayor gravedad, penas más severas. Se usó τ-b porque las dos variables son ordinales, con pocas categorías y muchos empates.","Si p hubiera sido ≥ 0,05, no habría evidencia de relación."],"en":["Relate crime severity to severity of the sentence.","Severity (minor, moderate, serious) and sentence severity (categories) in 40 cases: τ-b = .41, p = .003.","Because p < .05, there is a positive correlation: more serious crimes receive harsher sentences. τ-b was used because both variables are ordinal, with few categories and many ties.","If p had been ≥ .05, there would be no evidence of a relationship."]}},"rls":{"sal":{"es":["Relacionar los años de escolaridad materna con el peso al nacer.","n = 300: β = 28 g por año de escolaridad materna (IC 95 %: 12–44); R² = 0,04; p < 0,001.","Por cada año de escolaridad materna, el peso al nacer aumenta en promedio 28 g. Esa variable se asocia co
