<style>
/* Layout: two entry modes (from the test / from the goal) plus an area selector over a zoomable sunburst wheel beside a test card; reference sections below. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#15233A; --muted:#566377; --line:#D6DDE7; --soft:#E4EAF1;
  --lv-uni:#203759; --lv-bi:#2F5079; --lv-multi:#46699A; --on-lv:#FFFFFF;
  --fam:#E2E8F0;
  --des:#E9A421; --rel:#E25B3F; --exp:#5352D2; --pre:#12968C;
  --des-t:#FBE6B9; --rel-t:#F8D2C8; --exp-t:#D9D9F8; --pre-t:#C3EAE5;
  --ok:#1E7F4F; --no:#B3412E; --link:#2F5079;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162030; --ink:#E6ECF4; --muted:#9BA8BA; --line:#2A3749; --soft:#1D2939;
  --lv-uni:#2F4C78; --lv-bi:#3B5F8E; --lv-multi:#5276AA; --on-lv:#FFFFFF;
  --fam:#223046;
  --des:#F2B13A; --rel:#F0715A; --exp:#8584F0; --pre:#2DB8AD;
  --des-t:#4C3B14; --rel-t:#552B22; --exp-t:#30306A; --pre-t:#134540;
  --ok:#5BC48D; --no:#F08A76; --link:#9DB8E8;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162030; --ink:#E6ECF4; --muted:#9BA8BA; --line:#2A3749; --soft:#1D2939;
  --lv-uni:#2F4C78; --lv-bi:#3B5F8E; --lv-multi:#5276AA; --on-lv:#FFFFFF;
  --fam:#223046;
  --des:#F2B13A; --rel:#F0715A; --exp:#8584F0; --pre:#2DB8AD;
  --des-t:#4C3B14; --rel-t:#552B22; --exp-t:#30306A; --pre-t:#134540;
  --ok:#5BC48D; --no:#F08A76; --link:#9DB8E8;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--exp);outline-offset:2px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
header{display:grid;gap:18px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em}
.byline{font-size:15px;color:var(--muted)}
.byline a{font-weight:700}
.lede{max-width:66ch;color:var(--muted);font-size:17px}
.areas{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.areas .lbl{margin:0 6px 0 0}
.area{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.area[aria-checked="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:880px}
@media (max-width:620px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.mode .mt{font-family:var(--display);font-weight:800;font-size:19px}
.mode .md{font-size:14px;color:var(--muted)}
.mode[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--ink)}
.search{position:relative;max-width:880px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 16px 14px 44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--exp)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;list-style:none;margin:0;padding:6px;z-index:5;box-shadow:0 12px 30px rgba(10,20,40,.18);max-height:320px;overflow:auto}
.sugg li button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sugg li button:hover,.sugg li button.on{background:var(--soft)}
.sugg small{color:var(--muted)}
.asst{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:880px}
.atrail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.achip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.atools{display:flex;gap:8px;flex-wrap:wrap}
.abtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:700}
.abtn:hover{border-color:var(--ink)}
.aq{font-family:var(--display);font-size:clamp(21px,2.6vw,26px);font-weight:800}
.ah{color:var(--muted);font-size:15px;margin-top:4px}
.aopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.aopt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:3px;align-content:start}
.aopt:hover{border-color:var(--ink);background:var(--soft)}
.aopt b{font-size:16px}
.aopt span{font-size:14px;color:var(--muted)}
.ares{display:grid;gap:10px}
.rbtn{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.rbtn:hover,.rbtn.on{border-color:var(--ink)}
.rbtn b{font-size:16px}
.rbtn small{color:var(--muted);display:block}
.anote{font-size:15px;background:var(--soft);border-radius:10px;padding:10px 12px}
.acoh{border-left:4px solid var(--line);padding:4px 0 4px 12px;display:grid;gap:6px;font-size:15px}
.main{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.wheelbox{padding:18px;display:flex;flex-direction:column;gap:14px}
@media (min-width:961px){.wheelbox{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);min-height:24px}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:6px;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs span.cur{color:var(--ink);font-weight:700}
.wheel{width:100%;max-width:600px;margin:0 auto;aspect-ratio:1}
.wheel svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.wheel path{stroke:var(--surface);stroke-width:1.6;cursor:pointer;transition:opacity .25s}
.wheel path:hover{filter:brightness(1.06)}
.wheel path.sel{stroke:var(--ink);stroke-width:3}
.wheel text{font-family:var(--body);font-weight:700;fill:var(--ink);pointer-events:none;dominant-baseline:central;text-anchor:middle;transition:opacity .25s}
.wheel .lvt{fill:var(--on-lv);letter-spacing:.06em}
.wheel .lvt .sub{font-weight:400;letter-spacing:0;opacity:.85}
.wheel .dim{opacity:.16}
.wheel .center{cursor:pointer}
.wheel .center circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.wheel .center text{fill:var(--muted);font-weight:700;font-size:12px}
.wheel .center text.big{fill:var(--ink);font-family:var(--display);font-size:15px}
.key{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px;color:var(--muted)}
.key b{display:block;color:var(--ink);font-size:13px}
@media (max-width:520px){.key{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:14px}
.lg[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.hint{font-size:13px;color:var(--muted)}
.card{padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h2{font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.01em;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.chip.al{font-weight:700}
.coh{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.coh li{padding:10px 12px;min-width:0;background:var(--surface)}
.coh li + li{border-left:1px solid var(--line)}
.coh .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block}
.coh .v{font-weight:700;font-size:15px;overflow-wrap:anywhere}
@media (max-width:560px){.coh{grid-template-columns:repeat(2,minmax(0,1fr))}.coh li:nth-child(3){border-left:0}.coh li:nth-child(n+3){border-top:1px solid var(--line)}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.facts div{min-width:0}
.facts .wide{grid-column:1/-1}
@media (max-width:560px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.facts dd{margin:0}
.hyp{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.rule{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}
.ex{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.ex .exh{background:var(--ink);color:var(--surface);padding:8px 14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ex .exb{padding:14px;display:grid;gap:12px}
.ex .res{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere;background:var(--soft);border-radius:8px;padding:8px 10px}
.ex .mean{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ex .tagr{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1.5px solid currentColor}
.ex .tagr.ok{color:var(--ok)} .ex .tagr.no{color:var(--no)}
.obj p{font-size:17px}
.obj mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.alts{display:flex;flex-direction:column;gap:8px}
.altb{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.altb:hover{border-color:var(--ink)}
.altb span{color:var(--muted);font-size:14px}
.caution{border-left:4px solid var(--rel);padding:2px 0 2px 12px;font-size:15px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.srcs li,.biblio li{padding-left:2em;text-indent:-2em;overflow-wrap:anywhere}
.deeplink{font-size:13px;color:var(--muted)}
.deeplink code{font-family:var(--mono);color:var(--ink);background:var(--soft);padding:1px 6px;border-radius:5px}
section{display:flex;flex-direction:column;gap:18px}
.sh{display:grid;gap:6px}
.sh h2{font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.01em}
.sh p{color:var(--muted);max-width:70ch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.pcard h3{font-size:19px;font-weight:800}
.pcard .say{font-size:15px;border-left:3px solid var(--line);padding-left:10px;font-style:italic}
.tpl{background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:16px;font-size:16px}
.stairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
@media (max-width:1060px){.stairs{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
@media (max-width:620px){.stairs{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.step .top{padding:14px 16px;color:#fff;display:grid;gap:2px}
.step .top .n{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.9}
.step .top h3{font-size:24px;font-weight:800}
.step .bd{padding:16px;display:flex;flex-direction:column;gap:14px}
.step .q{font-family:var(--display);font-weight:700;font-size:17px}
.step .reach{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:13px;padding:3px 9px;border-radius:7px;background:var(--soft)}
.tag.verb{font-weight:700}
.step .exo{font-size:14px;border-left:3px solid var(--line);padding-left:10px;font-style:italic}
.tbtn{font-size:13px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tbtn:hover{border-color:var(--ink)}
.see{align-self:flex-start;border:1.5px solid var(--ink);background:none;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
@media (min-width:1061px){ .step:nth-child(1){margin-top:66px}.step:nth-child(2){margin-top:44px}.step:nth-child(3){margin-top:22px} }
.avoid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
@media (max-width:760px){.avoid{grid-template-columns:minmax(0,1fr)}}
.avoid h3{font-size:21px;font-weight:800;margin-bottom:6px}
.strike{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--no)}
.swap{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.swap li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:8px;align-items:baseline}
.swap .arr{color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
td.rowh{font-weight:700}
.cov{display:grid;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%}
.cov small{color:var(--muted);font-size:13px}
.none{color:var(--muted)}
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.flag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.flag .bad{font-weight:700}
.flag .fix{color:var(--muted);font-size:15px}
.flag .fix b{color:var(--ink)}
.notinc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;list-style:none;margin:0;padding:0}
.notinc li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.notinc b{display:block}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin:0}
.gloss div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gloss dt{font-weight:700;font-family:var(--display);font-size:17px}
.gloss dd{margin:2px 0 0;font-size:15px;color:var(--muted)}
.biblio{list-style:none;margin:0;padding:18px;display:grid;gap:8px;font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.cite{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}

.citebox .apa{font-size:16px;padding-left:2em;text-indent:-2em;overflow-wrap:anywhere}
.copy{justify-self:start;border:1.5px solid var(--ink);background:none;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
.credits{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;font-size:15px;align-content:start}
.orcid{display:inline-flex;align-items:center;gap:6px;font-weight:700}

footer{color:var(--muted);font-size:14px;max-width:76ch;display:grid;gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>

 di_h:"Estadística descriptiva e inferencial",di_p:"Son dos usos de la estadística, no dos grupos de pruebas. Lo que cambia es la pregunta: ¿hablo solo de los datos que tengo o de la población de la que vienen? Las dos se aplican a una, dos o más variables.",

 di_n:"<li><b>Una misma medida sirve para las dos.</b> Una media, una correlación o un OR describen la muestra; acompañados de su IC 95 % y su valor p, se usan para inferir sobre la población.</li><li><b>Las pruebas de hipótesis son siempre inferenciales.</b> El valor p de una t, un chi-cuadrado o un ANOVA solo tiene sentido si se quiere generalizar a una población.</li><li><b>Alcance descriptivo no es lo mismo que estadística descriptiva.</b> Estimar la prevalencia de una población con su IC 95 % es un objetivo descriptivo que usa estadística inferencial. Por eso en la rueda hay pruebas inferenciales (IC 95 %, t para una muestra, binomial) dentro del alcance descriptivo. Y un estudio relacional o explicativo también empieza describiendo su muestra.</li><li><b>La inferencia supone una muestra que represente a la población.</b> Si la muestra no es probabilística o está sesgada, el IC y el valor p no corrigen ese problema.</li>",
 j_di:"Descriptiva e inferencial",

 p4l:"Lo que el p no es",p4h:"No es la probabilidad de H0",p4:"Es la probabilidad de obtener un resultado como el observado, o más extremo, si H0 fuera cierta. No es la probabilidad de que H0 sea verdadera (Wasserstein y Lazar, 2016).",
 tpl:"<div class=\"lbl\">Plantilla de interpretación</div>«Como p <b>&lt;</b> 0,05, se rechaza H0: <b>A es diferente de B</b> (A tiene valores más altos o más bajos).» · «Como p <b>≥</b> 0,05, no se rechaza H0: <b>no hay evidencia de diferencia entre A y B</b>.»",
 st_h:"La escalera de los alcances",st_p:"La literatura estadística distingue entre modelar para describir, para explicar y para predecir (Shmueli, 2010). La rueda agrega el escalón relacional, que corresponde a la inferencia bivariada: asociar y comparar. Cada escalón incluye los anteriores: un estudio explicativo también describe y relaciona.",

 av_h:"Verbos que no van en un objetivo cuantitativo",av_p:"Son verbos de enfoque cualitativo o no se pueden medir. En cuantitativa, el verbo tiene que llevar a una medición, una estimación o una prueba. Y el verbo solo no basta: «determinar la prevalencia» es descriptivo, «determinar la asociación» es relacional y «determinar los factores, ajustando por…» es explicativo.",

 map_sc:"Alcance",map_of:"de",map_tests:"pruebas",
 nor_h:"¿Normal o no normal?",nor_p:"Shapiro-Wilk (Shapiro y Wilk, 1965) es la prueba de normalidad con mayor potencia en casi todos los tamaños de muestra (Razali y Wah, 2011); la regla «hasta 50 datos» viene de sus tablas originales y la aproximación de Royston (1992) la extiende a muestras grandes. Con muestras grandes cualquier prueba detecta desvíos mínimos, así que se acompaña de un histograma o un gráfico Q-Q. Si p &lt; 0,05, los datos no son normales: usa la columna derecha. La normalidad solo se revisa en variables cuantitativas y donde la prueba la necesita: en cada grupo (t de Student, ANOVA), en las diferencias (t pareada) o en los residuos (regresiones). Para las variables cualitativas no aplica: sus pruebas tienen otros supuestos, como las frecuencias esperadas.",

 cr_ai:"Uso de inteligencia artificial",cr_ait:"Concepto, criterios de contenido y dirección: Leidys-Helena Rivera-Quiroz. La programación, la redacción de borradores de las fichas, la simulación de los ejemplos y la verificación bibliográfica se hicieron con asistencia de Claude (Anthropic), un modelo de inteligencia artificial. La autora es responsable del contenido final.",

 a_hint1:"Each test's card is below; the recommended tests are highlighted on the wheel.",a_hint2:"Each test's card is next to the wheel; the recommended tests are highlighted on the wheel.",
 di_h:"Descriptive and inferential statistics",di_p:"They are two uses of statistics, not two sets of tests. What changes is the question: am I talking only about the data I have, or about the population they come from? Both apply to one, two or more variables.",
 di_d:"<div class=\"lbl\">Descriptive statistics</div><h3>Summarizes the data I have</h3><p>Organizes and summarizes the sample with tables, charts and measures (frequencies, mean, median, SD, correlation). Its conclusions hold for those data and go no further.</p><p class=\"say\">You can tell because it has no p-value or confidence interval.</p>",
 di_i:"<div class=\"lbl\">Inferential statistics</div><h3>Generalizes to the population</h3><p>Uses the sample to estimate population values (confidence intervals) or to test hypotheses (p-values), quantifying sampling uncertainty.</p><p class=\"say\">You can tell because it reports a 95% CI, a p-value or both.</p>",
 di_tbl:"<thead><tr><th></th><th>Univariate</th><th>Bivariate</th><th>Multivariate</th></tr></thead><tbody><tr><td class=\"rowh\">Descriptive</td><td>Frequencies, mean ± SD, median (IQR)</td><td>Cross-table, means by group, r computed in the sample</td><td>Principal components, cluster, correspondence analysis</td></tr><tr><td class=\"rowh\">Inferential</td><td>95% CI of a prevalence, one-sample t, binomial test</td><td>Chi-square, Student's t, Mann-Whitney, r with its p-value</td><td>Regressions with CIs and p-values, MANOVA, Cox, structural equations</td></tr></tbody>",
 di_n:"<li><b>The same measure serves both.</b> A mean, a correlation or an OR describe the sample; with their 95% CI and p-value, they are used to make inferences about the population.</li><li><b>Hypothesis tests are always inferential.</b> The p-value of a t test, a chi-square test or an ANOVA only makes sense if you want to generalize to a population.</li><li><b>A descriptive scope is not the same as descriptive statistics.</b> Estimating a population's prevalence with its 95% CI is a descriptive objective that uses inferential statistics. That is why the wheel has inferential tests (95% CI, one-sample t, binomial) within the descriptive scope. And a relational or explanatory study also starts by describing its sample.</li><li><b>Inference assumes a sample that represents the population.</b> If the sample is non-probabilistic or biased, the CI and the p-value do not fix that problem.</li>",
 j_di:"Descriptive and inferential",
 prac_h:"Practice mode",prac_p:"Ten random questions built from the examples in your field: the scope of an objective, which test fits some data, what each test assumes and how to read a result. Each answer comes with an explanation and a link to the card.",
 p_h:"How to read the p-value",p_p:"All tests with hypotheses are interpreted with the same logic. First the general rule, then the sentence that goes in the article.",
 p1l:"If p &lt; .05",p1h:"Reject H0",p1:"There is evidence of a difference or an association.",p1s:"“The mean score differed between A and B (p = .01): it was higher in A.”",
 p2l:"If p ≥ .05",p2h:"Do not reject H0",p2:"There is not enough evidence of a difference. It does not show that the groups are equal (Altman & Bland, 1995).",p2s:"“No significant difference in score was found between A and B (p = .38).”",
 p3l:"What p does not tell you",p3h:"Size and importance",p3:"With large samples, tiny differences give very small p-values. That is why the effect size and the 95% CI are reported alongside the p-value (Wasserstein & Lazar, 2016).",
 p4l:"What p is not",p4h:"It is not the probability of H0",p4:"It is the probability of obtaining a result like the one observed, or more extreme, if H0 were true. It is not the probability that H0 is true (Wasserstein & Lazar, 2016).",
 tpl:"<div class=\"lbl\">Interpretation template</div>“Because p <b>&lt;</b> .05, H0 is rejected: <b>A differs from B</b> (A has higher or lower values).” · “Because p <b>≥</b> .05, H0 is not rejected: <b>there is no evidence of a difference between A and B</b>.”",
 st_h:"The ladder of research scopes",st_p:"The statistical literature distinguishes between modeling to describe, to explain and to predict (Shmueli, 2010). The wheel adds the relational step, which corresponds to bivariate inference: associating and comparing. Each step includes the previous ones: an explanatory study also describes and relates.",
 st_lv:"Level",st_verbs:"Verbs for the objective",st_words:"Keywords",st_ex:"Example objective",st_tests:"Tests with this scope",st_more:"more",st_see:"Show on the wheel",
 av_h:"Verbs that do not belong in a quantitative objective",av_p:"They are verbs of the qualitative approach or cannot be measured. In quantitative research, the verb must lead to a measurement, an estimate or a test. And the verb alone is not enough: “determine the prevalence” is descriptive, “determine the association” is relational and “determine the factors, adjusting for…” is explanatory.",
 map_h:"How far does each scope reach?",map_p:"Scopes do not map exactly onto univariate, bivariate and multivariate analysis. The descriptive scope enters the bivariate level with cross-tables and reappears in exploratory and measurement multivariate methods; the predictive scope starts at the bivariate level with diagnostic accuracy.",
 map_sc:"Scope",map_of:"of",map_tests:"tests",
 nor_h:"Normal or not normal?",nor_p:"Shapiro-Wilk (Shapiro & Wilk, 1965) is the most powerful normality test at almost all sample sizes (Razali & Wah, 2011); the “up to 50 observations” rule comes from its original tables, and Royston's (1992) approximation extends it to large samples. With large samples any test detects trivial departures, so it is accompanied by a histogram or a Q-Q plot. If p &lt; .05, the data are not normal: use the right-hand column. Normality is checked only for quantitative variables and where the test needs it: in each group (Student's t, ANOVA), in the differences (paired t) or in the residuals (regressions). It does not apply to categorical variables: their tests have other assumptions, such as expected frequencies.",
 nor_c1:"What do you want to do?",nor_c2:"Normal data (parametric)",nor_c3:"Non-normal or ordinal data",
 fl_h:"Signs of incoherence",fl_p:"Common mistakes that appear when the objective is matched against the statistics.",
 ni_h:"What this wheel does not include",ni_p:"The wheel gathers the tests most used across the seven fields, but not every test that exists. For these topics, a specialized book or advice from a statistician is the better route.",
 gl_h:"Basic glossary",gl_p:"The words that appear most often on the cards.",
 rf_h:"References",rf_p:"All sources cited on the wheel, in APA 7 format. Each card also shows its own references.",

 cr_a:"Author",cr_l:"License",cr_lic:"Creative Commons Attribution 4.0 International (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>). You may copy, share and adapt this material for any purpose, provided you credit the author and indicate whether changes were made.",
 cr_ai:"Use of artificial intelligence",cr_ait:"Concept, content criteria and direction: Leidys-Helena Rivera-Quiroz. Programming, drafting of the cards, simulation of the examples and bibliographic verification were done with the assistance of Claude (Anthropic), an artificial intelligence model. The author is responsible for the final content.",
 cr_3:"Third-party content and data",cr_3t:"The tests, cutoffs and interpretation criteria belong to the authors cited on each card and in the references. The examples use simulated data: every figure was computed by applying the test to computer-generated data, so statistics, p-values and intervals are consistent with one another; they do not come from real studies. Typefaces: Bricolage Grotesque, Atkinson Hyperlegible and JetBrains Mono, distributed by Google Fonts under the SIL Open Font License 1.1.",

const MIS={
es:[{t:"Como el valor p es menor que 0,05, el efecto encontrado es grande e importante en la práctica: un valor p así de bajo garantiza que la diferencia o la asociación tiene relevancia real, por lo que no hace falta revisar el tamaño del efecto ni el intervalo de confianza.",w:"El valor p no mide el tamaño del efecto: con muestras grandes, diferencias mínimas dan p muy bajos. La importancia práctica se juzga con el tamaño del efecto y su IC."},
 {t:"El resultado demuestra que la variable estudiada causa el cambio observado en el desenlace: como la asociación es estadísticamente significativa, se puede afirmar que si se modifica esa variable, el resultado cambiará en la misma magnitud en cualquier población.",w:"Un resultado estadístico no demuestra causalidad por sí solo; eso depende del diseño del estudio (experimento, cuasiexperimento) y de sus supuestos. Tampoco se puede extender sin más a cualquier población.",c:1},
 {t:"Hay menos de un 5 % de probabilidad de que la hipótesis nula sea verdadera, así que con más de un 95 % de seguridad la hipótesis de investigación es cierta y el hallazgo se repetirá en cualquier estudio que se haga con la misma pregunta.",w:"El valor p no es la probabilidad de que H0 sea verdadera: es la probabilidad de obtener un resultado así o más extremo si H0 fuera cierta. Tampoco garantiza que el hallazgo se repita."},
 {t:"Como p < 0,05, el resultado se cumple en el 95 % de las unidades estudiadas: solo el 5 % de los casos se comporta de forma distinta a lo que muestra la estimación, y por eso la conclusión se puede aplicar a casi cualquier caso individual.",w:"El 0,05 es el nivel de significancia que se fijó antes del análisis; no dice en qué porcentaje de los casos se cumple el resultado ni permite predecir lo que pasará con un caso individual."},
 {t:"El resultado no permite concluir nada sobre la población, porque la muestra no incluye a todas las unidades: cualquier diferencia o asociación encontrada podría deberse a quiénes quedaron en la muestra, así que solo vale como descripción de los datos recogidos.",w:"La inferencia estadística existe justamente para sacar conclusiones sobre la población a partir de una muestra, cuantificando la incertidumbre con el IC y el valor p (si la muestra es representativa)."},
 {t:"El resultado es significativo porque la muestra es grande; con una muestra pequeña la misma diferencia habría dado el mismo valor p, así que el tamaño de la muestra no influye en la conclusión y no es necesario reportarlo junto con el estadístico.",w:"El tamaño de la muestra sí influye en el valor p: la misma diferencia puede ser significativa con muchos datos y no serlo con pocos. Por eso se reportan n, el efecto y su IC."},
 {t:"Como el resultado es estadísticamente significativo, se confirma la hipótesis nula: los datos muestran que no hay diferencias ni asociación entre las variables, y la variación observada en la muestra se explica solo por el azar del muestreo.",w:"Es al revés: un resultado significativo lleva a rechazar H0, no a confirmarla. Además, ninguna prueba «confirma» H0; cuando p ≥ 0,05 solo se dice que no hay evidencia suficiente para rechazarla."}],
en:[{t:"Because the p-value is below .05, the effect found is large and important in practice: a p-value this low guarantees that the difference or association has real relevance, so there is no need to check the effect size or the confidence interval.",w:"The p-value does not measure effect size: with large samples, tiny differences give very small p-values. Practical importance is judged from the effect size and its CI."},
 {t:"The result proves that the variable studied causes the change observed in the outcome: because the association is statistically significant, one can state that changing that variable will change the outcome by the same amount in any population.",w:"A statistical result alone does not prove causation; that depends on the study design (experiment, quasi-experiment) and its assumptions. Nor can it simply be extended to any population.",c:1},
 {t:"There is less than a 5% probability that the null hypothesis is true, so with more than 95% certainty the research hypothesis is correct and the finding will be repeated in any study that asks the same question.",w:"The p-value is not the probability that H0 is true: it is the probability of a result this extreme or more if H0 were true. Nor does it guarantee that the finding will replicate."},
 {t:"Because p < .05, the result holds for 95% of the units studied: only 5% of cases behave differently from what the estimate shows, which is why the conclusion can be applied to almost any individual case.",w:"The .05 is the significance level set before the analysis; it does not say in what percentage of cases the result holds, nor does it predict what will happen to an individual case."},
 {t:"The result says nothing about the population, because the sample does not include every unit: any difference or association found could be due to who ended up in the sample, so it is only valid as a description of the data collected.",w:"Statistical inference exists precisely to draw conclusions about a population from a sample, quantifying uncertainty with the CI and the p-value (provided the sample is representative)."},
 {t:"The result is significant because the sample is large; with a small sample the same difference would have produced the same p-value, so sample size does not affect the conclusion and does not need to be reported alongside the statistic.",w:"Sample size does affect the p-value: the same difference can be significant with many observations and not with few. That is why n, the effect and its CI are reported."},
 {t:"Because the result is statistically significant, the null hypothesis is confirmed: the data show there are no differences or association between the variables, and the variation observed in the sample is explained by sampling chance alone.",w:"It is the other way around: a significant result leads to rejecting H0, not confirming it. Moreover, no test “confirms” H0; when p ≥ .05 one only says there is not enough evidence to reject it."}]};

const FLAGS={
es:[["El objetivo dice «conocer» o «comprender» y el estudio es cuantitativo.","Son verbos de enfoque cualitativo o no medibles. Usa <b>describir, estimar, comparar, asociar</b> o <b>estimar el efecto</b>, según el alcance."],
 ["El objetivo dice «describir», pero los resultados traen valores p y comparaciones.","El alcance real es <b>relacional</b>. Si solo se quería describir, bastan frecuencias, medias o medianas."],
 ["El objetivo dice «determinar los factores de riesgo» y solo hay chi-cuadrado.","Falta el ajuste multivariado. Con chi-cuadrado el alcance es <b>relacional</b>; para ser <b>explicativo</b> se necesita una regresión."],
 ["Shapiro-Wilk dio p &lt; 0,05, pero reportan media ± DE y t de Student.","Con datos no normales correspondía <b>mediana (RIC)</b> y <b>U de Mann-Whitney</b>."],
 ["Reportan la U de Mann-Whitney como «diferencia de medias».","Mann-Whitney no compara medias. Se reportan medianas y se concluye que un grupo <b>tiende a tener valores más altos</b> (Fay y Proschan, 2010)."],
 ["El objetivo dice «comparar» grupos y usan la correlación de Pearson.","Para comparar grupos se usa t de Student, U de Mann-Whitney, ANOVA o chi-cuadrado. Pearson relaciona dos variables numéricas."],
 ["Concluyen «no hay diferencia» o «son iguales» porque p ≥ 0,05.","La conclusión correcta es <b>no se encontró evidencia de diferencia</b> (Altman y Bland, 1995)."],
 ["Solo reportan el valor p, sin tamaño del efecto ni IC 95 %.","El p no dice cuán grande es la diferencia. Reporta el <b>tamaño del efecto</b> y su <b>IC 95 %</b> (Wasserstein y Lazar, 2016)."],
 ["Hacen muchas comparaciones y no corrigen.","Con muchas pruebas aumentan los falsos positivos. Usa <b>Tukey, Holm o Benjamini-Hochberg</b> según el caso."],
 ["El objetivo dice «predecir», pero no reportan AUC, calibración ni validación.","Un estudio <b>predictivo</b> debe mostrar qué tan bien acierta el modelo en datos que no se usaron para construirlo (Steyerberg, 2019)."],
 ["Hablan de «causa» o «efecto» con un estudio transversal y análisis bivariado.","Sin ajuste ni un diseño que lo sustente (experimento, diferencias en diferencias, variables instrumentales), lo correcto es hablar de <b>asociación</b>."],
 ["Presentan un alfa de Cronbach alto como prueba de que la escala mide una sola dimensión.","El alfa estima confiabilidad, no dimensionalidad. La estructura se revisa con <b>análisis factorial</b>."]],
en:[["The objective says “to know” or “to understand” and the study is quantitative.","These are verbs of the qualitative approach or cannot be measured. Use <b>describe, estimate, compare, associate</b> or <b>estimate the effect</b>, depending on the scope."],
 ["The objective says “describe”, but the results include p-values and comparisons.","The actual scope is <b>relational</b>. If the aim was only to describe, frequencies, means or medians are enough."],
 ["The objective says “determine the risk factors” and there is only a chi-square test.","Multivariable adjustment is missing. With chi-square the scope is <b>relational</b>; to be <b>explanatory</b> a regression is needed."],
 ["Shapiro-Wilk gave p &lt; .05, but they report mean ± SD and Student's t.","With non-normal data, the right choice was the <b>median (IQR)</b> and the <b>Mann-Whitney U</b>."],
 ["They report the Mann-Whitney U as a “difference in means”.","Mann-Whitney does not compare means. Medians are reported and the conclusion is that one group <b>tends to have higher values</b> (Fay & Proschan, 2010)."],
 ["The objective says “compare” groups and they use Pearson's correlation.","Groups are compared with Student's t, Mann-Whitney U, ANOVA or chi-square. Pearson relates two numeric variables."],
 ["They conclude “no difference” or “the groups are equal” because p ≥ .05.","The correct conclusion is <b>no evidence of a difference was found</b> (Altman & Bland, 1995)."],
 ["They report only the p-value, with no effect size or 95% CI.","The p-value does not say how large the difference is. Report the <b>effect size</b> and its <b>95% CI</b> (Wasserstein & Lazar, 2016)."],
 ["They make many comparisons and do not correct for them.","False positives increase with many tests. Use <b>Tukey, Holm or Benjamini-Hochberg</b> as appropriate."],
 ["The objective says “predict”, but they report no AUC, calibration or validation.","A <b>predictive</b> study must show how well the model performs on data that were not used to build it (Steyerberg, 2019)."],
 ["They speak of “cause” or “effect” with a cross-sectional study and bivariate analysis.","Without adjustment or a design that supports it (experiment, difference-in-differences, instrumental variables), the right word is <b>association</b>."],
 ["They present a high Cronbach's alpha as proof that the scale measures a single dimension.","Alpha estimates reliability, not dimensionality. The structure is checked with <b>factor analysis</b>."]]};

en:[["Nominal categorical variable","Unordered categories: sex, economic sector, type of offense."],["Ordinal categorical variable","Ordered categories: mild, moderate, severe; stratum; Likert scales."],["Quantitative variable","Numbers with units: age, salary, days, MPa."],["Normal distribution","Bell-shaped, symmetric around the mean. Many parametric tests assume it."],["Parametric test","Assumes a distribution (almost always normal) and compares parameters such as the mean: Student's t, ANOVA, Pearson."],["Nonparametric test","Does not assume normality; usually works with ranks: Mann-Whitney, Wilcoxon, Kruskal-Wallis, Spearman."],["Independent samples","Different units in each group."],["Related samples","The same units measured several times, or matched pairs."],["Null hypothesis (H0)","The statement of “no difference” or “no association” that the test tries to reject."],["Descriptive statistics","Summarizes the sample data (tables, charts, measures) without generalizing beyond them."],["Inferential statistics","Uses the sample to estimate population values (95% CI) or to test hypotheses (p-value)."],["p-value","Probability of obtaining a result like the one observed, or more extreme, if H0 were true."],["95% CI","Range of values compatible with the data for the population value."],["Effect size","How much groups differ or how strong a relationship is, regardless of sample size."],["Confounding","A third variable distorts the relationship between exposure and outcome."],["Crude and adjusted","Crude: without considering other variables. Adjusted: controlling for the effect of other variables."],["OR, RR, PR, IRR and HR","Odds ratio, relative risk, prevalence ratio, incidence rate ratio and hazard ratio. In all of them, 1 means “no association”."],["Censoring","Units that leave follow-up without having had the event; survival methods make use of them."]]};

kappa:{t:["evalind","prev"],k:0,es:{d:"2 clasificaciones cualitativas de las mismas unidades.",s:["Los dos evaluadores clasifican de forma independiente, con las mismas categorías excluyentes.","Las unidades son independientes entre sí.","El valor de kappa depende de la prevalencia de las categorías: con una muy frecuente, kappa baja aunque el acuerdo observado sea alto."],r:"La tabla de acuerdo y el porcentaje de acuerdo observado junto a kappa."},

 en:{d:"Categorical classifications made by 3 or more raters.",s:["Raters classify independently, using the same categories.","Each unit is classified by the same number of raters (they may be different people for each unit).","Like Cohen's kappa, it depends on category prevalence."],r:"All units have the same number of classifications."}},

 en:{d:"1 yes/no dependent variable and several independent variables.",s:[IND_EN,"Linear relationship between each quantitative variable and the logit of the event.","No strong collinearity.","Enough events: a rule of thumb of about 10 per parameter (Peduzzi et al., 1996).","It does not assume normality."],r:"Calibration (Hosmer-Lemeshow), the form of quantitative variables and VIF (Hosmer et al., 2013)."}},
logcond:{t:["emparej","logit"],k:0,es:{d:"Resultado sí/no en conjuntos emparejados y varias independientes.",s:["Los conjuntos emparejados son independientes entre sí; dentro de cada conjunto, casos y controles están relacionados.","Relación lineal entre cada variable cuantitativa y el logit.","Solo aportan información los conjuntos que difieren en la exposición."],r:"Cuántos conjuntos son discordantes en la exposición."},
 en:{d:"Yes/no outcome in matched sets and several independent variables.",s:["Matched sets are independent of one another; within each set, cases and controls are related.","Linear relationship between each quantitative variable and the logit.","Only sets that differ in exposure contribute information."],r:"How many sets are discordant on exposure."}},
logm:{t:["ind","oddsprop"],k:1,es:{d:"1 variable dependiente con 3 o más categorías y varias independientes.",s:[IND_ES,"Ordinal: odds proporcionales (el efecto de cada variable es el mismo en todos los puntos de corte).","Multinomial: independencia de alternativas irrelevantes (la razón entre dos categorías no cambia si se agrega o quita otra).","Suficientes casos en cada categoría."],r:"Prueba de odds proporcionales en el modelo ordinal."},
 en:{d:"1 dependent variable with 3 or more categories and several independent variables.",s:[IND_EN,"Ordinal: proportional odds (each variable's effect is the same at every cutpoint).","Multinomial: independence of irrelevant alternatives (the ratio between two categories does not change if another is added or removed).","Enough cases in each category."],r:"A proportional odds test in the ordinal model."}},
pois:{t:["ind","equidisp"],k:1,es:{d:"1 conteo (o variable sí/no) y varias independientes.",s:[IND_ES,"Poisson: la varianza del conteo es igual a su media (equidispersión); si es mayor, binomial negativa o errores robustos.","Si las unidades tienen distinto tiempo de exposición, se incluye como desplazamiento (offset).","Para la razón de prevalencia con un evento sí/no: Poisson con varianza robusta (Zou, 2004)."],r:"Comparar la varianza con la media, o la desviación del modelo con sus grados de libertad."},
 en:{d:"1 count (or yes/no variable) and several independent variables.",s:[IND_EN,"Poisson: the count's variance equals its mean (equidispersion); if larger, negative binomial or robust errors.","If units have different exposure times, it is included as an offset.","For prevalence ratios with a yes/no event: Poisson with robust variance (Zou, 2004)."],r:"Compare the variance with the mean, or the model deviance with its degrees of freedom."}},
mix:{t:["agrup","faltantes"],k:1,es:{d:"Datos repetidos o agrupados y varias independientes.",s:["Las unidades o grupos son independientes entre sí; las observaciones de un mismo grupo sí están relacionadas.","Modelos mixtos: válidos si los datos faltantes dependen solo de lo observado (faltantes al azar); GEE requiere que falten completamente al azar.","Modelos mixtos: efectos aleatorios y residuos aproximadamente normales.","La estructura de correlación elegida es razonable."],r:"Residuos, y cómo y por qué faltan datos (Fitzmaurice et al., 2011)."},
 en:{d:"Repeated or clustered data and several independent variables.",s:["Units or groups are independent of one another; observations within a group are related.","Mixed models: valid if missingness depends only on observed data (missing at random); GEE requires data missing completely at random.","Mixed models: approximately normal random effects and residuals.","The chosen correlation structure is reasonable."],r:"Residuals, and how and why data are missing (Fitzmaurice et al., 2011)."}},
cox:{t:["propriesg","censura"],k:0,es:{d:"Tiempo hasta el evento, el evento y varias independientes.",s:["Riesgos proporcionales: la razón de riesgos (HR) entre grupos es constante en el tiempo.","Censura no informativa.","Relación lineal entre las variables cuantitativas y el logaritmo del riesgo.",IND_ES],r:"Residuos de Schoenfeld o gráfico log(−log) (Kleinbaum y Klein, 2012)."},
 en:{d:"Time to event, the event and several independent variables.",s:["Proportional hazards: the hazard ratio (HR) between groups is constant over time.","Noninformative censoring.","Linear relationship between quantitative variables and the log hazard.",IND_EN],r:"Schoenfeld residuals or the log(−log) plot (Kleinbaum & Klein, 2012)."}},
panel:{t:["exog","agrup"],k:0,es:{d:"Las mismas unidades observadas en varios periodos.",s:["Efectos fijos: las variables explicativas no se relacionan con los errores de ningún periodo (exogeneidad estricta).","Efectos aleatorios: además, las características fijas de cada unidad no se relacionan con las variables explicativas.","Las observaciones de una misma unidad están correlacionadas: errores estándar agrupados por unidad."],r:"Prueba de Hausman para elegir entre efectos fijos y aleatorios (Wooldridge, 2010)."},
 en:{d:"The same units observed over several periods.",s:["Fixed effects: the explanatory variables are unrelated to the errors in every period (strict exogeneity).","Random effects: in addition, each unit's fixed characteristics are unrelated to the explanatory variables.","Observations of the same unit are correlated: standard errors clustered by unit."],r:"The Hausman test to choose between fixed and random effects (Wooldridge, 2010)."}},
did:{t:["tendpar"],k:0,es:{d:"Grupo tratado y de comparación, antes y después de una intervención.",s:["Tendencias paralelas: sin la intervención, los dos grupos habrían cambiado igual.","La composición de los grupos no cambia por la intervención y nada más ocurre al mismo tiempo solo en un grupo.","Errores estándar agrupados por unidad cuando hay varias observaciones por unidad."],r:"Comparar las tendencias de los dos grupos en los periodos previos (Angrist y Pischke, 2009)."},
 en:{d:"Treated and comparison groups, before and after an intervention.",s:["Parallel trends: without the intervention, both groups would have changed the same way.","Group composition does not change because of the intervention and nothing else happens at the same time in only one group.","Standard errors clustered by unit when there are several observations per unit."],r:"Compare the two groups' trends in the pre-intervention periods (Angrist & Pischke, 2009)."}},
iv:{t:["instr"],k:0,es:{d:"Un resultado, una variable explicativa y un instrumento.",s:["Relevancia: el instrumento se relaciona con la variable explicativa.","Exclusión: el instrumento afecta el resultado solo a través de la variable explicativa.","Independencia: el instrumento es «como si fuera aleatorio».","Monotonicidad: el instrumento no empuja a nadie en sentido contrario (Angrist et al., 1996)."],r:"El F de la primera etapa para la relevancia; la exclusión se argumenta con el conocimiento del tema."},
 en:{d:"An outcome, an explanatory variable and an instrument.",s:["Relevance: the instrument is related to the explanatory variable.","Exclusion: the instrument affects the outcome only through the explanatory variable.","Independence: the instrument is “as good as random”.","Monotonicity: the instrument pushes no one in the opposite direction (Angrist et al., 1996)."],r:"The first-stage F for relevance; exclusion is argued from subject-matter knowledge."}},
roc:{t:["refstd"],k:0,es:{d:"1 resultado sí/no y 1 puntaje.",s:["El resultado de referencia clasifica correctamente.","Si el puntaje viene de un modelo, el AUC se evalúa en datos que no se usaron para construirlo.",IND_ES],r:"De dónde salen los datos con que se calcula el AUC."},
 en:{d:"1 yes/no outcome and 1 score.",s:["The reference outcome classifies correctly.","If the score comes from a model, the AUC is evaluated on data not used to build it.",IND_EN],r:"Where the data used to compute the AUC come from."}},
disc:{t:["ind","normmult","homocov"],k:2,es:{d:"1 variable de grupos y varias predictoras cuantitativas.",s:[IND_ES,"Normalidad multivariada de las predictoras en cada grupo.","Matrices de covarianza iguales entre grupos (análisis lineal).","Es sensible a valores extremos y a la colinealidad."],r:"Prueba M de Box y porcentaje de bien clasificados con validación cruzada."},
 en:{d:"1 grouping variable and several quantitative predictors.",s:[IND_EN,"Multivariate normality of the predictors in each group.","Equal covariance matrices across groups (linear analysis).","It is sensitive to extreme values and collinearity."],r:"Box's M test and the percentage correctly classified with cross-validation."}},
arbol:{t:["valid"],k:0,es:{d:"1 resultado y muchas predictoras.",s:["El desempeño se evalúa en datos que no se usaron para entrenar el modelo (validación cruzada o datos reservados).",IND_ES,"No supone normalidad ni linealidad."],r:"El error o el AUC en los datos de validación (Hastie et al., 2009)."},

arima:{t:["estac"],k:0,es:{d:"1 variable medida a intervalos regulares.",s:["Estacionariedad: media y varianza constantes en el tiempo, o que se logren al diferenciar la serie.","Residuos sin autocorrelación (ruido blanco) y con varianza constante."],r:"Gráficos de autocorrelación (ACF y PACF) y prueba de Ljung-Box en los residuos (Box et al., 2015)."},
 en:{d:"1 variable measured at regular intervals.",s:["Stationarity: constant mean and variance over time, or achieved by differencing the series.","Residuals with no autocorrelation (white noise) and constant variance."],r:"Autocorrelation plots (ACF and PACF) and the Ljung-Box test on the residuals (Box et al., 2015)."}},
meta:{t:["comparab"],k:0,es:{d:"Tamaños del efecto y sus errores estándar de varios estudios.",s:["Los estudios miden el mismo efecto en una métrica comparable y son independientes entre sí.","Efectos aleatorios: los efectos verdaderos varían entre estudios alrededor de un promedio.","Los estudios incluidos no están sesgados por la publicación selectiva de resultados."],r:"I² y gráfico de bosque para la heterogeneidad; gráfico de embudo para el sesgo de publicación (Borenstein et al., 2009)."},

sem:{t:["normmult","especif"],k:1,es:{d:"Variables observadas y latentes con relaciones propuestas por la teoría.",s:["Máxima verosimilitud: normalidad multivariada; si no, estimadores robustos.","El modelo está bien especificado e identificado.","Muestra grande."],r:"Índices de ajuste (Hu y Bentler, 1999) y residuos del modelo (Kline, 2016)."},

afc:{t:["normmult","especif"],k:1,es:{d:"Ítems de una escala y un modelo teórico de dimensiones.",s:["Máxima verosimilitud: normalidad multivariada; con ítems ordinales, estimadores para datos categóricos.","La estructura propuesta está bien especificada: cada ítem carga en su dimensión y los errores no se correlacionan salvo que el modelo lo indique.","Muestra grande."],r:"Índices de ajuste e índices de modificación (Hu y Bentler, 1999)."},

rasch:{t:["unidim","indloc"],k:1,es:{d:"Respuestas a los ítems de una prueba o escala.",s:["Unidimensionalidad: los ítems miden un solo rasgo.","Independencia local: dado el nivel del rasgo, la respuesta a un ítem no depende de las demás.","Todos los ítems discriminan igual (propio del modelo de Rasch)."],r:"Estadísticos de ajuste infit y outfit de ítems y personas (Embretson y Reise, 2000)."},

alfa:{t:["unidim","tau"],k:1,es:{d:"Ítems de una escala.",s:["Unidimensionalidad: los ítems miden un solo rasgo.","Tau-equivalencia: todos los ítems pesan igual sobre el rasgo; si no, el omega es más adecuado.","Errores de los ítems no correlacionados entre sí."],r:"Análisis factorial antes de calcular el alfa."},

 p had been ≥ .05, there would be no evidence that the mean differs from the reference value."]},"soc":{"es":["Determinar si la resiliencia media de los participantes difiere del valor normativo de la escala (70 puntos).","Resiliencia de 40 participantes: media 74,0 puntos (DE 7,9) frente a 70 puntos; t(39) = 3,23; p = 0,003; d = 0,51.","Como p < 0,05, la resiliencia media es diferente del valor de referencia: es mayor. El tamaño del efecto es mediano (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de que la media difiera del valor de referencia."],"en":["Determine whether participants' mean resilience differs from the scale's normative value (70 points).","Resilience of 40 participants: M = 74.0 puntos (SD = 7.9) vs. 70 puntos; t(39) = 3.23, p = .003, d = 0.51.","Because p < .05, mean resilience differs from the reference value: it is higher. The effect size is medium (Cohen, 1988).","If p had been ≥ .05, there would be no evidence that the mean differs from the reference value."]},"adm":{"es":["Determinar si el tiempo medio de atención difiere de la meta de 8 minutos.","Tiempo de 40 atenciones: media 9,10 minutos (DE 2,63) frente a 8 minutos; t(39) = 2,65; p = 0,012; d = 0,42.","Como p < 0,05, el tiempo medio de atención es diferente del valor de referencia: es mayor (supera la meta). El tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, no habría evidencia de que la media difiera del valor de referencia."],"en":["Determine whether mean service time differs from the 8-minute target.","Time for 40 service calls: M = 9.10 minutos (SD = 2.63) vs. 8 minutos; t(39) = 2.65, p = .012, d = 0.42.","Because p < .05, mean service time differs from the reference value: it is higher (it exceeds the target). The effect size is small (Cohen, 1988).","If p had been ≥ .05, there would be no evidence that the mean differs from the reference value."]},"eco":{"es":["Determinar si la inflación mensual promedio de 40 ciudades difiere de la meta de 0,  con la esperada."],"en":["Examine whether the blood types of 300 donors are distributed as in the national population.","χ²(3) = 10.85, p = .013, w = 0.19. Largest gap: observed 52.0% vs. expected 61% in one category.","Because p < .05, the blood types in the sample are distributed differently from what was expected. The effect size is small (Cohen, 1988).","If p had been ≥ .05, the observed distribution would be compatible with the expected one."]},"edu":{"es":["Examinar si los estudiantes de la muestra se reparten por estrato (1 a 4) como en la matrícula total.","χ²(3) = 13,67; p = 0,003; w = 0,21. Mayor diferencia: observado 16,0 % frente a esperado 10 % en una categoría.","Como p < 0,05, la muestra se reparte por estrato de forma diferente a lo esperado. El tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, la distribución observada sería compatible con la esperada."],"en":["Examine whether sampled students are distributed by socioeconomic stratum (1–4) as in total enrollment.","χ²(3) = 13.67, p = .003, w = 0.21. Largest gap: observed 16.0% vs. expected 10% in one category.","Because p < .05, the sample is distributed by stratum differently from what was expected. The effect size is small (Cohen, 1988).","If p had been ≥ .05, the observed distribution would be compatible with the expected one."]},"soc":{"es":["Examinar si la muestra de la encuesta se reparte por grupos de edad como la población del censo.","χ²(3) = 14,66; p = 0,002; w = 0,19. Mayor diferencia: observado 21,8 % frente a esperado 30 % en una categoría.","Como p < 0,05, la muestra se reparte por edad de forma diferente a lo esperado. El tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, la distribución observada sería compatible con la esperada."],"en":["Examine whether the survey sample is distributed by age group as in the census population.","χ²(3) = 14.66, p = .002, w = 0.19. Largest gap: observed 21.8% vs. expected 30% in one category.","Because p < . ; p = 0,004; w = 0,29. Mayor diferencia: observado 36,9 % frente a esperado 25 % en una categoría.","Como p < 0,05, las fallas se reparten de forma diferente a lo esperado. El tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, la distribución observada sería compatible con la esperada."],"en":["Examine whether failures are evenly distributed across the four production shifts.","χ²(3) = 13.30, p = .004, w = 0.29. Largest gap: observed 36.9% vs. expected 25% in one category.","Because p < .05, failures are distributed differently from what was expected. The effect size is small (Cohen, 1988).","If p had been ≥ .05, the observed distribution would be compatible with the expected one."]},"der":{"es":["Examinar si las demandas se reparten por igual entre los cuatro juzgados del circuito.","χ²(3) = 14,20; p = 0,003; w = 0,23. Mayor diferencia: observado 33,2 % frente a esperado 25 % en una categoría.","Como p < 0,05, las demandas se reparten de forma diferente a lo esperado. El tamaño del efecto es pequeño (Cohen, 1988).","Si p hubiera sido ≥ 0,05, la distribución observada sería compatible con la esperada."],"en":["Examine whether lawsuits are evenly distributed across the four courts in the circuit.","χ²(3) = 14.20, p = .003, w = 0.23. Largest gap: observed 33.2% vs. expected 25% in one category.","Because p < .05, lawsuits are distributed differently from what was expected. The effect size is small (Cohen, 1988).","If p had been ≥ .05, the observed distribution would be compatible with the expected one."]}},"control":{"sal":{"es":["Examinar la estabilidad del tiempo de espera diario en urgencias.","Gráfico de individuos: línea central 45,9 minutos; límite superior de control 68,2 minutos; 2 de 30 días por encima del límite.","El proceso no está bajo control estadístico: en esos 2 días hubo causas especiales de variación que conviene investigar.","Si todos los puntos hubieran quedado dentro de los límites y sin patrones, el proceso se consideraría e s would be considered stable."]},"adm":{"es":["Examinar la estabilidad del tiempo de atención por llamada.","Gráfico X̄-R: línea central 6,108 minutos; límite superior de control 7,889 minutos; 2 de 25 subgrupos de 5 llamadas por encima del límite.","El proceso no está bajo control estadístico: en esos 2 subgrupos hubo causas especiales de variación que conviene investigar.","Si todos los puntos hubieran quedado dentro de los límites y sin patrones, el proceso se consideraría estable."],"en":["Examine the stability of handling time per call.","X̄-R chart: center line 6.108 minutes; upper control limit 7.889 minutes; 2 of 25 subgroups of 5 calls above the limit.","The process is not in statistical control: those 2 subgroups show special causes of variation worth investigating.","If all points had stayed within the limits with no patterns, the process would be considered stable."]},"eco":{"es":["Examinar la estabilidad de la proporción diaria de transacciones rechazadas en el sistema de pagos.","Gráfico p: línea central 3,1 %; límite superior de control 4,2 %; 2 de 60 días por encima del límite.","El proceso no está bajo control estadístico: en esos 2 días hubo causas especiales de variación que conviene investigar.","Si todos los puntos hubieran quedado dentro de los límites y sin patrones, el proceso se consideraría estable."],"en":["Examine the stability of the daily proportion of rejected payment transactions.","p chart: center line 3.1%; upper control limit 4.2%; 2 of 60 days above the limit.","The process is not in statistical control: those 2 days show special causes of variation worth investigating.","If all points had stayed within the limits with no patterns, the process would be considered stable."]},"ing":{"es":["Examinar la estabilidad del diámetro de los ejes torneados.","Gráfico X̄-R: línea central 25,002 mm; límite superior de control 25,014 mm; 2 de 25 subgrupos de 5 ejes por encima del límite.","El proceso no está bajo control estadístico: en esos 2 Cpk had also been above 1.33, the process would be capable and centered."]}},"tabla":{"sal":{"es":["Describir la frecuencia de anemia según la zona de residencia.","Anemia: 42 de 90 en zona rural (46,7 %) y 24 de 119 en zona urbana (20,2 %).","La anemia es más frecuente en la zona rural (26,5 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe the frequency of anemia by area of residence.","Anemia: 42 of 90 in the rural area group (46.7%) and 24 of 119 in the urban area group (20.2%).","Anemia is more frequent in the rural area (26.5 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"edu":{"es":["Describir la repitencia según la jornada escolar.","Repitencia: 25 de 150 en jornada de la tarde (16,7 %) y 16 de 180 en jornada de la mañana (8,9 %).","La repitencia es más frecuente en la jornada de la tarde (7,8 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe grade repetition by school shift.","Grade repetition: 25 of 150 in the afternoon shift group (16.7%) and 16 of 180 in the morning shift group (8.9%).","Repetition is more frequent in the afternoon shift (7.8 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"soc":{"es":["Describir la victimización según la zona de residencia.","Victimización: 63 de 200 en zona urbana (31,5 %) y 24 de 150 en zona rural (16,0 %).","La victimización es más frecuente en la zona urbana (15,5 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe victimization by area of residence.","Victimization: 63 of 200 in the urban area group (31.5%) and 24 of 150 in the rural area group (16.0%).","Victimization is more frequent in the urban area (15.5 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"adm":{"es":["Describir la renuncia según la modalidad de trabajo.","Renuncia: 21 de 120 en modalidad presencial (17,5 %) y 12 de 130 en modalidad remota (9,2 %).","La renuncia es más frecuente en la modalidad presencial (8,3 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe resignation by work arrangement.","Resignation: 21 of 120 in the on-site work group (17.5%) and 12 of 130 in the remote work group (9.2%).","Resignation is more frequent among on-site workers (8.3 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"eco":{"es":["Describir el acceso a crédito formal según el sexo de la jefatura del hogar.","Acceso a crédito: 184 de 500 en jefe hombre (36,8 %) y 92 de 500 en jefa mujer (18,4 %).","El acceso es mayor en los hogares con jefe hombre (18,4 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe access to formal credit by sex of the household head.","Credit access: 184 of 500 in the male head group (36.8%) and 92 of 500 in the female head group (18.4%).","Access is higher in male-headed households (18.4 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"ing":{"es":["Describir la proporción de defectos según el proveedor del material.","Defectos: 17 de 300 en proveedor A (5,7 %) y 9 de 300 en proveedor B (3,0 %).","El proveedor A tiene más defectos (2,7 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe the defect rate by material supplier.","Defects: 17 of 300 in the supplier A group (5.7%) and 9 of 300 in the supplier B group (3.0%).","Supplier A has more defects (2.7 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]},"der":{"es":["Describir el sentido del fallo según el tipo de defensa.","Condena: 73 de 100 en defensa pública (73,0 %) y 44 de 90 en defensa privada (48,9 %).","Las condenas son más frecuentes con defensa pública (24,1 puntos porcentuales más). Todavía es una descripción: hace falta una prueba (chi-cuadrado) para saber si la diferencia es estadísticamente significativa."],"en":["Describe case outcomes by type of defense.","Conviction: 73 of 100 in the public defender group (73.0%) and 44 of 90 in the private attorney group (48.9%).","Convictions are more frequent with a public defender (24.1 percentage points more). This is still a description: a test (chi-square) is needed to know whether the difference is statistically significant."]}},"grupos":{"sal":{"es":["Caracterizar a los casos y los controles según la edad.","Edad (n = 60 por grupo): los casos 43,5 ± 10,5; los controles 41,7 ± 10,1 años.","La media de los casos es 1,8 años mayor que la de los controles. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Characterize cases and controls by age.","Age (n = 60 per group): cases M = 43.5, SD = 10.5; controls M = 41.7, SD = 10.1 years.","The mean for cases is 1.8 years higher than for controls. Without a statistical test, we cannot say the difference is significant."]},"edu":{"es":["Describir el puntaje de lectura según el tipo de colegio.","Puntaje (n = 60 por grupo): los colegios privados 64,9 ± 11,2; los colegios públicos 58,7 ± 11,6 puntos.","La media de los colegios privados es 6,2 puntos mayor que la de los colegios públicos. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe reading scores by type of school.","Score (n = 60 per group): private schools M = 64.9, SD = 11.2; public schools M = 58.7, SD = 11.6 points.","The mean for private schools is 6.2 points higher than for public schools. Without a statistical test, we cannot say the difference is significant."]},"soc":{"es":["Describir el nivel de ansiedad según el sexo.","Ansiedad (n = 60 por grupo): las mujeres 24,4 ± 5,8; los hombres 19,6 ± 6,6 puntos.","La media de las mujeres es 4,8 puntos mayor que la de los hombres. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe anxiety level by sex.","Anxiety (n = 60 per group): women M = 24.4, SD = 5.8; men M = 19.6, SD = 6.6 points.","The mean for women is 4.8 points higher than for men. Without a statistical test, we cannot say the difference is significant."]},"adm":{"es":["Describir el salario según la sede.","Salario (n = 60 por grupo): la sede norte 3,44 ± 0,73; la sede sur 3,19 ± 0,73 millones de pesos.","La media de la sede norte es 0,25 millones de pesos mayor que la de la sede sur. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe salary by site.","Salary (n = 60 per group): the north site M = 3.44, SD = 0.73; the south site M = 3.19, SD = 0.73 million pesos.","The mean for the north site is 0.25 million pesos higher than for the south site. Without a statistical test, we cannot say the difference is significant."]},"eco":{"es":["Describir el ingreso por hora según la formalidad del empleo.","Ingreso por hora (n = 60 por grupo): los trabajadores formales 12.300 ± 2.540; los trabajadores informales 8.554 ± 2.734 pesos.","La media de los trabajadores formales es 3.746 pesos mayor que la de los trabajadores informales. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe hourly earnings by job formality.","Hourly earnings (n = 60 per group): formal workers M = 12,300, SD = 2,540; informal workers M = 8,554, SD = 2,734 pesos.","The mean for formal workers is 3,746 pesos higher than for informal workers. Without a statistical test, we cannot say the difference is significant."]},"ing":{"es":["Describir el consumo energético según el turno.","Consumo (n = 60 por grupo): el turno de la noche 434 ± 35; el turno de la mañana 419 ± 42 kWh.","La media del turno de la noche es 15 kWh mayor que la del turno de la mañana. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe energy use by shift.","Energy use (n = 60 per group): the night shift M = 434, SD = 35; the morning shift M = 419, SD = 42 kWh.","The mean for the night shift is 15 kWh higher than for the morning shift. Without a statistical test, we cannot say the difference is significant."]},"der":{"es":["Describir la edad de las víctimas según el tipo de delito.","Edad (n = 60 por grupo): las víctimas de hurto 36,0 ± 11,2; las víctimas de estafa 45,2 ± 11,6 años.","La media de las víctimas de hurto es 9,2 años menor que la de las víctimas de estafa. Sin una prueba estadística no se puede afirmar que la diferencia sea significativa."],"en":["Describe victims' age by type of crime.","Age (n = 60 per group): theft victims M = 36.0, SD = 11.2; fraud victims M = 45.2, SD = 11.6 years.","The mean for theft victims is 9.2 years lower than for fraud victims. Without a statistical test, we cannot say the difference is significant."]}},"km":{"sal":{"es":["Estimar la supervivencia global a 2 años de pacientes con cáncer de mama.","n = 200; 108 eventos; S(24 meses) = 64,0 % (IC 95 %: 56,9–70,2); tiempo mediano hasta el evento 36,8 meses.","A los 24 meses, 64 de cada 100 seguían vivas. La mitad ya había tenido el evento a los 36,8 meses."],"en":["Estimate 2-year overall survival in breast cancer patients.","n = 200; 108 events; S(24 months) = 64.0% (95% CI [56.9, 70.2]); median time to event 36.8 months.","At 24 months, 64 in 100 were alive. Half had experienced the event by 36.8 months."]},"edu":{"es":["Estimar la permanencia de los estudiantes a lo largo de la carrera.","n = 400; 233 eventos; S(2 semestres) = 74,8 % (IC 95 %: 70,2–78,7); tiempo mediano hasta el evento 6 semestres.","A los 2 semestres, 75 de cada 100 seguían matriculados. La mitad ya había tenido el evento a los 6 semestres."],"en":["Estimate student retention throughout the degree program.","n = 400; 233 events; S(2 semesters) = 74.8% (95% CI [70.2, 78.7]); median time to event 6 semesters.","At 2 semesters, 75 in 100 were still enrolled. Half had experienced the event by 6 semesters."]},"soc":{"es":["Estimar el tiempo hasta la recaída después del tratamiento por consumo de sustancias.","n = 180; 100 eventos; S(6 meses) = 62,2 % (IC 95 %: 54,7–68,8); tiempo mediano hasta el evento 10,2 meses.","A los 6 meses, 62 de cada 100 no habían recaído. La mitad ya había tenido el evento a los 10,2 meses."],"en":["Estimate time to relapse after substance-use treatment.","n = 180; 100 events; S(6 months) = 62.2% (95% CI [54.7, 68.8]); median time to event 10.2 months.","At 6 months, 62 in 100 had not relapsed. Half had experienced the event by 10.2 months."]},"adm":{"es":["Estimar la permanencia de los empleados nuevos.","n = 300; 177 eventos; S(12 meses) = 71,3 % (IC 95 %: 65,9–76,1); tiempo mediano hasta el evento 26,9 meses.","A los 12 meses, 71 de cada 100 seguían en la empresa. La mitad ya había tenido el evento a los 26,9 meses."],"en":["Estimate retention of new employees.","n = 300; 177 events; S(12 months) = 71.3% (95% CI [65.9, 76.1]); median time to event 26.9 months.","At 12 months, 71 in 100 were still with the company. Half had experienced the event by 26.9 months."]},"eco":{"es":["Estimar la supervivencia de las empresas creadas en 2018.","n = 500; 303 eventos; S(3 años) = 49,4 % (IC 95 %: 44,9–53,8); tiempo mediano hasta el evento 3,0 años.","A los 3 años, 49 de cada 100 seguían activas. La mitad ya había tenido el evento a los 3,0 años."],"en":["Estimate survival of firms created in 2018.","n = 500; 303 events; S(3 years) = 49.4% (95% CI [44.9, 53.8]); median time to event 3.0 years.","At 3 years, 49 in 100 were still active. Half had experienced the event by 3.0 years."]},"ing":{"es":["Estimar el tiempo hasta la primera falla de las bombas centrífugas.","n = 120; 60 eventos; S(2.000 horas) = 77,5 % (IC 95 %: 68,9–84,0); tiempo mediano hasta el evento 5.012 horas.","A los 2.000 horas, 78 de cada 100 no habían fallado. La mitad ya había tenido el evento a los 5.012 horas."],"en":["Estimate time to first failure of centrifugal pumps.","n = 120; 60 events; S(2,000 hours) = 77.5% (95% CI [68.9, 84.0]); median time to event 5,012 hours.","At 2,000 hours, 78 in 100 had not failed. Half had experienced the event by 5,012 hours."]},"der":{"es":["Estimar el tiempo hasta la reincidencia de las personas que salen de prisión.","n = 300; 75 eventos; S(12 meses) = 85,3 % (IC 95 %: 80,8–88,9); la mediana no se alcanzó en el seguimiento.","A los 12 meses, 85 de cada 100 no habían reincidido. Al terminar el seguimiento, menos de la mitad había tenido el evento; por eso no hay mediana."],"en":["Estimate time to reoffending among people released from prison.","n = 300; 75 events; S(12 months) = 85.3% (95% CI [80.8, 88.9]); the median was not reached during follow-up.","At 12 months, 85 in 100 had not reoffended. By the end of follow-up, fewer than half had experienced the event, so there is no median."]}},"weibull":{"sal":{"es":["Caracterizar la vida útil de las bombas de infusión del hospital.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 2,19; vida característica η = 6.017 horas de uso.","β mayor que 1: el riesgo de falla aumenta con el uso (desgaste). Al llegar a 6.017 horas de uso, cerca del 63 % de las bombas habrá fallado."],"en":["Characterize the service life of the hospital's infusion pumps.","80 observed times, maximum-likelihood Weibull fit: shape β = 2.19; characteristic life η = 6,017 hours of use.","β greater than 1: the failure risk increases with use (wear-out). By about 6,017 hours of use, roughly 63% of the pumps will have failed."]},"edu":{"es":["Caracterizar la vida útil de los computadores de las salas de informática.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 1,87; vida característica η = 4,2 años.","β mayor que 1: el riesgo de falla aumenta con los años de uso (desgaste). Al llegar a 4,2 años, cerca del 63 % de los equipos habrá fallado."],"en":["Characterize the service life of computer-lab computers.","80 observed times, maximum-likelihood Weibull fit: shape β = 1.87; characteristic life η = 4.2 years.","β greater than 1: the failure risk increases with years of use (wear-out). By about 4.2 years, roughly 63% of the computers will have failed."]},"soc":{"es":["Describir el tiempo hasta el abandono de la terapia psicológica.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 0,67; vida característica η = 11,9 sesiones.","β menor que 1: el riesgo de abandono es mayor al inicio y disminuye después. Al llegar a 11,9 sesiones, cerca del 63 % ha abandonado."],"en":["Describe time to dropout from psychological therapy.","80 observed times, maximum-likelihood Weibull fit: shape β = 0.67; characteristic life η = 11.9 sessions.","β less than 1: the risk of dropout is highest at the start and then declines. By about 11.9 sessions, roughly 63% have dropped out."]},"adm":{"es":["Caracterizar la vida útil de la flota de vehículos de reparto.","80 tiempos observados, ajuste de Weibull por máxima verosimilitud: forma β = 2,69; vida característica η = 186.482 km.","β mayor que 1: el riesgo de una falla grave aumenta con el kilometraje (desgaste). Al llegar a 186.482 km, cer
