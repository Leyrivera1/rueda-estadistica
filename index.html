anización.","Productividad (unidades/hora), 30 equipos medidos 3 veces: trimestre 1 40,6; trimestre 2 44,4; trimestre 3 46,0; Mauchly W = 0,87, p = 0,14 (se cumple la esfericidad); F(2, 58) = 11,77; p < 0,001; η² parcial = 0,29.","Como p < 0,05, hubo cambios a lo largo del tiempo: la productividad aumentó trimestre a trimestre. Como Mauchly no fue significativo, no se necesitó la corrección de Greenhouse-Geisser.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio en el tiempo."],"en":["Compare productivity in the three quarters after the reorganization.","Productivity (units/hour), 30 teams measured 3 times: Q1 40.6; Q2 44.4; Q3 46.0; Mauchly's W = .87, p = .14 (sphericity holds); F(2, 58) = 11.77, p < .001, partial η² = .29.","Because p < .05, there were changes over time: productivity rose quarter by quarter. Because Mauchly's test was not significant, no Greenhouse-Geisser correction was needed.","If p had been ≥ .05, there would be no evidence of change over time."]},"eco":{"es":["Comparar el costo de la canasta básica en tres trimestres.","Costo (miles de pesos), 30 ciudades medidos 3 veces: trimestre 1 419; trimestre 2 429; trimestre 3 440; Mauchly W = 0,89, p = 0,19 (se cumple la esfericidad); F(2, 58) = 13,78; p < 0,001; η² parcial = 0,32.","Como p < 0,05, hubo cambios a lo largo del tiempo: el costo aumentó en el periodo. Como Mauchly no fue significativo, no se necesitó la corrección de Greenhouse-Geisser.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio en el tiempo."],"en":["Compare the cost of the basic food basket over three quarters.","Cost (thousand pesos), 30 cities measured 3 times: Q1 419; Q2 429; Q3 440; Mauchly's W = .89, p = .19 (sphericity holds); F(2, 58) = 13.78, p < .001, partial η² = .32.","Because p < .05, there were changes over time: the cost rose over the period. Because Mauchly's test was not significant, no Greenhouse-Geisser correction was needed.","If p had been ≥ .05, there would be no evidence of change over time."]},"ing":{"es":["Comparar la eficiencia de los motores a 1, 6 y 12 meses de operación.","Eficiencia (%), 30 motores medidos 3 veces: 1 mes 90,5; 6 meses 89,9; 12 meses 88,3; Mauchly W = 0,97, p = 0,69 (se cumple la esfericidad); F(2, 58) = 5,76; p = 0,005; η² parcial = 0,17.","Como p < 0,05, hubo cambios a lo largo del tiempo: la eficiencia disminuyó con el tiempo de operación. Como Mauchly no fue significativo, no se necesitó la corrección de Greenhouse-Geisser.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio en el tiempo."],"en":["Compare motor efficiency at 1, 6, and 12 months of operation.","Efficiency (%), 30 motors measured 3 times: 1 month 90.5; 6 months 89.9; 12 months 88.3; Mauchly's W = .97, p = .69 (sphericity holds); F(2, 58) = 5.76, p = .005, partial η² = .17.","Because p < .05, there were changes over time: efficiency declined with operating time. Because Mauchly's test was not significant, no Greenhouse-Geisser correction was needed.","If p had been ≥ .05, there would be no evidence of change over time."]},"der":{"es":["Comparar la carga de procesos por despacho en tres años.","Procesos por despacho, 30 despachos medidos 3 veces: año 1 608; año 2 588; año 3 547; Mauchly W = 0,96, p = 0,56 (se cumple la esfericidad); F(2, 58) = 10,77; p < 0,001; η² parcial = 0,27.","Como p < 0,05, hubo cambios a lo largo del tiempo: la carga disminuyó. Como Mauchly no fue significativo, no se necesitó la corrección de Greenhouse-Geisser.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio en el tiempo."],"en":["Compare caseload per court office over three years.","Cases per office, 30 offices measured 3 times: year 1 608; year 2 588; year 3 547; Mauchly's W = .96, p = .56 (sphericity holds); F(2, 58) = 10.77, p < .001, partial η² = .27.","Because p < .05, there were changes over time: caseload decreased. Because Mauchly's test was not significant, no Greenhouse-Geisser correction was needed.","If p had been ≥ .05, there would be no evidence of change over time."]}},"fried":{"sal":{"es":["Comparar la intensidad del dolor a las 6, 12 y 24 horas posoperatorias.","Dolor (0–10), 20 pacientes, medianas: 6 h 6,5; 12 h 5; 24 h 3; Friedman χ²(2) = 39,00; p < 0,001; W de Kendall = 0,98.","Como p < 0,05, hubo cambios entre las mediciones: el dolor disminuyó con el tiempo.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare pain intensity at 6, 12, and 24 hours after surgery.","Pain (0–10), 20 patients, medians: 6 h 6.5; 12 h 5; 24 h 3; Friedman χ²(2) = 39.00, p < .001, Kendall's W = .98.","Because p < .05, there were changes across measurements: pain decreased over time.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"edu":{"es":["Comparar la ansiedad ante los exámenes antes, durante y después de los parciales.","Ansiedad (10–40), 20 estudiantes, medianas: antes 18; durante 23; después 15; Friedman χ²(2) = 28,62; p < 0,001; W de Kendall = 0,72.","Como p < 0,05, hubo cambios entre las mediciones: la ansiedad subió durante los parciales y bajó después.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare test anxiety before, during, and after midterms.","Anxiety (10–40), 20 students, medians: before 18; during 23; after 15; Friedman χ²(2) = 28.62, p < .001, Kendall's W = .72.","Because p < .05, there were changes across measurements: anxiety rose during midterms and fell afterwards.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"soc":{"es":["Comparar la soledad a los 0, 6 y 12 meses del programa.","Soledad (20–80), 20 adultos mayores, medianas: inicio 50; 6 meses 43,5; 12 meses 40,5; Friedman χ²(2) = 17,80; p < 0,001; W de Kendall = 0,44.","Como p < 0,05, hubo cambios entre las mediciones: la soledad disminuyó.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare loneliness at 0, 6, and 12 months of the program.","Loneliness (20–80), 20 older adults, medians: baseline 50; 6 months 43.5; 12 months 40.5; Friedman χ²(2) = 17.80, p < .001, Kendall's W = .44.","Because p < .05, there were changes across measurements: loneliness decreased.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"adm":{"es":["Comparar la satisfacción de los clientes en tres trimestres.","Satisfacción (1–10), 20 clientes corporativos, medianas: trimestre 1 6; trimestre 2 7; trimestre 3 8; Friedman χ²(2) = 25,16; p < 0,001; W de Kendall = 0,63.","Como p < 0,05, hubo cambios entre las mediciones: la satisfacción aumentó.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare customer satisfaction across three quarters.","Satisfaction (1–10), 20 corporate clients, medians: Q1 6; Q2 7; Q3 8; Friedman χ²(2) = 25.16, p < .001, Kendall's W = .63.","Because p < .05, there were changes across measurements: satisfaction increased.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"eco":{"es":["Comparar la percepción de la situación económica en tres rondas de encuesta.","Percepción (1–5), 20 hogares, medianas: ronda 1 4; ronda 2 3; ronda 3 2; Friedman χ²(2) = 28,50; p < 0,001; W de Kendall = 0,71.","Como p < 0,05, hubo cambios entre las mediciones: la percepción empeoró después de la primera ronda.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare perceived economic situation across three survey waves.","Perception (1–5), 20 households, medians: wave 1 4; wave 2 3; wave 3 2; Friedman χ²(2) = 28.50, p < .001, Kendall's W = .71.","Because p < .05, there were changes across measurements: perceptions worsened after the first wave.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"ing":{"es":["Comparar el grado de desgaste a los 3, 6 y 9 meses.","Desgaste (escala 1–5), 20 piezas, medianas: 3 meses 1; 6 meses 2,5; 9 meses 4; Friedman χ²(2) = 37,52; p < 0,001; W de Kendall = 0,94.","Como p < 0,05, hubo cambios entre las mediciones: el desgaste aumentó con el tiempo.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare wear grade at 3, 6, and 9 months.","Wear (1–5 scale), 20 parts, medians: 3 months 1; 6 months 2.5; 9 months 4; Friedman χ²(2) = 37.52, p < .001, Kendall's W = .94.","Because p < .05, there were changes across measurements: wear increased over time.","If p had been ≥ .05, there would be no evidence of change across measurements."]},"der":{"es":["Comparar la confianza en la justicia en tres mediciones.","Confianza (1–10), 20 municipios, medianas: medición 1 4; medición 2 5; medición 3 6; Friedman χ²(2) = 30,33; p < 0,001; W de Kendall = 0,76.","Como p < 0,05, hubo cambios entre las mediciones: la confianza aumentó.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio entre las mediciones."],"en":["Compare trust in the justice system across three measurements.","Trust (1–10), 20 municipalities, medians: time 1 4; time 2 5; time 3 6; Friedman χ²(2) = 30.33, p < .001, Kendall's W = .76.","Because p < .05, there were changes across measurements: trust increased.","If p had been ≥ .05, there would be no evidence of change across measurements."]}},"cochranq":{"sal":{"es":["Comparar la proporción de adherencia al tratamiento al mes 1, 3 y 6.","Adherentes, mismos 50 pacientes: mes 1 78 %; mes 3 68 %; mes 6 46 %; Q de Cochran (2) = 10,31; p = 0,006.","Como p < 0,05, la proporción cambió entre las mediciones: la adherencia disminuyó con el tiempo. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare treatment adherence at months 1, 3, and 6.","Adherent, same 50 patients: month 1 78%; month 3 68%; month 6 46%; Cochran's Q(2) = 10.31, p = .006.","Because p < .05, the proportion changed across measurements: adherence declined over time. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"edu":{"es":["Comparar la asistencia a clase en las semanas 2, 8 y 14 del semestre.","Asisten, mismos 50 estudiantes: semana 2 98 %; semana 8 78 %; semana 14 64 %; Q de Cochran (2) = 17,52; p < 0,001.","Como p < 0,05, la proporción cambió entre las mediciones: la asistencia disminuyó a lo largo del semestre. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare class attendance in weeks 2, 8, and 14.","Attending, same 50 students: week 2 98%; week 8 78%; week 14 64%; Cochran's Q(2) = 17.52, p < .001.","Because p < .05, the proportion changed across measurements: attendance fell over the semester. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"soc":{"es":["Comparar la participación en el grupo de apoyo al mes 1, 3 y 6.","Participan, mismos 50 personas: mes 1 78 %; mes 3 60 %; mes 6 52 %; Q de Cochran (2) = 8,87; p = 0,012.","Como p < 0,05, la proporción cambió entre las mediciones: la participación disminuyó. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare support-group participation at months 1, 3, and 6.","Participating, same 50 people: month 1 78%; month 3 60%; month 6 52%; Cochran's Q(2) = 8.87, p = .012.","Because p < .05, the proportion changed across measurements: participation declined. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"adm":{"es":["Comparar el uso de la nueva herramienta al mes 1, 3 y 6.","La usan, mismos 50 empleados: mes 1 60 %; mes 3 68 %; mes 6 86 %; Q de Cochran (2) = 9,17; p = 0,010.","Como p < 0,05, la proporción cambió entre las mediciones: el uso aumentó con el tiempo. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare use of the new tool at months 1, 3, and 6.","Using it, same 50 employees: month 1 60%; month 3 68%; month 6 86%; Cochran's Q(2) = 9.17, p = .010.","Because p < .05, the proportion changed across measurements: use increased over time. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"eco":{"es":["Comparar la proporción de hogares con ahorro en tres rondas de encuesta.","Con ahorro, mismos 50 hogares: ronda 1 28 %; ronda 2 48 %; ronda 3 62 %; Q de Cochran (2) = 13,27; p = 0,001.","Como p < 0,05, la proporción cambió entre las mediciones: la proporción de hogares con ahorro aumentó. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare the proportion of households saving across three survey waves.","Saving, same 50 households: wave 1 28%; wave 2 48%; wave 3 62%; Cochran's Q(2) = 13.27, p = .001.","Because p < .05, the proportion changed across measurements: the share of households saving increased. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"ing":{"es":["Comparar la proporción de máquinas que pasan la inspección en tres auditorías.","Aprobadas, mismos 50 máquinas: auditoría 1 68 %; auditoría 2 74 %; auditoría 3 92 %; Q de Cochran (2) = 11,70; p = 0,003.","Como p < 0,05, la proporción cambió entre las mediciones: la proporción de máquinas aprobadas aumentó. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare the proportion of machines passing inspection across three audits.","Passing, same 50 machines: audit 1 68%; audit 2 74%; audit 3 92%; Cochran's Q(2) = 11.70, p = .003.","Because p < .05, the proportion changed across measurements: the share of machines passing increased. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]},"der":{"es":["Comparar la proporción de despachos al día en tres cortes semestrales.","Al día, mismos 50 despachos: corte 1 30 %; corte 2 54 %; corte 3 64 %; Q de Cochran (2) = 13,09; p = 0,001.","Como p < 0,05, la proporción cambió entre las mediciones: la proporción de despachos al día aumentó. Para saber entre qué momentos, se compara por pares con McNemar y corrección por comparaciones múltiples.","Si p hubiera sido ≥ 0,05, no habría evidencia de cambio."],"en":["Compare the proportion of court offices up to date across three semesters.","Up to date, same 50 offices: semester 1 30%; semester 2 54%; semester 3 64%; Cochran's Q(2) = 13.09, p = .001.","Because p < .05, the proportion changed across measurements: the share of offices up to date increased. Pairwise McNemar tests with a multiple-comparison correction show which time points differ.","If p had been ≥ .05, there would be no evidence of change."]}},"diag":{"sal":{"es":["Evaluar la sensibilidad y la especificidad de la prueba rápida frente al cultivo.","n = 300 (90 enfermos): VP = 76, FN = 14, FP = 54, VN = 156. Sensibilidad 84,4 % (IC 95 %: 75,6–90,5); especificidad 74,3 % (IC 95 %: 68,0–79,7); VPP 58,5 %; VPN 91,8 %.","La prueba detecta 84 de cada 100 enfermos y descarta correctamente 74 de cada 100 sanos. Con una prevalencia del 30 %, un resultado negativo es muy confiable (VPP 58 %, VPN 92 %)."],"en":["Evaluate the sensitivity and specificity of the rapid test against culture.","n = 300 (90 sick people): TP = 76, FN = 14, FP = 54, TN = 156. Sensitivity 84.4%, 95% CI [75.6, 90.5]; specificity 74.3%, 95% CI [68.0, 79.7]; PPV 58.5%; NPV 91.8%.","The test detects 84 in 100 sick people and correctly rules out 74 in 100 healthy people. With a prevalence of 30%, a negative result is highly reliable (PPV 58%, NPV 92%)."]},"edu":{"es":["Evaluar la exactitud de una prueba de tamizaje de dislexia frente a la evaluación especializada.","n = 500 (46 estudiantes con dislexia): VP = 37, FN = 9, FP = 48, VN = 406. Sensibilidad 80,4 % (IC 95 %: 66,8–89,3); especificidad 89,4 % (IC 95 %: 86,3–91,9); VPP 43,5 %; VPN 97,8 %.","La prueba detecta 80 de cada 100 estudiantes con dislexia y descarta correctamente 89 de cada 100 estudiantes sin dislexia. Con una prevalencia del 9 %, como la dislexia es poco frecuente, muchos positivos son falsos: sirve para tamizar, no para diagnosticar (VPP 44 %, VPN 98 %)."],"en":["Evaluate a dyslexia screening test against specialist assessment.","n = 500 (46 students with dyslexia): TP = 37, FN = 9, FP = 48, TN = 406. Sensitivity 80.4%, 95% CI [66.8, 89.3]; specificity 89.4%, 95% CI [86.3, 91.9]; PPV 43.5%; NPV 97.8%.","The test detects 80 in 100 students with dyslexia and correctly rules out 89 in 100 students without dyslexia. With a prevalence of 9%, because dyslexia is uncommon, many positives are false: it is a screening tool, not a diagnosis (PPV 44%, NPV 98%)."]},"soc":{"es":["Evaluar la exactitud de una escala de tamizaje de depresión frente a la entrevista clínica.","n = 400 (75 personas con depresión): VP = 68, FN = 7, FP = 51, VN = 274. Sensibilidad 90,7 % (IC 95 %: 82,0–95,4); especificidad 84,3 % (IC 95 %: 80,0–87,9); VPP 57,1 %; VPN 97,5 %.","La prueba detecta 91 de cada 100 personas con depresión y descarta correctamente 84 de cada 100 personas sin depresión. Con una prevalencia del 19 %, un resultado negativo descarta bien la depresión (VPP 57 %, VPN 98 %)."],"en":["Evaluate a depression screening scale against the clinical interview.","n = 400 (75 people with depression): TP = 68, FN = 7, FP = 51, TN = 274. Sensitivity 90.7%, 95% CI [82.0, 95.4]; specificity 84.3%, 95% CI [80.0, 87.9]; PPV 57.1%; NPV 97.5%.","The test detects 91 in 100 people with depression and correctly rules out 84 in 100 people without depression. With a prevalence of 19%, a negative result rules out depression well (PPV 57%, NPV 98%)."]},"adm":{"es":["Evaluar la exactitud de la alerta automática de fraude en reembolsos frente a la auditoría.","n = 800 (43 fraudes): VP = 35, FN = 8, FP = 37, VN = 720. Sensibilidad 81,4 % (IC 95 %: 67,4–90,3); especificidad 95,1 % (IC 95 %: 93,3–96,4); VPP 48,6 %; VPN 98,9 %.","La prueba detecta 81 de cada 100 fraudes y descarta correctamente 95 de cada 100 reembolsos legítimos. Con una prevalencia del 5 %, muchas alertas son falsas, por eso requieren revisión humana (VPP 49 %, VPN 99 %)."],"en":["Evaluate the automatic reimbursement-fraud alert against audit.","n = 800 (43 fraud cases): TP = 35, FN = 8, FP = 37, TN = 720. Sensitivity 81.4%, 95% CI [67.4, 90.3]; specificity 95.1%, 95% CI [93.3, 96.4]; PPV 48.6%; NPV 98.9%.","The test detects 81 in 100 fraud cases and correctly rules out 95 in 100 legitimate claims. With a prevalence of 5%, many alerts are false, so they need human review (PPV 49%, NPV 99%)."]},"eco":{"es":["Evaluar la exactitud de un indicador de alerta temprana de crisis cambiaria.","n = 600 (53 periodos con crisis): VP = 31, FN = 22, FP = 60, VN = 487. Sensibilidad 58,5 % (IC 95 %: 45,1–70,7); especificidad 89,0 % (IC 95 %: 86,1–91,4); VPP 34,1 %; VPN 95,7 %.","La prueba detecta 58 de cada 100 periodos con crisis y descarta correctamente 89 de cada 100 periodos sin crisis. Con una prevalencia del 9 %, la mayoría de las alertas son falsas alarmas; cuando no alerta, casi nunca hay crisis (VPP 34 %, VPN 96 %)."],"en":["Evaluate an early-warning indicator of currency crises.","n = 600 (53 crisis periods): TP = 31, FN = 22, FP = 60, TN = 487. Sensitivity 58.5%, 95% CI [45.1, 70.7]; specificity 89.0%, 95% CI [86.1, 91.4]; PPV 34.1%; NPV 95.7%.","The test detects 58 in 100 crisis periods and correctly rules out 89 in 100 non-crisis periods. With a prevalence of 9%, most alerts are false alarms; when it does not alert, a crisis almost never follows (PPV 34%, NPV 96%)."]},"ing":{"es":["Evaluar la exactitud de la inspección por visión artificial frente a la inspección destructiva.","n = 1000 (39 piezas defectuosas): VP = 37, FN = 2, FP = 29, VN = 932. Sensibilidad 94,9 % (IC 95 %: 83,1–98,6); especificidad 97,0 % (IC 95 %: 95,7–97,9); VPP 56,1 %; VPN 99,8 %.","La prueba detecta 95 de cada 100 piezas defectuosas y descarta correctamente 97 de cada 100 piezas buenas. Con una prevalencia del 4 %, una pieza aprobada es casi con seguridad buena (VPP 56 %, VPN 100 %)."],"en":["Evaluate machine-vision inspection against destructive testing.","n = 1000 (39 defective parts): TP = 37, FN = 2, FP = 29, TN = 932. Sensitivity 94.9%, 95% CI [83.1, 98.6]; specificity 97.0%, 95% CI [95.7, 97.9]; PPV 56.1%; NPV 99.8%.","The test detects 95 in 100 defective parts and correctly rules out 97 in 100 good parts. With a prevalence of 4%, an approved part is almost certainly good (PPV 56%, NPV 100%)."]},"der":{"es":["Evaluar la exactitud de un instrumento de riesgo de reincidencia.","n = 500 (142 reincidentes): VP = 103, FN = 39, FP = 122, VN = 236. Sensibilidad 72,5 % (IC 95 %: 64,7–79,2); especificidad 65,9 % (IC 95 %: 60,9–70,6); VPP 45,8 %; VPN 85,8 %.","La prueba detecta 73 de cada 100 reincidentes y descarta correctamente 66 de cada 100 no reincidentes. Con una prevalencia del 28 %, clasifica como alto riesgo a muchas personas que no reinciden; usarlo solo para decidir tiene riesgos (VPP 46 %, VPN 86 %)."],"en":["Evaluate the accuracy of a reoffending risk instrument.","n = 500 (142 people who reoffended): TP = 103, FN = 39, FP = 122, TN = 236. Sensitivity 72.5%, 95% CI [64.7, 79.2]; specificity 65.9%, 95% CI [60.9, 70.6]; PPV 45.8%; NPV 85.8%.","The test detects 73 in 100 people who reoffended and correctly rules out 66 in 100 people who did not reoffend. With a prevalence of 28%, it labels many people who do not reoffend as high risk; using it alone for decisions is risky (PPV 46%, NPV 86%)."]}},"mh":{"sal":{"es":["Estimar el efecto del tabaquismo sobre el bajo peso al nacer, ajustando por la edad materna.","Bajo peso al nacer según tabaquismo: OR crudo = 3,06; OR de Mantel-Haenszel ajustado por la edad materna (menor o mayor de 35 años) = 2,07 (IC 95 %: 1,41–3,05); χ² de Cochran-Mantel-Haenszel (1) = 13,80; p < 0,001.","A igual edad materna, las fumadoras tienen 2,07 veces la chance de un recién nacido de bajo peso. El OR bajó de 3,06 a 2,07 al ajustar: parte de la asociación cruda se debía a la edad materna (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the effect of smoking on low birth weight, adjusting for maternal age.","Low birth weight by smoking: crude OR = 3.06; Mantel-Haenszel OR adjusted for maternal age (under or over 35) = 2.07, 95% CI [1.41, 3.05]; Cochran-Mantel-Haenszel χ²(1) = 13.80, p < .001.","Holding maternal age constant, smokers have 2.07 times the odds of a low-birth-weight baby. The OR fell from 3.06 to 2.07 after adjustment: part of the crude association was due to maternal age (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"edu":{"es":["Estimar el efecto de trabajar sobre la deserción, ajustando por el estrato.","Deserción según trabajo: OR crudo = 3,88; OR de Mantel-Haenszel ajustado por el estrato (bajo o medio-alto) = 2,60 (IC 95 %: 1,76–3,82); χ² de Cochran-Mantel-Haenszel (1) = 24,36; p < 0,001.","A igual estrato, los estudiantes que trabajan tienen 2,60 veces la chance de desertar. El OR bajó de 3,88 a 2,60 al ajustar: parte de la asociación cruda se debía al estrato (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the effect of working on dropout, adjusting for stratum.","Dropout by employment: crude OR = 3.88; Mantel-Haenszel OR adjusted for stratum (low or middle-high) = 2.60, 95% CI [1.76, 3.82]; Cochran-Mantel-Haenszel χ²(1) = 24.36, p < .001.","Holding stratum constant, students who work have 2.60 times the odds of dropping out. The OR fell from 3.88 to 2.60 after adjustment: part of the crude association was due to stratum (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"soc":{"es":["Estimar la asociación entre el consumo de alcohol de la pareja y la violencia de pareja, ajustando por la zona.","Violencia según consumo de alcohol de la pareja: OR crudo = 2,38; OR de Mantel-Haenszel ajustado por la zona (urbana o rural) = 1,77 (IC 95 %: 1,23–2,55); χ² de Cochran-Mantel-Haenszel (1) = 9,89; p = 0,002.","A igual zona, las mujeres cuya pareja bebe en exceso tienen 1,77 veces la chance de reportar violencia. El OR bajó de 2,38 a 1,77 al ajustar: parte de la asociación cruda se debía a la zona (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the association between partner's drinking and partner violence, adjusting for area.","Violence by partner's drinking: crude OR = 2.38; Mantel-Haenszel OR adjusted for area (urban or rural) = 1.77, 95% CI [1.23, 2.55]; Cochran-Mantel-Haenszel χ²(1) = 9.89, p = .002.","Holding area constant, women whose partner drinks heavily have 1.77 times the odds of reporting violence. The OR fell from 2.38 to 1.77 after adjustment: part of the crude association was due to area (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"adm":{"es":["Estimar el efecto de las horas extra frecuentes sobre la renuncia, ajustando por el área de la empresa.","Renuncia según horas extra: OR crudo = 3,31; OR de Mantel-Haenszel ajustado por el área (operativa o administrativa) = 2,22 (IC 95 %: 1,50–3,27); χ² de Cochran-Mantel-Haenszel (1) = 16,10; p < 0,001.","A igual área, los empleados con horas extra frecuentes tienen 2,22 veces la chance de renunciar. El OR bajó de 3,31 a 2,22 al ajustar: parte de la asociación cruda se debía al área (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the effect of frequent overtime on resignation, adjusting for department.","Resignation by overtime: crude OR = 3.31; Mantel-Haenszel OR adjusted for department (operations or administration) = 2.22, 95% CI [1.50, 3.27]; Cochran-Mantel-Haenszel χ²(1) = 16.10, p < .001.","Holding department constant, employees with frequent overtime have 2.22 times the odds of resigning. The OR fell from 3.31 to 2.22 after adjustment: part of the crude association was due to department (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"eco":{"es":["Estimar la asociación entre la informalidad del jefe de hogar y la pobreza, ajustando por la zona.","Pobreza según informalidad: OR crudo = 2,90; OR de Mantel-Haenszel ajustado por la zona (rural o urbana) = 1,97 (IC 95 %: 1,34–2,88); χ² de Cochran-Mantel-Haenszel (1) = 12,21; p < 0,001.","A igual zona, los hogares con jefe informal tienen 1,97 veces la chance de estar en pobreza. El OR bajó de 2,90 a 1,97 al ajustar: parte de la asociación cruda se debía a la zona (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the association between informal employment of the household head and poverty, adjusting for area.","Poverty by informality: crude OR = 2.90; Mantel-Haenszel OR adjusted for area (rural or urban) = 1.97, 95% CI [1.34, 2.88]; Cochran-Mantel-Haenszel χ²(1) = 12.21, p < .001.","Holding area constant, households with an informal head have 1.97 times the odds of being poor. The OR fell from 2.90 to 1.97 after adjustment: part of the crude association was due to area (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"ing":{"es":["Estimar el efecto de la sobrecarga sobre la falla del motor, ajustando por el fabricante.","Falla según sobrecarga: OR crudo = 3,38; OR de Mantel-Haenszel ajustado por el fabricante (A o B) = 2,46 (IC 95 %: 1,70–3,56); χ² de Cochran-Mantel-Haenszel (1) = 23,99; p < 0,001.","A igual fabricante, los motores con sobrecarga tienen 2,46 veces la chance de fallar. El OR bajó de 3,38 a 2,46 al ajustar: parte de la asociación cruda se debía al fabricante (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the effect of overload on motor failure, adjusting for manufacturer.","Failure by overload: crude OR = 3.38; Mantel-Haenszel OR adjusted for manufacturer (A or B) = 2.46, 95% CI [1.70, 3.56]; Cochran-Mantel-Haenszel χ²(1) = 23.99, p < .001.","Holding manufacturer constant, overloaded motors have 2.46 times the odds of failing. The OR fell from 3.38 to 2.46 after adjustment: part of the crude association was due to manufacturer (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]},"der":{"es":["Estimar la asociación entre el tipo de defensa y la condena, ajustando por la gravedad del delito.","Condena según defensa pública: OR crudo = 3,00; OR de Mantel-Haenszel ajustado por la gravedad del delito (leve o grave) = 2,03 (IC 95 %: 1,40–2,96); χ² de Cochran-Mantel-Haenszel (1) = 14,40; p < 0,001.","A igual gravedad ddelito, los acusados con defensa pública tienen 2,03 veces la chance de ser condenados. El OR bajó de 3,00 a 2,03 al ajustar: parte de la asociación cruda se debía a la gravedad del delito (confusión).","Si el IC del OR ajustado hubiera incluido el 1, la asociación cruda se explicaría por la variable de confusión."],"en":["Estimate the association between type of defense and conviction, adjusting for offense severity.","Conviction by public defense: crude OR = 3.00; Mantel-Haenszel OR adjusted for offense severity (minor or serious) = 2.03, 95% CI [1.40, 2.96]; Cochran-Mantel-Haenszel χ²(1) = 14.40, p < .001.","Holding offense severity constant, defendants with a public defender have 2.03 times the odds of conviction. The OR fell from 3.00 to 2.03 after adjustment: part of the crude association was due to offense severity (confounding).","If the CI for the adjusted OR had included 1, the crude association would be explained by the confounder."]}},"factorial":{"sal":{"es":["Evaluar el efecto del tipo de dieta y del sexo sobre la pérdida de peso.","Pérdida de peso (kg), diseño 3 × 2 con 20 por celda. Dieta: F(2, 114) = 8,89; p < 0,001; η²p = 0,13. Sexo: F(1, 114) = 0,47; p = 0,494; η²p = 0,00. Interacción: F(2, 114) = 5,75; p = 0,004; η²p = 0,09.","El tipo de dieta influye en la pérdida de peso, el sexo por sí solo no, y la dieta funciona distinto en hombres y mujeres. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de dieta dentro de cada nivel de sexo.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of diet type and sex on weight loss.","Weight loss (kg), 3 × 2 design with 20 per cell. Diet: F(2, 114) = 8.89, p < .001, partial η² = .13. Sex: F(1, 114) = 0.47, p = .494, partial η² = .00. Interaction: F(2, 114) = 5.75, p = .004, partial η² = .09.","Diet type affects weight loss, sex alone does not, and the diet works differently for men and women. Because the interaction is significant, main effects must be read with care: compare diet levels within each sex level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"edu":{"es":["Evaluar el efecto de la modalidad y del género sobre el rendimiento.","Rendimiento (0–100), diseño 3 × 2 con 20 por celda. Modalidad: F(2, 114) = 5,51; p = 0,005; η²p = 0,09. Género: F(1, 114) = 0,13; p = 0,719; η²p = 0,00. Interacción: F(2, 114) = 5,96; p = 0,003; η²p = 0,09.","La modalidad influye en el rendimiento, el género por sí solo no, y el efecto de la modalidad depende del género. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de modalidad dentro de cada nivel de género.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of course format and gender on achievement.","Achievement (0–100), 3 × 2 design with 20 per cell. Format: F(2, 114) = 5.51, p = .005, partial η² = .09. Gender: F(1, 114) = 0.13, p = .719, partial η² = .00. Interaction: F(2, 114) = 5.96, p = .003, partial η² = .09.","Format affects achievement, gender alone does not, and the effect of format depends on gender. Because the interaction is significant, main effects must be read with care: compare format levels within each gender level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"soc":{"es":["Evaluar el efecto del tipo de intervención y de la zona sobre el bienestar.","Bienestar, diseño 3 × 2 con 20 por celda. Intervención: F(2, 114) = 11,46; p < 0,001; η²p = 0,17. Zona: F(1, 114) = 0,90; p = 0,346; η²p = 0,01. Interacción: F(2, 114) = 8,05; p < 0,001; η²p = 0,12.","El tipo de intervención influye, la zona por sí sola no, y la mejor intervención no es la misma en zona urbana y rural. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de intervención dentro de cada nivel de zona.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of intervention type and area on well-being.","Well-being, 3 × 2 design with 20 per cell. Intervention: F(2, 114) = 11.46, p < .001, partial η² = .17. Area: F(1, 114) = 0.90, p = .346, partial η² = .01. Interaction: F(2, 114) = 8.05, p < .001, partial η² = .12.","Intervention type matters, area alone does not, and the best intervention differs between urban and rural areas. Because the interaction is significant, main effects must be read with care: compare intervention levels within each area level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"adm":{"es":["Evaluar el efecto del tipo de incentivo y de la antigüedad sobre la productividad.","Productividad (unidades/hora), diseño 3 × 2 con 20 por celda. Incentivo: F(2, 114) = 6,63; p = 0,002; η²p = 0,10. Antigüedad: F(1, 114) = 0,94; p = 0,335; η²p = 0,01. Interacción: F(2, 114) = 6,88; p = 0,002; η²p = 0,11.","El tipo de incentivo influye, la antigüedad por sí sola no, y el incentivo funciona distinto según la antigüedad. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de incentivo dentro de cada nivel de antigüedad.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of incentive type and tenure on productivity.","Productivity (units/hour), 3 × 2 design with 20 per cell. Incentive: F(2, 114) = 6.63, p = .002, partial η² = .10. Tenure: F(1, 114) = 0.94, p = .335, partial η² = .01. Interaction: F(2, 114) = 6.88, p = .002, partial η² = .11.","Incentive type matters, tenure alone does not, and the incentive works differently by tenure. Because the interaction is significant, main effects must be read with care: compare incentive levels within each tenure level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"eco":{"es":["Evaluar el efecto del tipo de mensaje y del nivel de ingreso sobre el ahorro.","Ahorro (% del ingreso), diseño 3 × 2 con 20 por celda. Mensaje: F(2, 114) = 17,80; p < 0,001; η²p = 0,24. Ingreso: F(1, 114) = 1,33; p = 0,251; η²p = 0,01. Interacción: F(2, 114) = 7,42; p < 0,001; η²p = 0,12.","El tipo de mensaje influye en el ahorro, el ingreso por sí solo no, y el mensaje funciona distinto según el ingreso. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de mensaje dentro de cada nivel de ingreso.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of message framing and income level on saving.","Saving (% of income), 3 × 2 design with 20 per cell. Message: F(2, 114) = 17.80, p < .001, partial η² = .24. Income: F(1, 114) = 1.33, p = .251, partial η² = .01. Interaction: F(2, 114) = 7.42, p < .001, partial η² = .12.","Message framing affects saving, income alone does not, and the message works differently by income. Because the interaction is significant, main effects must be read with care: compare message levels within each income level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"ing":{"es":["Evaluar el efecto de la temperatura y del tipo de catalizador sobre el rendimiento de la reacción.","Rendimiento (%), diseño 3 × 2 con 20 por celda. Temperatura: F(2, 114) = 7,40; p < 0,001; η²p = 0,11. Catalizador: F(1, 114) = 0,00; p = 0,967; η²p = 0,00. Interacción: F(2, 114) = 3,70; p = 0,028; η²p = 0,06.","La temperatura influye en el rendimiento, el catalizador por sí solo no, y el efecto de la temperatura depende del catalizador. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de temperatura dentro de cada nivel de catalizador.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of temperature and catalyst type on reaction yield.","Yield (%), 3 × 2 design with 20 per cell. Temperature: F(2, 114) = 7.40, p < .001, partial η² = .11. Catalyst: F(1, 114) = 0.00, p = .967, partial η² = .00. Interaction: F(2, 114) = 3.70, p = .028, partial η² = .06.","Temperature affects yield, catalyst alone does not, and the effect of temperature depends on the catalyst. Because the interaction is significant, main effects must be read with care: compare temperature levels within each catalyst level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]},"der":{"es":["Evaluar el efecto del tipo de información presentada y del sexo del acusado sobre la pena sugerida por jurados simulados.","Pena sugerida (meses), diseño 3 × 2 con 20 por celda. Información: F(2, 114) = 9,68; p < 0,001; η²p = 0,15. Sexo del acusado: F(1, 114) = 0,15; p = 0,703; η²p = 0,00. Interacción: F(2, 114) = 5,56; p = 0,005; η²p = 0,09.","La información presentada influye en la pena sugerida, el sexo del acusado por sí solo no, y el efecto de la información depende del sexo del acusado. Como la interacción es significativa, los efectos principales se interpretan con cuidado: conviene comparar los niveles de información dentro de cada nivel de sexo del acusado.","Si la interacción no hubiera sido significativa, el efecto de un factor sería similar en todos los niveles del otro."],"en":["Evaluate the effect of information type and defendant's sex on sentences suggested by mock jurors.","Suggested sentence (months), 3 × 2 design with 20 per cell. Information: F(2, 114) = 9.68, p < .001, partial η² = .15. Defendant sex: F(1, 114) = 0.15, p = .703, partial η² = .00. Interaction: F(2, 114) = 5.56, p = .005, partial η² = .09.","The information presented affects the suggested sentence, defendant sex alone does not, and the effect of information depends on defendant sex. Because the interaction is significant, main effects must be read with care: compare information levels within each defendant sex level.","If the interaction had not been significant, the effect of one factor would be similar across levels of the other."]}},"ancova":{"sal":{"es":["Evaluar el efecto del programa sobre la hemoglobina final, ajustando por el valor inicial.","Hemoglobina final (g/dL), medias ajustadas por el valor inicial: programa 11,8 y control 11,3 (n = 45 por grupo); pendientes paralelas (interacción p = 0,79); F(1, 87) = 11,59; p = 0,001; η²p = 0,12.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con programa terminó con 0,5 g/dL más que el grupo control.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the program's effect on final hemoglobin, adjusting for baseline.","Final hemoglobin (g/dL), means adjusted for baseline: program 11.8 and control 11.3 (n = 45 per group); parallel slopes (interaction p = .79); F(1, 87) = 11.59, p = .001, partial η² = .12.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the program group ended 0.5 g/dL higher than the control group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"edu":{"es":["Evaluar el efecto de la tutoría sobre el puntaje final, ajustando por el puntaje inicial.","Puntaje final, medias ajustadas por el valor inicial: tutoría 63,0 y sin tutoría 59,1 (n = 45 por grupo); pendientes paralelas (interacción p = 0,66); F(1, 87) = 9,41; p = 0,003; η²p = 0,10.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con tutoría terminó con 3,9 puntos más que el grupo sin tutoría.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the effect of tutoring on the final score, adjusting for the initial score.","Final score, means adjusted for baseline: tutoring 63.0 and no tutoring 59.1 (n = 45 per group); parallel slopes (interaction p = .66); F(1, 87) = 9.41, p = .003, partial η² = .10.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the tutoring group ended 3.9 points higher than the no tutoring group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"soc":{"es":["Evaluar el efecto de la terapia sobre la depresión final, ajustando por la depresión inicial.","Depresión final, medias ajustadas por el valor inicial: terapia 17,2 y lista de espera 19,8 (n = 45 por grupo); pendientes paralelas (interacción p = 0,94); F(1, 87) = 9,21; p = 0,003; η²p = 0,10.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con terapia terminó con 2,6 puntos menos que el grupo lista de espera.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the effect of therapy on final depression, adjusting for baseline depression.","Final depression, means adjusted for baseline: therapy 17.2 and waitlist 19.8 (n = 45 per group); parallel slopes (interaction p = .94); F(1, 87) = 9.21, p = .003, partial η² = .10.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the therapy group ended 2.6 points lower than the waitlist group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"adm":{"es":["Evaluar el efecto del entrenamiento sobre las ventas, ajustando por las ventas previas.","Ventas finales (millones), medias ajustadas por el valor inicial: entrenamiento 50,3 y sin entrenamiento 47,1 (n = 45 por grupo); pendientes paralelas (interacción p = 0,62); F(1, 87) = 6,22; p = 0,014; η²p = 0,07.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con entrenamiento terminó con 3,2 millones más que el grupo sin entrenamiento.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the effect of training on sales, adjusting for prior sales.","Final sales (million), means adjusted for baseline: training 50.3 and no training 47.1 (n = 45 per group); parallel slopes (interaction p = .62); F(1, 87) = 6.22, p = .014, partial η² = .07.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the training group ended 3.2 million higher than the no training group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"eco":{"es":["Evaluar el efecto de los mensajes comparativos sobre el consumo de energía, ajustando por el consumo previo.","Consumo final (kWh), medias ajustadas por el valor inicial: mensajes 141 y sin mensajes 151 (n = 45 por grupo); pendientes paralelas (interacción p = 0,52); F(1, 87) = 9,43; p = 0,003; η²p = 0,10.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con mensajes terminó con 10 kWh menos que el grupo sin mensajes.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the effect of social-comparison messages on energy use, adjusting for prior use.","Final use (kWh), means adjusted for baseline: messages 141 and no messages 151 (n = 45 per group); parallel slopes (interaction p = .52); F(1, 87) = 9.43, p = .003, partial η² = .10.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the messages group ended 10 kWh lower than the no messages group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"ing":{"es":["Evaluar el efecto del nuevo pulido sobre la rugosidad final, ajustando por la rugosidad inicial.","Rugosidad final (µm), medias ajustadas por el valor inicial: pulido nuevo 0,85 y pulido actual 0,91 (n = 45 por grupo); pendientes paralelas (interacción p = 1,00); F(1, 87) = 10,13; p = 0,002; η²p = 0,10.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con pulido nuevo terminó con 0,06 µm menos que el grupo pulido actual.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the effect of the new polishing method on final roughness, adjusting for initial roughness.","Final roughness (µm), means adjusted for baseline: new polishing 0.85 and current polishing 0.91 (n = 45 per group); parallel slopes (interaction p = 1.00); F(1, 87) = 10.13, p = .002, partial η² = .10.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the new polishing group ended 0.06 µm lower than the current polishing group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]},"der":{"es":["Evaluar el efecto del taller sobre el conocimiento de derechos, ajustando por el conocimiento inicial.","Conocimiento final (0–100), medias ajustadas por el valor inicial: taller 67,7 y sin taller 61,2 (n = 45 por grupo); pendientes paralelas (interacción p = 0,33); F(1, 87) = 11,33; p = 0,001; η²p = 0,12.","Como p < 0,05, los grupos difieren aun después de controlar el valor inicial: a igual valor inicial, el grupo con taller terminó con 6,5 puntos más que el grupo sin taller.","Si p hubiera sido ≥ 0,05, no habría evidencia de efecto después de ajustar por el valor inicial."],"en":["Evaluate the workshop's effect on rights knowledge, adjusting for baseline knowledge.","Final knowledge (0–100), means adjusted for baseline: workshop 67.7 and no workshop 61.2 (n = 45 per group); parallel slopes (interaction p = .33); F(1, 87) = 11.33, p = .001, partial η² = .12.","Because p < .05, the groups differ even after controlling for baseline: at equal baseline, the workshop group ended 6.5 points higher than the no workshop group.","If p had been ≥ .05, there would be no evidence of an effect after adjusting for baseline."]}},"manova":{"sal":{"es":["Determinar el efecto de tres esquemas de rehabilitación sobre la fuerza, el equilibrio y la velocidad de marcha.","3 grupos × 40; lambda de Wilks = 0,85; F(6, 230) = 3,16; p = 0,005. ANOVA por variable (Bonferroni, α = 0,017): fuerza p = 0,001; equilibrio p = 0,681; velocidad de marcha p = 0,476.","Como p < 0,05, los grupos difieren en el conjunto de resultados. Los ANOVA por variable muestran que la diferencia está en fuerza; en las otras dos variables no hay evidencia de diferencia.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias en el conjunto de resultados."],"en":["Determine the effect of three rehabilitation programs on strength, balance, and gait speed.","3 groups × 40; Wilks' Λ = .85; F(6, 230) = 3.16, p = .005. Univariate ANOVAs (Bonferroni, α = .017): strength p = .001; balance p = .681; gait speed p = .476.","Because p < .05, the groups differ on the set of outcomes. The univariate ANOVAs show the difference lies in strength; there is no evidence of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]},"edu":{"es":["Determinar el efecto de tres programas de lectura sobre la fluidez, la comprensión y el vocabulario.","3 grupos × 40; lambda de Wilks = 0,83; F(6, 230) = 3,79; p = 0,001. ANOVA por variable (Bonferroni, α = 0,017): fluidez p = 0,005; comprensión p = 0,051; vocabulario p = 0,239.","Como p < 0,05, los grupos difieren en el conjunto de resultados. Los ANOVA por variable muestran que la diferencia está en fluidez; en las otras dos variables no hay evidencia de diferencia.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias en el conjunto de resultados."],"en":["Determine the effect of three reading programs on fluency, comprehension, and vocabulary.","3 groups × 40; Wilks' Λ = .83; F(6, 230) = 3.79, p = .001. Univariate ANOVAs (Bonferroni, α = .017): fluency p = .005; comprehension p = .051; vocabulary p = .239.","Because p < .05, the groups differ on the set of outcomes. The univariate ANOVAs show the difference lies in fluency; there is no evidence of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]},"soc":{"es":["Determinar el efecto de tres terapias sobre la ansiedad, la depresión y el estrés.","3 grupos × 40; lambda de Wilks = 0,83; F(6, 230) = 3,66; p = 0,002. ANOVA por variable (Bonferroni, α = 0,017): ansiedad p < 0,001; depresión p = 0,032; estrés p = 0,392.","Como p < 0,05, los grupos difieren en el conjunto de resultados. Los ANOVA por variable muestran que la diferencia está en ansiedad; en las otras dos variables no hay evidencia de diferencia.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias en el conjunto de resultados."],"en":["Determine the effect of three therapies on anxiety, depression, and stress.","3 groups × 40; Wilks' Λ = .83; F(6, 230) = 3.66, p = .002. Univariate ANOVAs (Bonferroni, α = .017): anxiety p < .001; depression p = .032; stress p = .392.","Because p < .05, the groups differ on the set of outcomes. The univariate ANOVAs show the difference lies in anxiety; there is no evidence of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]},"adm":{"es":["Determinar el efecto de tres estilos de liderazgo sobre la satisfacción, el compr of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]},"ing":{"es":["Determinar el efecto de tres tratamientos térmicos sobre la dureza, la ductilidad y la resistencia a la tracción.","3 grupos × 40; lambda de Wilks = 0,85; F(6, 230) = 3,14; p = 0,006. ANOVA por variable (Bonferroni, α = 0,017): dureza p = 0,009; ductilidad p = 0,566; resistencia a la tracción p = 0,361.","Como p < 0,05, los grupos difieren en el conjunto de resultados. Los ANOVA por variable muestran que la diferencia está en dureza; en las otras dos variables no hay evidencia de diferencia.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias en el conjunto de resultados."],"en":["Determine the effect of three heat treatments on hardness, ductility, and tensile strength.","3 groups × 40; Wilks' Λ = .85; F(6, 230) = 3.14, p = .006. Univariate ANOVAs (Bonferroni, α = .017): hardness p = .009; ductility p = .566; tensile strength p = .361.","Because p < .05, the groups differ on the set of outcomes. The univariate ANOVAs show the difference lies in hardness; there is no evidence of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]},"der":{"es":["Comparar la duración, el número de audiencias y el costo de los procesos entre tres tipos de juzgado.","3 grupos × 40; lambda de Wilks = 0,85; F(6, 230) = 3,23; p = 0,005. ANOVA por variable (Bonferroni, α = 0,017): duración p < 0,001; número de audiencias p = 0,226; costo p = 0,034.","Como p < 0,05, los grupos difieren en el conjunto de resultados. Los ANOVA por variable muestran que la diferencia está en duración; en las otras dos variables no hay evidencia de diferencia.","Si p hubiera sido ≥ 0,05, no habría evidencia de diferencias en el conjunto de resultados."],"en":["Compare case duration, number of hearings, and cost across three court types.","3 groups × 40; Wilks' Λ = .85; F(6, 230) = 3.23, p = .005. Univariate ANOVAs (Bonferroni, α = .017): duration p < .001; number of hearings p = .226; cost p = .034.","Because p < .05, the groups differ on the set of outcomes. The univariate ANOVAs show the difference lies in duration; there is no evidence of a difference on the other two.","If p had been ≥ .05, there would be no evidence of differences on the set of outcomes."]}},"doe":{"sal":{"es":["Determinar la combinación de principio activo y gelificante que optimiza la viscosidad de un gel.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de principio activo p < 0,001; interacción p = 0,009; R² = 0,97. Óptimo estimado: principio activo 2,2 % y gelificante 1,8 %, con un valor predicho de viscosidad de 50,8 Pa·s.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine the active ingredient and gelling agent levels that optimize gel viscosity.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for active ingredient p < .001; interaction p = .009; R² = .97. Estimated optimum: active ingredient 2.2% and gelling agent 1.8%, with a predicted viscosity of 50.8 Pa·s.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"edu":{"es":["Determinar la duración de los videos y la frecuencia de los cuestionarios que maximizan la finalización de un curso virtual.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de duración del video p < 0,001; interacción p = 0,004; R² = 0,94. Óptimo estimado: duración del video 9,5 min y videos entre cuestionarios 3,6, con un valor predicho de finalización de 71,4 %.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine video length and quiz frequency that maximize online course completion.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for video length p < .001; interaction p = .004; R² = .94. Estimated optimum: video length 9.5 min and videos between quizzes 3.6, with a predicted completion of 71.4%.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"soc":{"es":["Determinar la longitud del cuestionario y el incentivo que maximizan la tasa de respuesta de una encuesta.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de longitud p < 0,001; interacción p = 0,003; R² = 0,97. Óptimo estimado: longitud 17,6 min y incentivo 12,4 mil pesos, con un valor predicho de tasa de respuesta de 46,1 %.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine questionnaire length and incentive that maximize survey response rate.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for length p < .001; interaction p = .003; R² = .97. Estimated optimum: length 17.6 min and incentive 12.4 thousand pesos, with a predicted response rate of 46.1%.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"adm":{"es":["Determinar el precio y el descuento que maximizan los ingresos de una tienda en línea.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de precio p < 0,001; interacción p = 0,038; R² = 0,96. Óptimo estimado: precio 95 mil pesos y descuento 12,6 %, con un valor predicho de ingreso diario de 12,4 millones.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine the price and discount that maximize online store revenue.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for price p < .001; interaction p = .038; R² = .96. Estimated optimum: price 95 thousand pesos and discount 12.6%, with a predicted daily revenue of 12.4 million.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"eco":{"es":["Determinar la tasa y el plazo de un microcrédito que maximizan la aceptación.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de tasa mensual p < 0,001; interacción p = 0,042; R² = 0,96. Óptimo estimado: tasa mensual 2,1 % y plazo 13,1 meses, con un valor predicho de aceptación de 41,0 %.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine the microloan rate and term that maximize take-up.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for monthly rate p < .001; interaction p = .042; R² = .96. Estimated optimum: monthly rate 2.1% and term 13.1 months, with a predicted take-up of 41.0%.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"ing":{"es":["Determinar la temperatura y el tiempo de curado que maximizan la resistencia de un adhesivo.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de temperatura p < 0,001; interacción p = 0,021; R² = 0,96. Óptimo estimado: temperatura 65 °C y tiempo 44 min, con un valor predicho de resistencia de 18,6 MPa.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine curing temperature and time that maximize adhesive strength.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for temperature p < .001; interaction p = .021; R² = .96. Estimated optimum: temperature 65 °C and time 44 min, with a predicted strength of 18.6 MPa.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]},"der":{"es":["Determinar la duración de las instrucciones al jurado y el número de ayudas visuales que maximizan su comprensión.","Diseño central compuesto (13 corridas, 5 en el centro), modelo de segundo orden: término cuadrático de duración p < 0,001; interacción p = 0,011; R² = 0,96. Óptimo estimado: duración 13,3 min y ayudas visuales 3,4, con un valor predicho de comprensión de 71,6 puntos.","La respuesta tiene un máximo dentro de la región estudiada (los dos autovalores de la parte cuadrática son negativos), y el modelo permite ubicarlo (Box y Wilson, 1951). Conviene confirmarlo con corridas adicionales en ese punto.","Si los términos cuadráticos no hubieran sido significativos, el óptimo estaría fuera de la región explorada y habría que desplazar el experimento."],"en":["Determine jury-instruction length and number of visual aids that maximize comprehension.","Central composite design (13 runs, 5 center points), second-order model: quadratic term for length p < .001; interaction p = .011; R² = .96. Estimated optimum: length 13.3 min and visual aids 3.4, with a predicted comprehension of 71.6 points.","The response has a maximum inside the studied region (both eigenvalues of the quadratic part are negative), and the model locates it (Box & Wilson, 1951). Confirmation runs at that point are advisable.","If the quadratic terms had not been significant, the optimum would lie outside the explored region and the experiment would need to move."]}},"propensity":{"sal":{"es":["Estimar el efecto del seguimiento telefónico sobre el reingreso a 30 días.","399 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,62 antes y 0,09 después. Reingreso: 22,3 % tratados y 31,8 % no tratados; diferencia −9,5 puntos porcentuales (IC 95 %: −15,6 a −3,5). Diferencia sin emparejar: −1,3.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En pacientes comparables, el seguimiento se asoció con 9,5 puntos porcentuales menos de reingreso. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of telephone follow-up on 30-day readmission.","399 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.62 before and 0.09 after. Readmission: 22.3% treated and 31.8% untreated; difference −9.5 percentage points, 95% CI [−15.6, −3.5]. Unmatched difference: −1.3.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable patients, follow-up was associated with 9.5 percentage points fewer readmissions. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"edu":{"es":["Estimar el efecto de asistir a preescolar sobre la lectura en tercer grado.","394 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,68 antes y 0,07 después. Puntaje de lectura: 66,4 tratados y 61,3 no tratados; diferencia 5,1 (IC 95 %: 3,6–6,6). Diferencia sin emparejar: 9,0.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En niños comparables, haber asistido a preescolar se asoció con 5,1 puntos más en lectura. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of attending preschool on third-grade reading.","394 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.68 before and 0.07 after. Reading score: 66.4 treated and 61.3 untreated; difference 5.1, 95% CI [3.6, 6.6]. Unmatched difference: 9.0.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable children, preschool attendance was associated with 5.1 more reading points. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"soc":{"es":["Estimar el efecto del voluntariado sobre el bienestar.","367 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,62 antes y 0,09 después. Bienestar: 71,6 tratados y 66,8 no tratados; diferencia 4,8 (IC 95 %: 3,2–6,3). Diferencia sin emparejar: 9,1.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En personas comparables, hacer voluntariado se asoció con 4,8 puntos más de bienestar. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of volunteering on well-being.","367 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.62 before and 0.09 after. Well-being: 71.6 treated and 66.8 untreated; difference 4.8, 95% CI [3.2, 6.3]. Unmatched difference: 9.1.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable people, volunteering was associated with 4.8 more well-being points. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"adm":{"es":["Estimar el efecto de la certificación ISO sobre la rentabilidad.","400 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,63 antes y 0,10 después. Rentabilidad sobre activos (%): 7,63 tratados y 6,76 no tratados; diferencia 0,87 (IC 95 %: 0,56–1,18). Diferencia sin emparejar: 1,82.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En empresas comparables, la certificación se asoció con 0,87 puntos más de rentabilidad. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of ISO certification on profitability.","400 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.63 before and 0.10 after. Return on assets (%): 7.63 treated and 6.76 untreated; difference 0.87, 95% CI [0.56, 1.18]. Unmatched difference: 1.82.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable firms, certification was associated with 0.87 more points of return on assets. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"eco":{"es":["Estimar el efecto del microcrédito sobre el ingreso del hogar.","374 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,69 antes y 0,09 después. Ingreso mensual (miles de pesos): 2.514 tratados y 2.224 no tratados; diferencia 290 (IC 95 %: 201–379). Diferencia sin emparejar: 532.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En hogares comparables, el microcrédito se asoció con 290 mil pesos más de ingreso mensual. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of microcredit on household income.","374 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.69 before and 0.09 after. Monthly income (thousand pesos): 2,514 treated and 2,224 untreated; difference 290, 95% CI [201, 379]. Unmatched difference: 532.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable households, microcredit was associated with 290 thousand pesos more monthly income. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"ing":{"es":["Estimar el efecto del mantenimiento predictivo sobre las paradas no programadas.","395 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,63 antes y 0,07 después. Paradas al año: 2,55 tratados y 3,25 no tratados; diferencia −0,70 (IC 95 %: −0,94 a −0,46). Diferencia sin emparejar: −0,05.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En equipos comparables, el mantenimiento predictivo se asoció con 0,70 paradas menos al año. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of predictive maintenance on unplanned stoppages.","395 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.63 before and 0.07 after. Stoppages per year: 2.55 treated and 3.25 untreated; difference −0.70, 95% CI [−0.94, −0.46]. Unmatched difference: −0.05.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable machines, predictive maintenance was associated with 0.70 fewer stoppages per year. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]},"der":{"es":["Estimar el efecto de la representación legal gratuita sobre la obtención de la cuota alimentaria.","386 pares emparejados por puntaje de propensión (vecino más cercano, caliper 0,2 DE); diferencia estandarizada máxima de las covariables: 0,70 antes y 0,09 después. Obtención de la cuota: 42,7 % tratados y 32,1 % no tratados; diferencia 10,6 puntos porcentuales (IC 95 %: 3,6–17,6). Diferencia sin emparejar: 19,1.","Después del emparejamiento las covariables quedaron balanceadas (diferencias estandarizadas menores que 0,1). En casos comparables, la representación gratuita se asoció con 10,6 puntos porcentuales más de éxito. La diferencia sin emparejar era distinta porque mezclaba el efecto con la confusión. Puede quedar confusión por variables no medidas.","Si el IC hubiera incluido el 0, no habría evidencia de efecto; y si las covariables hubieran quedado desbalanceadas, la comparación no sería válida."],"en":["Estimate the effect of free legal representation on obtaining child support.","386 pairs matched on the propensity score (nearest neighbor, caliper 0.2 SD); maximum standardized covariate difference: 0.70 before and 0.09 after. Obtaining support: 42.7% treated and 32.1% untreated; difference 10.6 percentage points, 95% CI [3.6, 17.6]. Unmatched difference: 19.1.","After matching, covariates were balanced (standardized differences below 0.1). Among comparable cases, free representation was associated with 10.6 percentage points more success. The unmatched difference was different because it mixed the effect with confounding. Unmeasured confounding may remain.","If the CI had included 0, there would be no evidence of an effect; and if covariates had stayed unbalanced, the comparison would not be valid."]}},"rlm":{"sal":{"es":["Determinar los factores asociados a la presión arterial sistólica en adultos.","Presión sistólica (n = 300): edad β = 0,36 mmHg por año de edad (IC 95 %: 0,23–0,49; p < 0,001), ajustado por IMC y consumo de sal; R² ajustado = 0,45.","A igual IMC y consumo de sal, cada año de edad se asocia con 0,36 mmHg más de presión sistólica. El modelo completo explica el 45 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine factors associated with systolic blood pressure in adults.","Systolic pressure (n = 300): age b = 0.36 mmHg per year of age, 95% CI [0.23, 0.49], p < .001, adjusted for BMI and salt intake; adjusted R² = .45.","Holding BMI and salt intake constant, each year of age is associated with 0.36 mmHg higher systolic pressure. The full model explains 45% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"edu":{"es":["Determinar los factores asociados al puntaje en la prueba estatal.","Puntaje (n = 400): horas de lectura semanales β = 2,4 puntos por hora (IC 95 %: 1,2–3,5; p < 0,001), ajustado por estrato y educación de los padres; R² ajustado = 0,28.","A igual estrato y educación de los padres, cada hora semanal de lectura se asocia con 2,4 puntos más. El modelo completo explica el 28 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine factors associated with state test scores.","Score (n = 400): weekly reading hours b = 2.4 points per hour, 95% CI [1.2, 3.5], p < .001, adjusted for stratum and parents' education; adjusted R² = .28.","Holding stratum and parents' education constant, each weekly hour of reading is associated with 2.4 more points. The full model explains 28% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"soc":{"es":["Determinar los factores asociados al bienestar en adultos.","Bienestar (n = 350): apoyo social (escala 0–40) β = 0,58 puntos por punto de apoyo (IC 95 %: 0,41–0,75; p < 0,001), ajustado por edad, ingreso y estado de salud; R² ajustado = 0,38.","A igual edad, ingreso y estado de salud, cada punto adicional de apoyo social se asocia con 0,58 puntos más de bienestar. El modelo completo explica el 38 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine factors associated with adult well-being.","Well-being (n = 350): social support (0–40 scale) b = 0.58 points per support point, 95% CI [0.41, 0.75], p < .001, adjusted for age, income, and health status; adjusted R² = .38.","Holding age, income, and health status constant, each additional point of social support is associated with 0.58 more well-being points. The full model explains 38% of the variation.","If the CI for b had included 0, the variable would have no significant effect after adjustment."]},"adm":{"es":["Determinar los factores que explican las ventas de los asesores.","Ventas mensuales (n = 200): horas de capacitación β = 1,04 millones por hora (IC 95 %: 0,76–1,32; p < 0,001), ajustado por antigüedad y zona; R² ajustado = 0,40.","A igual antigüedad y zona, cada hora de capacitación se asocia con 1,04 millones más en ventas. El modelo completo explica el 40 % de la variación.","Si el IC de β hubiera incluido el 0, esa variable no tendría efecto significativo después de ajustar."],"en":["Determine factors that explain sales agents' sales.","Monthly sales (n = 200): training hours b = 1.04 million per hour, 95% CI [0.76, 1.32], p < .001, adjusted for tenure and region
